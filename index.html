<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Strike Pro 2.1</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#ffcc00}
canvas{display:block;width:100vw;height:100vh;filter:contrast(1.15) saturate(1.3) brightness(1.08)}
#bloom{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:0.2;background:radial-gradient(ellipse at center,rgba(255,200,100,0.4) 0%,transparent 70%)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.85) 100%)}
#damage-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0) 100%);transition:background 0.3s}
#blind-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;background:rgba(255,255,255,0);transition:background 0.3s}
#hud{position:absolute;top:10px;left:10px;right:10px;font-size:14px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hud-left,#hud-right{background:rgba(0,0,0,0.75);padding:8px;border-radius:5px;border:1px solid #ffcc00;backdrop-filter:blur(3px)}
#hp-bar{width:120px;height:10px;background:#300;border:1px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:linear-gradient(90deg,#0f0,#5f5);transition:width 0.2s}
#round-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:8px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:10;pointer-events:none}
#team-score{display:flex;gap:20px;margin-top:5px}
.ct-score{color:#5af;text-shadow:0 0 8px #5af}.t-score{color:#f55;text-shadow:0 0 8px #f55}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:5;transition:all 0.1s}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,0,0.95);box-shadow:0 0 4px #0f0}
#crosshair::before{left:11px;top:0;width:2px;height:24px}
#crosshair::after{top:11px;left:0;height:2px;width:24px}
#crosshair.spread::before{height:32px}
#crosshair.spread::after{width:32px}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20;background:rgba(0,0,0,0.2)}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:radial-gradient(circle,rgba(255,204,0,0.8),rgba(255,204,0,0.3));border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.5);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,50,50,0.6),rgba(200,0,0,0.3));font-size:14px}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:radial-gradient(circle,rgba(50,150,255,0.6),rgba(0,100,200,0.3));font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,200,0,0.6),rgba(200,150,0,0.3));font-size:12px}
#jump-btn{bottom:30px;right:115px;width:60px;height:60px;background:radial-gradient(circle,rgba(0,200,100,0.6),rgba(0,150,50,0.3));font-size:11px}
#weapon-switch-btn{bottom:130px;right:115px;width:55px;height:55px;background:radial-gradient(circle,rgba(255,150,0,0.6),rgba(200,100,0,0.3));font-size:10px}
#fullscreen-btn{position:absolute;top:10px;right:10px;width:40px;height:40px;background:rgba(0,200,0,0.4);border:2px solid #0f0;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;cursor:pointer}
#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#respawn-timer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#f55;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;display:none}
#minimap{position:absolute;bottom:160px;left:10px;width:120px;height:120px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:5px;pointer-events:none;z-index:15}
#sound-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border:3px solid rgba(255,100,0,0);border-radius:50%;pointer-events:none;z-index:6}
#sound-indicator.active{border:3px solid rgba(255,100,0,0.7);animation:soundPulse 0.5s}
@keyframes soundPulse{0%{transform:translate(-50%,-50%) scale(0.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.screen{position:absolute;inset:0;background:rgba(0,0,0,0.95);color:#ffcc00;display:none;flex-direction:column;align-items:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.active{display:flex}
.screen h1{font-size:32px;margin:10px 0;color:#ff3300;text-shadow:0 0 25px rgba(255,50,0,0.9),0 0 50px rgba(255,100,0,0.5);letter-spacing:2px}
.version-tag{font-size:14px;color:#0f0;background:rgba(0,255,0,0.15);padding:4px 12px;border-radius:12px;border:1px solid #0f0;margin-bottom:10px;text-shadow:0 0 8px #0f0}
.screen h2{font-size:18px;margin:10px 0 8px;color:#ffcc00}
.btn-main{background:linear-gradient(180deg,#ffcc00,#cc9900);color:#000;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:200px;box-shadow:0 4px 15px rgba(255,200,0,0.4)}
.btn-mode{background:linear-gradient(180deg,#5af,#28a);color:#fff;border:none;padding:12px 30px;font-size:16px;font-weight:bold;margin:6px;border-radius:8px;cursor:pointer;min-width:250px}
.btn-map{background:rgba(255,204,0,0.2);border:2px solid #ffcc00;padding:10px;margin:5px;border-radius:8px;cursor:pointer;min-width:180px;color:#fff}
.btn-map.selected{background:rgba(0,255,0,0.3);border-color:#0f0}
.btn-agent{background:rgba(100,100,100,0.3);border:2px solid #888;padding:8px;margin:4px;border-radius:8px;cursor:pointer;min-width:220px;color:#fff;display:flex;align-items:center;gap:10px}
.btn-agent.selected{border-color:#0f0;background:rgba(0,255,0,0.2)}
.btn-agent.locked{opacity:0.5}
.agent-preview{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.agent-bonus{font-size:10px;color:#0f0;margin-top:2px}
#shop-menu{justify-content:flex-start;padding-top:20px;padding-bottom:80px}
#shop-menu h2{position:sticky;top:0;background:rgba(0,0,0,0.95);padding:10px;z-index:101;width:100%;text-align:center;font-size:24px;color:#ffcc00;border-bottom:2px solid #ffcc00}
#shop-items{width:100%;max-width:500px;overflow-y:auto;flex:1;padding:10px 15px 100px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-item{background:linear-gradient(135deg,rgba(255,204,0,0.15),rgba(255,204,0,0.05));border:2px solid #ffcc00;padding:12px;margin:8px 0;width:100%;display:flex;justify-content:space-between;align-items:center;border-radius:10px;transition:all 0.2s}
.shop-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,204,0,0.3)}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:16px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:4px}
.shop-item button{background:linear-gradient(180deg,#0f0,#0a0);color:#000;border:none;padding:10px 18px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;min-width:110px}
.shop-item button:disabled{background:#555;color:#888}
.shop-item button.owned{background:linear-gradient(180deg,#888,#555);color:#fff}
#close-shop{background:linear-gradient(180deg,#f00,#900);color:#fff;border:none;padding:14px 35px;font-size:17px;font-weight:bold;border-radius:10px;cursor:pointer;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:102;min-width:220px}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.7);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000,0 0 30px currentColor;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
.lock-info{font-size:11px;color:#f55;margin-top:3px}
</style>
</head>
<body>

<h2>РЕЖИМ</h2>

</div>

<div id="end-menu" class="screen"><h1 id="end-title">ИГРА ОКОНЧЕНА</h1><div id="end-stats"></div><button class="btn-main" id="restartBtn">В ЛОББИ</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window);
var gameState='LOBBY',gameMode='bomb',selectedMap='inferno',selectedAgent=0;
var totalWins=parseInt(localStorage.getItem('ms_wins')||'0');
var weaponRecoil=0,weaponBob=0,weaponSwayX=0,weaponSwayY=0,reloadAnim=0,headBob=0;
var soundEvents=[];
function addSoundEvent(pos,team,type){soundEvents.push({pos:pos.clone(),team:team,type:type,time:performance.now(),radius:type==='shot'?45:20});if(soundEvents.length>20)soundEvents.shift();}
function getActiveSoundEvents(now){return soundEvents.filter(function(e){return now-e.time<3000;});}
var agents=[
{name:'РЕКРУТ',color:0x4488cc,accentColor:0x2266aa,wins:0,speedBonus:0,hpBonus:0,accuracyBonus:0,desc:'Базовый агент'},
{name:'SAS',color:0x2244aa,accentColor:0x1133aa,wins:3,speedBonus:0.08,hpBonus:0,accuracyBonus:0.05,desc:'+8% скорость, +5% точность'},
{name:'GIGN',color:0x555577,accentColor:0x333355,wins:7,speedBonus:0,hpBonus:15,accuracyBonus:0.08,desc:'+15 HP, +8% точность'},
{name:'IDF',color:0x886644,accentColor:0x664422,wins:15,speedBonus:0.12,hpBonus:10,accuracyBonus:0.03,desc:'+12% скорость, +10 HP'},
{name:'SEAL',color:0x224422,accentColor:0x113311,wins:25,speedBonus:0.05,hpBonus:20,accuracyBonus:0.1,desc:'+20 HP, +10% точность'},
{name:'ЭЛИТА',color:0xddaa00,accentColor:0xbb8800,wins:50,speedBonus:0.15,hpBonus:25,accuracyBonus:0.15,desc:'+25 HP, +15% скорость, +15% точность'}
];
var mapsByMode={bomb:['inferno','dust2','mirage','cache'],dm:['nuke','vertigo','train','overpass']};
var scene=new THREE.Scene();scene.background=new THREE.Color(0xd4a574);scene.fog=new THREE.FogExp2(0xd4a574,0.007);
var camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffeecc,0x886644,1.0));
scene.add(new THREE.AmbientLight(0xffddaa,0.5));
var sun=new THREE.DirectionalLight(0xffeecc,1.4);sun.position.set(60,120,50);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;sun.shadow.bias=-0.0003;scene.add(sun);
var fillLight=new THREE.DirectionalLight(0x88aacc,0.6);fillLight.position.set(-40,60,-30);scene.add(fillLight);
var particles=[];
function createParticle(opts){var geo=opts.geo||new THREE.SphereGeometry(0.05,4,4);var mat=opts.mat||new THREE.MeshBasicMaterial({color:opts.color||0xffff00});var mesh=new THREE.Mesh(geo,mat);mesh.position.copy(opts.pos);scene.add(mesh);particles.push({mesh:mesh,vel:opts.vel||new THREE.Vector3(),life:opts.life||2,maxLife:opts.life||2,gravity:opts.gravity!==undefined?opts.gravity:9.8,onDeath:opts.onDeath});return mesh;}
function createBlood(pos){for(var i=0;i<10;i++){var geo=new THREE.SphereGeometry(0.05+Math.random()*0.06,4,4);var mat=new THREE.MeshBasicMaterial({color:0xaa0000,transparent:true,opacity:0.9});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*3.5,Math.random()*3.5,(Math.random()-0.5)*3.5),life:1.5});}}
function createMuzzleFlash(pos){var geo=new THREE.SphereGeometry(0.2,6,6);var mat=new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:1});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3(0,0,0),life:0.1,gravity:0});var light=new THREE.PointLight(0xffaa00,5,12);light.position.copy(pos);scene.add(light);setTimeout(function(){scene.remove(light);},60);}
function createDust(pos){for(var i=0;i<4;i++){var geo=new THREE.SphereGeometry(0.1,4,4);var mat=new THREE.MeshBasicMaterial({color:0x886644,transparent:true,opacity:0.5});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*0.6,0.4+Math.random()*0.4,(Math.random()-0.5)*0.6),life:1.2,gravity:0.5});}}
function updateParticles(dt){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;if(p.life<=0){scene.remove(p.mesh);if(p.onDeath){try{p.onDeath();}catch(e){}}particles.splice(i,1);continue;}p.vel.y-=p.gravity*dt;p.mesh.position.add(p.vel.clone().multiplyScalar(dt));if(p.mesh.position.y<0.05){p.mesh.position.y=0.05;p.vel.y*=-0.3;}if(p.mesh.material.transparent)p.mesh.material.opacity=p.life/p.maxLife;}}
function makeTex(base,line,size,type){if(!size)size=512;var c=document.createElement('canvas');c.width=c.height=size;var ctx=c.getContext('2d');
var grad=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size);
grad.addColorStop(0,base);grad.addColorStop(0.7,line);grad.addColorStop(1,base);
ctx.fillStyle=grad;ctx.fillRect(0,0,size,size);
for(var i=0;i<1000;i++){ctx.fillStyle='rgba(0,0,0,'+(Math.random()*0.35)+')';ctx.beginPath();ctx.arc(Math.random()*size,Math.random()*size,Math.random()*3,0,6.28);ctx.fill();}
for(var i=0;i<300;i++){ctx.fillStyle='rgba(255,255,255,'+(Math.random()*0.2)+')';ctx.beginPath();ctx.arc(Math.random()*size,Math.random()*size,Math.random()*2.5,0,6.28);ctx.fill();}
if(type==='brick'){ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=3;for(var y=0;y<size;y+=32){var off=(y/32)%2===0?0:32;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(size,y);ctx.stroke();for(var x=off;x<size;x+=64){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+32);ctx.stroke();}}}
else if(type==='wood'){ctx.strokeStyle='rgba(40,20,0,0.6)';ctx.lineWidth=1.5;for(var i=0;i<50;i++){var y=Math.random()*size;ctx.beginPath();ctx.moveTo(0,y);for(var x=0;x<size;x+=12)ctx.lineTo(x,y+(Math.random()-0.5)*5);ctx.stroke();}}
else if(type==='concrete'){ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=2.5;for(var i=0;i<12;i++){ctx.beginPath();var x=Math.random()*size,y=Math.random()*size;ctx.moveTo(x,y);for(var j=0;j<8;j++){x+=(Math.random()-0.5)*50;y+=(Math.random()-0.5)*50;ctx.lineTo(x,y);}ctx.stroke();}}
var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=16;return t;}
var sandTex=makeTex('#c9a57a','#8b6f47',512,'brick');
var woodTex=makeTex('#6b4423','#3d2410',512,'wood');
var stoneTex=makeTex('#8a8070','#5a5040',512,'concrete');
var groundTex=makeTex('#b89968','#7a6540',512,'concrete');groundTex.repeat.set(30,30);
var concreteTex=makeTex('#999988','#666655',512,'concrete');
var metalTex=makeTex('#666677','#444455',512,'concrete');
var walls=[];
var wallMats={sand:new THREE.MeshStandardMaterial({map:sandTex,roughness:0.85,metalness:0.05}),wood:new THREE.MeshStandardMaterial({map:woodTex,roughness:0.7,metalness:0.1}),stone:new THREE.MeshStandardMaterial({map:stoneTex,roughness:0.9,metalness:0.05}),concrete:new THREE.MeshStandardMaterial({map:concreteTex,roughness:0.9,metalness:0.1}),metal:new THREE.MeshStandardMaterial({map:metalTex,roughness:0.4,metalness:0.7})};
function addWall(x,z,w,h,d,matKey,canStandOn){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMats[matKey]||wallMats.sand);m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;m.userData={w:w,h:h,d:d,topY:h,canStandOn:canStandOn!==false};scene.add(m);walls.push(m);return m;}
var floorMesh,mapSpawns={},bombSites={},mapPOIs=[];
function clearMap(){walls.forEach(function(w){scene.remove(w);});walls=[];if(floorMesh)scene.remove(floorMesh);particles.forEach(function(p){scene.remove(p.mesh);});particles=[];mapPOIs=[];}
function loadMap(name){clearMap();
