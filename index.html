<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Strike - Inferno</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;margin:0;padding:0}
body{overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#ffcc00}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:10px;left:10px;right:10px;font-size:14px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hud-left,#hud-right{background:rgba(0,0,0,0.5);padding:8px;border-radius:5px;border:1px solid #ffcc00}
#hp-bar{width:120px;height:10px;background:#300;border:1px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:#0f0;transition:width 0.2s}
#round-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:8px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:10;pointer-events:none}
#team-score{display:flex;gap:20px;margin-top:5px}
.ct-score{color:#5af}
.t-score{color:#f55}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:5}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,0,0.9)}
#crosshair::before{left:9px;top:0;width:2px;height:20px}
#crosshair::after{top:9px;left:0;height:2px;width:20px}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:rgba(255,204,0,0.5);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.5);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:rgba(255,50,50,0.4);font-size:14px}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:rgba(50,150,255,0.4);font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:rgba(255,200,0,0.4);font-size:12px}
#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#menu,#shop-menu,#end-menu,#round-end{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);color:#ffcc00;text-align:center;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto}
#menu.active,#shop-menu.active,#end-menu.active,#round-end.active{display:flex}
#menu h1,#end-menu h1{font-size:32px;margin:0 0 15px;color:#ff3300}
#menu button,#end-menu button{background:#ffcc00;color:#000;border:none;padding:15px 40px;font-size:20px;font-weight:bold;margin-top:20px;border-radius:8px;cursor:pointer}
#shop-menu{justify-content:flex-start;padding-top:30px}
#shop-menu h2{font-size:24px;margin:0 0 15px;color:#ffcc00}
.shop-item{background:rgba(255,204,0,0.1);border:2px solid #ffcc00;padding:10px;margin:6px 0;width:95%;max-width:450px;display:flex;justify-content:space-between;align-items:center;border-radius:8px}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:15px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:3px}
.shop-item button{background:#0f0;color:#000;border:none;padding:8px 15px;font-size:13px;font-weight:bold;border-radius:5px;cursor:pointer}
.shop-item button:disabled{background:#555;color:#888}
.shop-item button.owned{background:#888}
#close-shop{background:#f00;color:#fff;border:none;padding:12px 30px;font-size:16px;margin-top:15px;border-radius:8px;cursor:pointer}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.6);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
.hidden{display:none!important}
</style>
</head>

<script>

// ============ СЦЕНА ============
var scene=new THREE.Scene();
scene.background=new THREE.Color(0xd4a574);
scene.fog=new THREE.Fog(0xd4a574,30,120);
var camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffddaa,0.6));

sun.position.set(40,80,30);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;
sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
scene.add(sun);

// ============ ТЕКСТУРЫ INFERNO ============
function makeTexture(base,line,size){
if(!size)size=128;
var c=document.createElement('canvas');
c.width=c.height=size;
var ctx=c.getContext('2d');
ctx.fillStyle=base;ctx.fillRect(0,0,size,size);
// Шум/кирпичи
ctx.fillStyle=line;
for(var i=0;i<size;i+=16){
for(var j=0;j<size;j+=8){
var off=(j/8)%2===0?0:8;
ctx.fillRect(i+off,j,14,6);
}
}
// Трещины
ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;
for(var k=0;k<3;k++){
ctx.beginPath();
var x=Math.random()*size,y=Math.random()*size;
ctx.moveTo(x,y);
for(var l=0;l<3;l++){
x+=(Math.random()-0.5)*30;
y+=(Math.random()-0.5)*30;
ctx.lineTo(x,y);
}
ctx.stroke();
}
var t=new THREE.CanvasTexture(c);
t.wrapS=t.wrapT=THREE.RepeatWrapping;
return t;
}
var sandTex=makeTexture('#c9a57a','#8b6f47');
var darkWoodTex=makeTexture('#6b4423','#3d2410');
var roofTex=makeTexture('#8b3a1f','#5a2410');
var stoneTex=makeTexture('#8a8070','#5a5040');
var groundTex=makeTexture('#b89968','#7a6540');
groundTex.repeat.set(30,30);

// ============ КАРТА INFERNO ============
var floorMesh=new THREE.Mesh(
new THREE.PlaneGeometry(140,140),
new THREE.MeshStandardMaterial({map:groundTex})
);
floorMesh.rotation.x=-Math.PI/2;
floorMesh.receiveShadow=true;
scene.add(floorMesh);

var walls=[];
var wallMaterials={
sand:new THREE.MeshStandardMaterial({map:sandTex}),
wood:new THREE.MeshStandardMaterial({map:darkWoodTex}),
roof:new THREE.MeshStandardMaterial({map:roofTex}),
stone:new THREE.MeshStandardMaterial({map:stoneTex})
};
function addWall(x,z,w,h,d,matKey,rotY){
if(!rotY)rotY=0;
var geo=new THREE.BoxGeometry(w,h,d);
var m=new THREE.Mesh(geo,wallMaterials[matKey]||wallMaterials.sand);
m.position.set(x,h/2,z);
m.rotation.y=rotY;
m.castShadow=true;m.receiveShadow=true;
m.userData={w:w,h:h,d:d,rotY:rotY};
scene.add(m);
walls.push(m);
return m;
}
// Внешние стены карты
addWall(0,-60,120,6,1,'stone');
addWall(0,60,120,6,1,'stone');
addWall(-60,0,1,6,120,'stone');
addWall(60,0,1,6,120,'stone');

// A-сайт (верх карты) - квартиры
addWall(-30,-40,15,5,1,'sand');
addWall(-30,-30,15,5,1,'sand');
addWall(-37.5,-35,1,5,10,'sand');
addWall(-22.5,-35,1,5,10,'sand');
// Крыша квартир
addWall(-30,-35,16,0.5,11,'roof');
// Ящики на A
addWall(-25,-38,2,2,2,'wood');
addWall(-28,-32,2,2,2,'wood');

// B-сайт (низ карты) - банан
addWall(30,40,12,5,1,'sand');
addWall(30,30,12,5,1,'sand');
addWall(36,35,1,5,10,'sand');
addWall(24,35,1,5,10,'sand');
// Ящики на B
addWall(28,38,2,2,2,'wood');
addWall(32,32,2,2,2,'wood');
addWall(26,34,2,2,2,'wood');

// Мид (центр)
addWall(-10,-10,1,4,20,'sand');
addWall(10,-10,1,4,20,'sand');
// Арка мида
addWall(0,-20,20,4,1,'stone');
addWall(0,0,20,4,1,'stone');

// Боковые проходы
addWall(-40,-15,1,4,15,'sand');
addWall(-25,-15,1,4,15,'sand');
addWall(40,15,1,4,15,'sand');
addWall(25,15,1,4,15,'sand');

// Разбросанные укрытия
addWall(-15,20,3,2,3,'wood');
addWall(15,-20,3,2,3,'wood');
addWall(0,30,4,2,2,'wood');
addWall(0,-30,4,2,2,'wood');
addWall(-45,25,3,2,3,'wood');
addWall(45,-25,3,2,3,'wood');
addWall(-20,45,4,2,2,'wood');
addWall(20,-45,4,2,2,'wood');

// Точки спавна
var CT_SPAWN={x:0,z:-50};
var T_SPAWN={x:0,z:50};

// ============ ОРУЖИЯ (10 штук) ============
var weaponsData={
glock:{name:'GLOCK-18',damage:22,fireRate:150,maxAmmo:20,reserve:60,reloadTime:1800,price:0,spread:0.02,type:'pistol'},
usp:{name:'USP-S',damage:30,fireRate:200,maxAmmo:12,reserve:36,reloadTime:1900,price:500,spread:0.01,type:'pistol'},

deagle:{name:'DESERT EAGLE',damage:85,fireRate:400,maxAmmo:7,reserve:21,reloadTime:2200,price:1200,spread:0.025,type:'pistol'},
mp5:{name:'MP5',damage:25,fireRate:90,maxAmmo:30,reserve:90,reloadTime:2200,price:1500,spread:0.025,type:'smg'},
p90:{name:'P90',damage:22,fireRate:70,maxAmmo:50,reserve:150,reloadTime:2800,price:2000,spread:0.03,type:'smg'},
nova:{name:'NOVA',damage:120,fireRate:900,maxAmmo:8,reserve:24,reloadTime:3500,price:1800,spread:0.08,type:'shotgun'},
ak47:{name:'AK-47',damage:45,fireRate:100,maxAmmo:30,reserve:90,reloadTime:2500,price:2700,spread:0.02,type:'rifle'},
m4a4:{name:'M4A4',damage:38,fireRate:90,maxAmmo:30,reserve:90,reloadTime:2400,price:2900,spread:0.015,type:'rifle'},
awp:{name:'AWP',damage:200,fireRate:1500,maxAmmo:5,reserve:20,reloadTime:3500,price:4750,spread:0.002,type:'sniper'}
};

// ============ ИГРОК ============
var player={
pos:new THREE.Vector3(CT_SPAWN.x,1.7,CT_SPAWN.z),
vel:new THREE.Vector3(),
yaw:0,pitch:0,
hp:100,maxHp:100,
money:800,score:0,kills:0,
currentWeapon:'glock',
weapons:{glock:{name:'GLOCK-18',damage:22,fireRate:150,ammo:20,maxAmmo:20,reserve:60,reloadTime:1800,spread:0.02,type:'pistol'}},
reloading:false,onGround:true,
alive:true,team:'CT',name:'ТЫ'
};
camera.position.copy(player.pos);

// ============ МОДЕЛИ ОРУЖИЯ ============
var gun;
function createGunModel(type){
var g=new THREE.Group();
var mat=new THREE.MeshStandardMaterial({color:0x222222,metalness:0.8,roughness:0.3});
var mat2=new THREE.MeshStandardMaterial({color:0x111111,metalness:0.9});
var woodMat=new THREE.MeshStandardMaterial({color:0x442200,metalness:0.3});
if(type==='pistol'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.35),mat));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.15),mat2);
b.rotation.x=Math.PI/2;b.position.z=-0.22;g.add(b);
}else if(type==='smg'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1,0.14,0.55),mat));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.3),mat2);
b.rotation.x=Math.PI/2;b.position.z=-0.4;g.add(b);
var mag=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.18,0.08),mat);
mag.position.set(0,-0.15,-0.1);g.add(mag);
}else if(type==='shotgun'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.12,0.16,0.7),woodMat));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.45),mat2);
b.rotation.x=Math.PI/2;b.position.z=-0.55;g.add(b);
}else if(type==='rifle'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1,0.15,0.75),mat));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.4),mat2);
b.rotation.x=Math.PI/2;b.position.z=-0.55;g.add(b);
var mag=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.22,0.1),mat);
mag.position.set(0,-0.18,-0.15);g.add(mag);
if(type==='ak47'){
var stock=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.25),woodMat);
stock.position.z=0.4;g.add(stock);
}
}else if(type==='sniper'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1,0.14,1.1),mat));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.6),mat2);
b.rotation.x=Math.PI/2;b.position.z=-0.75;g.add(b);
var scope=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.15),mat2);
scope.position.set(0,0.1,-0.2);g.add(scope);
var stock=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.3),woodMat);
stock.position.z=0.5;g.add(stock);
}
g.position.set(0.25,-0.2,-0.4);
return g;
}
gun=createGunModel('pistol');
camera.add(gun);
scene.add(camera);
var muzzle=new THREE.PointLight(0xffaa00,0,4);
muzzle.position.set(0.25,-0.15,-0.8);
camera.add(muzzle);

// ============ ПЕРСОНАЖИ ============
function createCharacter(teamColor){
var g=new THREE.Group();
var bodyMat=new THREE.MeshStandardMaterial({color:teamColor});
var body=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.2,0.4),bodyMat);
body.position.y=1.0;body.castShadow=true;g.add(body);
var head=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,0.45),new THREE.MeshStandardMaterial({color:0xddaa88}));
head.position.y=1.85;head.castShadow=true;g.add(head);
// Шлем
var helmet=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,0.5),new THREE.MeshStandardMaterial({color:0x222222}));
helmet.position.y=2.05;helmet.castShadow=true;g.add(helmet);
var armMat=bodyMat;
var la=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2),armMat);
la.position.set(-0.55,1.0,0);la.castShadow=true;g.add(la);
var ra=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2),armMat);
ra.position.set(0.55,1.0,0);ra.castShadow=true;g.add(ra);
var legMat=new THREE.MeshStandardMaterial({color:0x333333});
var ll=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.9,0.25),legMat);
ll.position.set(-0.2,0.45,0);ll.castShadow=true;g.add(ll);
var rl=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.9,0.25),legMat);
rl.position.set(0.2,0.45,0);rl.castShadow=true;g.add(rl);

var gunMesh=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.5),new THREE.MeshStandardMaterial({color:0x111111}));

}

// ============ AI ============
var allBots=[];
function createBot(team,name,isAdvanced){
var color=team==='CT'?0x4488cc:0xcc4444;
var g=createCharacter(color);
var spawn=team==='CT'?CT_SPAWN:T_SPAWN;
var x=spawn.x+(Math.random()-0.5)*10;
var z=spawn.z+(Math.random()-0.5)*10;
g.position.set(x,0,z);
g.userData={
hp:100,
team:team,
name:name,
alive:true,
speed:3+Math.random()*1.5,
lastShot:0,
state:'advance', // advance, combat, cover, strafe
target:null,
stateTimer:0,
strafeDir:Math.random()>0.5?1:-1,
coverTarget:null,
weapon:team==='CT'?'m4a4':'ak47',
isAdvanced:isAdvanced,
accuracy:isAdvanced?0.6:0.35
};
scene.add(g);
allBots.push(g);
return g;
}

// ============ ЗВУК ============
var audioCtx;
function initAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playShot(){
if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='square';
o.frequency.setValueAtTime(180,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(30,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.15,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.1);
}
function playHit(){
if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(600,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(150,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.1,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.1);
}
function playBuy(){
if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='sine';
o.frequency.setValueAtTime(800,audioCtx.currentTime);
o.frequency.setValueAtTime(1000,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.15,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.2);
}

var raycaster=new THREE.Raycaster();

function shoot(){
var wp=player.weapons[player.currentWeapon];
var now=performance.now();
if(player.reloading||wp.ammo<=0||now-lastShot<wp.fireRate||shopOpen||!player.alive||!roundActive)return;

dir.applyQuaternion(camera.quaternion);

var targets=[];
for(var i=0;i<allBots.length;i++){
if(allBots[i].userData.alive)allBots[i].traverse(function(c){if(c.isMesh)targets.push(c);});
}
var hits=raycaster.intersectObjects(targets);
if(hits.length>0){
var obj=hits[0].object;
while(obj.parent&&obj.userData.hp===undefined)obj=obj.parent;
if(obj.userData.hp!==undefined&&obj.userData.team!==player.team){
var headshot=hits[0].object.geometry.parameters&&hits[0].object.geometry.parameters.height<0.5;
var dmg=headshot?wp.damage*3:wp.damage;
obj.userData.hp-=dmg;
playHit();

}
}
updateHUD();

}

function collideWalls(pos,radius){
if(!radius)radius=0.4;
for(var i=0;i<walls.length;i++){
var w=walls[i];
var ww=w.userData.w;
var dd=w.userData.d;
var dx=Math.max(0,Math.abs(pos.x-w.position.x)-ww/2);
var dz=Math.max(0,Math.abs(pos.z-w.position.z)-dd/2);
if(dx<radius&&dz<radius){
if(dx<dz)pos.z=w.position.z+Math.sign(pos.z-w.position.z)*(dd/2+radius);
else pos.x=w.position.x+Math.sign(pos.x-w.position.x)*(ww/2+radius);
}
}
}

// ============ AI БОТОВ ============
function findTarget(bot){
var enemies=[];
if(bot.userData.team==='CT'){
for(var i=0;i<allBots.length;i++){
if(allBots[i].userData.team==='T'&&allBots[i].userData.alive)enemies.push(allBots[i]);
}
if(player.alive&&player.team==='T')enemies.push(player);
}else{
for(var i=0;i<allBots.length;i++){
if(allBots[i].userData.team==='CT'&&allBots[i].userData.alive)enemies.push(allBots[i]);
}
if(player.alive&&player.team==='CT')enemies.push(player);
}
var closest=null,minDist=Infinity;
for(var i=0;i<enemies.length;i++){
var e=enemies[i];
var ep=e===player?player.pos:e.position;
var d=bot.position.distanceTo(ep);
if(d<minDist){minDist=d;closest=e;}
}
return closest;
}
function hasLineOfSight(from,to){
var dir=new THREE.Vector3().subVectors(to,from);
var dist=dir.length();
dir.normalize();
raycaster.set(from,dir);
raycaster.far=dist;
var hits=raycaster.intersectObjects(walls);
raycaster.far=Infinity;
return hits.length===0;
}
function updateBot(bot,dt,now){
if(!bot.userData.alive||!roundActive)return;
var target=findTarget(bot);
bot.userData.target=target;
if(!target){
// Патруль к центру
var center=new THREE.Vector3(0,0,0);
var dir=new THREE.Vector3().subVectors(center,bot.position);
dir.y=0;
if(dir.length()>2){
dir.normalize();
bot.rotation.y=Math.atan2(dir.x,dir.z);
bot.position.x+=dir.x*bot.userData.speed*dt;
bot.position.z+=dir.z*bot.userData.speed*dt;
collideWalls(bot.position);
}
return;
}
var tp=target===player?player.pos:target.position;
var toTarget=new THREE.Vector3().subVectors(tp,bot.position);
toTarget.y=0;
var dist=toTarget.length();
toTarget.normalize();
var eyePos=new THREE.Vector3(bot.position.x,1.7,bot.position.z);
var targetEye=new THREE.Vector3(tp.x,1.7,tp.z);
var canSee=hasLineOfSight(eyePos,targetEye)&&dist<40;
if(canSee){
bot.userData.state='combat';
bot.userData.stateTimer=0;
}else{
bot.userData.stateTimer+=dt;
if(bot.userData.stateTimer>2){
bot.userData.state='advance';
bot.userData.stateTimer=0;
}
}
if(bot.userData.state==='combat'){
// Поворот к цели
bot.rotation.y=Math.atan2(toTarget.x,toTarget.z);
// Стрейф для продвинутых
if(bot.userData.isAdvanced&&dist<20){
var strafe=new THREE.Vector3(-toTarget.z,0,toTarget.x);
bot.position.x+=strafe.x*bot.userData.strafeDir*bot.userData.speed*0.5*dt;
bot.position.z+=strafe.z*bot.userData.strafeDir*bot.userData.speed*0.5*dt;
if(Math.random()<0.02)bot.userData.strafeDir*=-1;
collideWalls(bot.position);
}else if(dist>15){
// Сближение
bot.position.x+=toTarget.x*bot.userData.speed*dt;
bot.position.z+=toTarget.z*bot.userData.speed*dt;
collideWalls(bot.position);
}
// Стрельба
var fireRate=weaponsData[bot.userData.weapon].fireRate*1.5;
if(now-bot.userData.lastShot>fireRate&&dist<35){
bot.userData.lastShot=now;
// Шанс попадания
var hitChance=bot.userData.accuracy*(1-dist/50);
if(Math.random()<hitChance){
var dmg=weaponsData[bot.userData.weapon].damage*0.6;
if(target===player){
if(player.alive){
player.hp-=dmg;
playHit();
if(player.hp<=0){
player.hp=0;
player.alive=false;
addKillFeed(bot.userData.name,'ТЫ',false);
}
updateHUD();
}
}else if(target.userData.alive){
target.userData.hp-=dmg;
if(target.userData.hp<=0){
killBot(target,bot);
}
}
}
playShot();
}
}else if(bot.userData.state==='advance'){
// Движение к цели
bot.rotation.y=Math.atan2(toTarget.x,toTarget.z);
bot.position.x+=toTarget.x*bot.userData.speed*dt;
bot.position.z+=toTarget.z*bot.userData.speed*dt;
collideWalls(bot.position);
}
}

// ============ ИГРОВОЙ ЦИКЛ ============
var prevTime=performance.now();
function update(){
requestAnimationFrame(update);
if(gameOver){renderer.render(scene,camera);return;}
var now=performance.now();
var dt=Math.min((now-prevTime)/1000,0.1);
prevTime=now;
// Таймер раунда
if(roundActive){
roundTimer-=dt;
var mins=Math.floor(roundTimer/60);
var secs=Math.floor(roundTimer%60);
document.getElementById('round-timer').textContent=mins+':'+(secs<10?'0':'')+secs;
if(roundTimer<=0){
endRound('T');
return;
}
}
// Движение игрока
if(player.alive&&roundActive&&!shopOpen){
var moveX=0,moveZ=0;
if(isMobile){
if(joystick.active){
var forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
var right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
moveX=(-joystick.dy)*forward.x+joystick.dx*right.x;
moveZ=(-joystick.dy)*forward.z+joystick.dx*right.z;
var len=Math.hypot(moveX,moveZ);
if(len>0){moveX/=len;moveZ/=len;}
moveX*=5*dt;moveZ*=5*dt;
}
}else{
var k=window.getKeys();
if(k){
var forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
var right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
if(k['KeyW']){moveX+=forward.x;moveZ+=forward.z;}
if(k['KeyS']){moveX-=forward.x;moveZ-=forward.z;}
if(k['KeyD']){moveX+=right.x;moveZ+=right.z;}
if(k['KeyA']){moveX-=right.x;moveZ-=right.z;}
var len=Math.hypot(moveX,moveZ);
if(len>0){moveX/=len;moveZ/=len;}
moveX*=6*dt;moveZ*=6*dt;
}
}
player.pos.x+=moveX;
player.pos.z+=moveZ;
collideWalls(player.pos);
player.pos.x=Math.max(-59,Math.min(59,player.pos.x));
player.pos.z=Math.max(-59,Math.min(59,player.pos.z));
}
if(player.pos.y>1.7){
player.vel.y-=15*dt;
player.pos.y+=player.vel.y*dt;
if(player.pos.y<=1.7){player.pos.y=1.7;player.vel.y=0;}
}
camera.position.copy(player.pos);
camera.rotation.order='YXZ';
camera.rotation.y=player.yaw;
camera.rotation.x=player.pitch;
if(firing&&player.alive)shoot();
// Обновление ботов
for(var i=0;i<allBots.length;i++){
updateBot(allBots[i],dt,now);
}
// Проверка конца раунда
if(roundActive){
var ctAlive=player.alive&&player.team==='CT';
var tAlive=false;
for(var i=0;i<allBots.length;i++){
if(allBots[i].userData.alive){
if(allBots[i].userData.team==='CT')ctAlive=true;
else tAlive=true;
}
}
if(!ctAlive&&roundActive){endRound('T');return;}
if(!tAlive&&roundActive){endRound('CT');return;}
}
updateHUD();
renderer.render(scene,camera);
}
function updateHUD(){
document.getElementById('hp').textContent=Math.max(0,Math.floor(player.hp));
document.getElementById('hp-fill').style.width=(player.hp/player.maxHp*100)+'%';
document.getElementById('hp-fill').style.background=player.hp>player.maxHp*0.5?'#0f0':player.hp>player.maxHp*0.25?'#ff0':'#f00';
document.getElementById('money').textContent=player.money;
var wp=player.weapons[player.currentWeapon];
document.getElementById('ammo').textContent=wp.ammo;
document.getElementById('reserve').textContent=wp.reserve;
document.getElementById('score').textContent=player.score;
document.getElementById('kills').textContent=player.kills;
document.getElementById('round-num').textContent=roundNum;
document.getElementById('ct-score').textContent=ctScore;
document.getElementById('t-score').textContent=tScore;
}

// ============ СТАРТ ============
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('startBtn').addEventListener('touchstart',function(e){e.preventDefault();startGame();},{passive:false});
function startGame(){
initAudio();
document.getElementById('menu').classList.remove('active');
roundNum=1;ctScore=0;tScore=0;gameOver=false;
player.money=800;player.score=0;player.kills=0;
player.maxHp=100;
player.currentWeapon='glock';
player.weapons={glock:{name:'GLOCK-18',damage:22,fireRate:150,ammo:20,maxAmmo:20,reserve:60,reloadTime:1800,spread:0.02,type:'pistol'}};
switchWeapon();
startRound();
}
document.getElementById('next-round-btn').addEventListener('click',function(){
document.getElementById('round-end').classList.remove('active');
roundNum++;
startRound();
});
document.getElementById('next-round-btn').addEventListener('touchstart',function(e){
e.preventDefault();
document.getElementById('round-end').classList.remove('active');
roundNum++;
startRound();
},{passive:false});
document.getElementById('restartBtn').addEventListener('click',function(){
document.getElementById('end-menu').classList.remove('active');
document.getElementById('menu').classList.add('active');
});
document.getElementById('close-shop').addEventListener('click',closeShop);
window.addEventListener('resize',function(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
renderer.render(scene,camera);
update();
</script>
</body>
