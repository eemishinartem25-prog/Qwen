<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Strike Pro</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#ffcc00}
canvas{display:block;position:absolute;top:0;left:0;width:100vw;height:100vh;filter:contrast(1.1) saturate(1.2) brightness(1.05)}
#bloom{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:0.2;background:radial-gradient(ellipse at center,rgba(255,200,100,0.3) 0%,transparent 70%)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.75) 100%)}
#damage-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0) 100%);transition:background 0.3s}
#blind-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;background:rgba(255,255,255,0);transition:background 0.3s}
#hud{position:absolute;top:10px;left:10px;right:10px;font-size:14px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hud-left,#hud-right{background:rgba(0,0,0,0.75);padding:8px;border-radius:5px;border:1px solid #ffcc00;backdrop-filter:blur(3px)}
#hp-bar{width:120px;height:10px;background:#300;border:1px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:linear-gradient(90deg,#0f0,#5f5);transition:width 0.2s}
#round-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:8px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:10;pointer-events:none}
#team-score{display:flex;gap:20px;margin-top:5px}
.ct-score{color:#5af;text-shadow:0 0 8px #5af}.t-score{color:#f55;text-shadow:0 0 8px #f55}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:5;transition:all 0.1s}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,0,0.95);box-shadow:0 0 4px #0f0}
#crosshair::before{left:11px;top:0;width:2px;height:24px}
#crosshair::after{top:11px;left:0;height:2px;width:24px}
#crosshair.spread::before{height:30px;left:11px}
#crosshair.spread::after{width:30px;top:11px}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20;background:rgba(0,0,0,0.2)}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:radial-gradient(circle,rgba(255,204,0,0.8),rgba(255,204,0,0.3));border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.5);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,50,50,0.6),rgba(200,0,0,0.3));font-size:14px}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:radial-gradient(circle,rgba(50,150,255,0.6),rgba(0,100,200,0.3));font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,200,0,0.6),rgba(200,150,0,0.3));font-size:12px}
#jump-btn{bottom:30px;right:115px;width:60px;height:60px;background:radial-gradient(circle,rgba(0,200,100,0.6),rgba(0,150,50,0.3));font-size:11px}
#grenade-btn{bottom:200px;right:115px;width:55px;height:55px;background:radial-gradient(circle,rgba(150,100,255,0.6),rgba(100,50,200,0.3));font-size:10px}
#weapon-switch-btn{bottom:130px;right:115px;width:55px;height:55px;background:radial-gradient(circle,rgba(255,150,0,0.6),rgba(200,100,0,0.3));font-size:10px}
#plant-btn,#defuse-btn{bottom:280px;right:40px;width:60px;height:60px;font-size:10px;display:none}
#plant-btn{background:radial-gradient(circle,rgba(255,150,0,0.8),rgba(200,100,0,0.4))}
#defuse-btn{background:radial-gradient(circle,rgba(0,150,255,0.8),rgba(0,100,200,0.4))}
#fullscreen-btn{position:absolute;top:10px;right:10px;width:40px;height:40px;background:rgba(0,200,0,0.4);border:2px solid #0f0;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;cursor:pointer}
#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#spectate-info{position:absolute;top:50%;left:50%;transform:translate(-50%,-100px);background:rgba(0,0,0,0.8);padding:10px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:15;pointer-events:none;display:none}
#respawn-timer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#f55;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;display:none}
#minimap{position:absolute;bottom:160px;left:10px;width:120px;height:120px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:5px;pointer-events:none;z-index:15}
#kill-streak{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#ff0;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:15;opacity:0;transition:opacity 0.3s}
.screen{position:absolute;inset:0;background:rgba(0,0,0,0.95);color:#ffcc00;display:none;flex-direction:column;align-items:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.active{display:flex}
.screen h1{font-size:28px;margin:10px 0;color:#ff3300;text-shadow:0 0 20px rgba(255,50,0,0.8)}
.screen h2{font-size:18px;margin:10px 0 8px;color:#ffcc00}
.btn-main{background:linear-gradient(180deg,#ffcc00,#cc9900);color:#000;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:200px}
.btn-mode{background:linear-gradient(180deg,#5af,#28a);color:#fff;border:none;padding:12px 30px;font-size:16px;font-weight:bold;margin:6px;border-radius:8px;cursor:pointer;min-width:250px}
.btn-map{background:rgba(255,204,0,0.2);border:2px solid #ffcc00;padding:10px;margin:5px;border-radius:8px;cursor:pointer;min-width:180px;color:#fff}
.btn-map.selected{background:rgba(0,255,0,0.3);border-color:#0f0}
.btn-agent{background:rgba(100,100,100,0.3);border:2px solid #888;padding:8px;margin:4px;border-radius:8px;cursor:pointer;min-width:220px;color:#fff;display:flex;align-items:center;gap:10px}
.btn-agent.selected{border-color:#0f0;background:rgba(0,255,0,0.2)}
.btn-agent.locked{opacity:0.5}
.agent-preview{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.agent-bonus{font-size:10px;color:#0f0;margin-top:2px}
#shop-menu{justify-content:flex-start;padding-top:20px;padding-bottom:80px}
#shop-menu h2{position:sticky;top:0;background:rgba(0,0,0,0.95);padding:10px;z-index:101;width:100%;text-align:center;font-size:24px;color:#ffcc00;text-shadow:0 0 10px rgba(255,200,0,0.5);border-bottom:2px solid #ffcc00}
#shop-items{width:100%;max-width:500px;overflow-y:auto;flex:1;padding:10px 15px 100px;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#ffcc00 rgba(0,0,0,0.3)}
#shop-items::-webkit-scrollbar{width:8px}
#shop-items::-webkit-scrollbar-track{background:rgba(0,0,0,0.3);border-radius:4px}
#shop-items::-webkit-scrollbar-thumb{background:#ffcc00;border-radius:4px}
#shop-items::-webkit-scrollbar-thumb:hover{background:#ffdd33}
.shop-item{background:linear-gradient(135deg,rgba(255,204,0,0.15),rgba(255,204,0,0.05));border:2px solid #ffcc00;padding:12px;margin:8px 0;width:100%;display:flex;justify-content:space-between;align-items:center;border-radius:10px;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.shop-item:hover{background:linear-gradient(135deg,rgba(255,204,0,0.25),rgba(255,204,0,0.1));transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,204,0,0.3)}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:16px;font-weight:bold;color:#fff;text-shadow:0 0 5px rgba(255,255,255,0.3)}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:4px;line-height:1.4}
.shop-item button{background:linear-gradient(180deg,#0f0,#0a0);color:#000;border:none;padding:10px 18px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;min-width:110px;box-shadow:0 2px 8px rgba(0,255,0,0.3);transition:all 0.2s}
.shop-item button:hover:not(:disabled){background:linear-gradient(180deg,#3f3,#0c0);transform:scale(1.05)}
.shop-item button:disabled{background:linear-gradient(180deg,#555,#333);color:#888;box-shadow:none;cursor:not-allowed}
#close-shop{background:linear-gradient(180deg,#f00,#900);color:#fff;border:none;padding:14px 35px;font-size:17px;font-weight:bold;border-radius:10px;cursor:pointer;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:102;min-width:220px;box-shadow:0 4px 15px rgba(255,0,0,0.4);transition:all 0.2s}
#close-shop:hover{background:linear-gradient(180deg,#f33,#a00);transform:translateX(-50%) scale(1.05)}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.7);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
#bomb-status{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,0.8);padding:8px 20px;border:2px solid #f00;border-radius:5px;font-size:18px;color:#fff;display:none;z-index:15;pointer-events:none;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.lock-info{font-size:11px;color:#f55;margin-top:3px}
.rank-badge{display:inline-block;padding:3px 8px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#000;border-radius:3px;font-weight:bold;margin-left:5px}
</style>
</head>
<body>
<div id="bloom"></div>
<div id="vignette"></div>
<div id="damage-overlay"></div>
<div id="blind-overlay"></div>
<div id="crosshair"></div>
<div id="hit-marker">✕</div>
<div id="round-msg"></div>
<div id="kill-streak"></div>
<div id="bomb-status">💣 бомба: <span id="bomb-timer">40</span>с</div>
<div id="round-info"><span id="round-title">РАУНД 1</span> | <span id="round-timer">1:45</span>
<div id="team-score"><span class="ct-score">CT: <span id="ct-score">0</span></span><span class="t-score">T: <span id="t-score">0</span></span></div></div>
<div id="hud">
<div id="hud-left">HP: <span id="hp">100</span><div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div style="margin-top:5px">💰 <span id="money">800</span></div>
<div style="font-size:12px">🛡️ <span id="armor">0</span>% <span id="rank-display"></span></div></div>
<div id="hud-right"><div id="weapon-name">GLOCK</div>
<span id="ammo">20</span>/<span id="reserve">60</span><br>СЧЕТ: <span id="score">0</span> | K: <span id="kills">0</span></div></div>
<div id="kill-feed"></div>
<canvas id="minimap" width="120" height="120"></canvas>
<div id="spectate-info">НАБЛЮДЕНИЕ: <span id="spectate-name">-</span><br><small>Тап/клик для смены</small></div>
<div id="respawn-timer"></div>
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="fire-btn" class="action-btn">ОГОНЬ</button>
<button id="jump-btn" class="action-btn">ПРЫГ</button>
<button id="reload-btn" class="action-btn">R</button>
<button id="weapon-switch-btn" class="action-btn">🔄</button>
<button id="grenade-btn" class="action-btn">💣</button>
<button id="shop-btn" class="action-btn">🛒</button>
<button id="plant-btn" class="action-btn">💣</button>
<button id="defuse-btn" class="action-btn">🔧</button>
<button id="fullscreen-btn">⛶</button>
<div id="lobby" class="screen active">
<h1>MINI STRIKE PRO</h1>
<h2>РЕЖИМ</h2>
<button class="btn-mode" data-mode="bomb">💣 ЗАКЛАДКА БОМБЫ</button>
<button class="btn-mode" data-mode="dm">⚔️ КОМАНДНЫЙ БОЙ</button>
<h2>КАРТА</h2>
<div id="map-list"></div>
<h2>АГЕНТ</h2>
<div id="agent-list"></div>
<div style="margin:15px 0;font-size:13px;color:#aaa">Побед: <span id="total-wins">0</span> | Ранг: <span id="lobby-rank"></span></div>
<button class="btn-main" id="play-btn">В БОЙ!</button>
</div>
<div id="shop-menu" class="screen"><h2>МАГАЗИН</h2><div id="shop-items"></div><button id="close-shop">ЗАКРЫТЬ</button></div>
<div id="round-end" class="screen"><h1 id="round-end-title">РАУНД ОКОНЧЕН</h1><div id="round-end-stats"></div><button class="btn-main" id="next-round-btn">ДАЛЕЕ</button></div>
<div id="end-menu" class="screen"><h1 id="end-title">ИГРА ОКОНЧЕНА</h1><div id="end-stats"></div><button class="btn-main" id="restartBtn">В ЛОББИ</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
console.log('[MiniStrike] Загрузка...');
var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window);
var gameState='LOBBY',gameMode='bomb',selectedMap='inferno',selectedAgent=0;
var totalWins=parseInt(localStorage.getItem('ms_wins')||'0');
var killStreak=0;
var weaponRecoil=0,weaponBob=0,weaponSwayX=0,weaponSwayY=0,lastMoveSpeed=0;
var reloadAnim=0,isReloading=false;
// Агенты с уникальными цветами
var agents=[
{name:'РЕКРУТ',color:0x4488cc,accentColor:0x2266aa,wins:0,speedBonus:0,hpBonus:0,accuracyBonus:0,desc:'Базовый агент'},
{name:'SAS',color:0x2244aa,accentColor:0x1133aa,wins:3,speedBonus:0.08,hpBonus:0,accuracyBonus:0.03,desc:'+8% скорость, +3% точность'},
{name:'GIGN',color:0x555577,accentColor:0x333355,wins:7,speedBonus:0,hpBonus:15,accuracyBonus:0.05,desc:'+15 HP, +5% точность'},
{name:'IDF',color:0x886644,accentColor:0x664422,wins:15,speedBonus:0.12,hpBonus:10,accuracyBonus:0,desc:'+12% скорость, +10 HP'},
{name:'SEAL',color:0x224422,accentColor:0x113311,wins:25,speedBonus:0.05,hpBonus:20,accuracyBonus:0.08,desc:'+20 HP, +8% точность'},
{name:'ЭЛИТА',color:0xddaa00,accentColor:0xbb8800,wins:50,speedBonus:0.15,hpBonus:25,accuracyBonus:0.1,desc:'+25 HP, +15% скорость, +10% точность'}
];
var ranks=[{name:'СЕРЕБРО I',wins:0},{name:'СЕРЕБРО II',wins:3},{name:'СЕРЕБРО ЭЛИТА',wins:7},{name:'Золотая Нова',wins:12},{name:'МАГИСТР',wins:20},{name:'ЛЕГЕНДА ОРЛА',wins:30},{name:'ЛЕГ. ВЫСШ.',wins:50},{name:'ГЛОБАЛ ЭЛИТА',wins:100}];
var mapsByMode={bomb:['inferno','dust2','mirage','cache'],dm:['nuke','vertigo','train','overpass']};
var scene=new THREE.Scene();scene.background=new THREE.Color(0xd4a574);scene.fog=new THREE.FogExp2(0xd4a574,0.008);
var camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffeecc,0x886644,0.9));
scene.add(new THREE.AmbientLight(0xffddaa,0.4));
var sun=new THREE.DirectionalLight(0xffeecc,1.2);sun.position.set(60,120,50);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;sun.shadow.bias=-0.0003;scene.add(sun);
var fillLight=new THREE.DirectionalLight(0x88aacc,0.4);fillLight.position.set(-40,60,-30);scene.add(fillLight);
var particles=[],bulletHoles=[];
function createParticle(opts){var geo=opts.geo||new THREE.SphereGeometry(0.05,4,4);var mat=opts.mat||new THREE.MeshBasicMaterial({color:opts.color||0xffff00});var mesh=new THREE.Mesh(geo,mat);mesh.position.copy(opts.pos);scene.add(mesh);particles.push({mesh:mesh,vel:opts.vel||new THREE.Vector3(),life:opts.life||2,maxLife:opts.life||2,gravity:opts.gravity!==undefined?opts.gravity:9.8,onDeath:opts.onDeath});return mesh;}
function ejectShell(pos){var geo=new THREE.CylinderGeometry(0.02,0.02,0.08,6);var mat=new THREE.MeshStandardMaterial({color:0xddaa44,metalness:0.9,roughness:0.2});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*2,3+Math.random()*2,(Math.random()-0.5)*2),life:3});}
function createBlood(pos){for(var i=0;i<8;i++){var geo=new THREE.SphereGeometry(0.05+Math.random()*0.05,4,4);var mat=new THREE.MeshBasicMaterial({color:0xaa0000,transparent:true,opacity:0.8});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*3,Math.random()*3,(Math.random()-0.5)*3),life:1.5});}}
function createBulletHole(pos,normal){var geo=new THREE.CircleGeometry(0.08,8);var mat=new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:0.8,side:THREE.DoubleSide});var hole=new THREE.Mesh(geo,mat);hole.position.copy(pos);if(normal)hole.lookAt(pos.clone().add(normal));hole.position.add(normal.clone().multiplyScalar(0.01));scene.add(hole);bulletHoles.push({mesh:hole,life:15});if(bulletHoles.length>50){var old=bulletHoles.shift();scene.remove(old.mesh);}}
function createMuzzleFlash(pos){var geo=new THREE.SphereGeometry(0.15,6,6);var mat=new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:1});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3(0,0,0),life:0.08,gravity:0});var light=new THREE.PointLight(0xffaa00,3,8);light.position.copy(pos);scene.add(light);setTimeout(function(){scene.remove(light);},50);}
function createSmoke(pos){var geo=new THREE.SphereGeometry(0.5,8,8);var mat=new THREE.MeshBasicMaterial({color:0xcccccc,transparent:true,opacity:0.6});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*0.5,0.5+Math.random()*0.5,(Math.random()-0.5)*0.5),life:8,gravity:-0.3});}
function updateParticles(dt){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;if(p.life<=0){scene.remove(p.mesh);if(p.onDeath){try{p.onDeath();}catch(e){}}particles.splice(i,1);continue;}p.vel.y-=p.gravity*dt;p.mesh.position.add(p.vel.clone().multiplyScalar(dt));if(p.mesh.position.y<0.05){p.mesh.position.y=0.05;p.vel.y*=-0.3;p.vel.x*=0.7;p.vel.z*=0.7;}if(p.mesh.material.transparent)p.mesh.material.opacity=p.life/p.maxLife;p.mesh.rotation.x+=dt*5;p.mesh.rotation.y+=dt*3;}for(var i=bulletHoles.length-1;i>=0;i--){bulletHoles[i].life-=dt;if(bulletHoles[i].life<=0){scene.remove(bulletHoles[i].mesh);bulletHoles.splice(i,1);}else if(bulletHoles[i].life<3)bulletHoles[i].mesh.material.opacity=bulletHoles[i].life/3*0.8;}}

function botBuyWeapon(bot,weaponKey){
var w=weaponsData[weaponKey];
if(!w||bot.userData.money<w.price)return false;
bot.userData.money-=w.price;
bot.userData.weapon=weaponKey;
return true;}
function botBuyLogic(bot,roundNum){
if(roundNum===1){
var pistols=['glock','usp','p250'];
var pick=pistols[Math.floor(Math.random()*pistols.length)];
if(bot.userData.money>=weaponsData[pick].price)botBuyWeapon(bot,pick);
return;}
if(bot.userData.money<1500){
var eco=['usp','p250','mp5'];
var pick=eco[Math.floor(Math.random()*eco.length)];
if(bot.userData.money>=weaponsData[pick].price)botBuyWeapon(bot,pick);
return;}
if(bot.userData.role==='sniper'&&bot.userData.money>=4750){
botBuyWeapon(bot,'awp');
botBuyArmor(bot);
return;}
if(bot.userData.role==='shotgun'&&bot.userData.money>=1800){
botBuyWeapon(bot,'nova');
botBuyArmor(bot);
return;}
var rifles=['ak47','m4a4'];
var pick=rifles[Math.floor(Math.random()*rifles.length)];
if(bot.userData.money>=weaponsData[pick].price){
botBuyWeapon(bot,pick);
botBuyArmor(bot);
if(bot.userData.money>=300&&Math.random()<0.5){
bot.userData.money-=300;
bot.userData.hasGrenade='he';
}}
if(bot.userData.weapon==='glock'&&bot.userData.money>=1500){
botBuyWeapon(bot,'mp5');
botBuyArmor(bot);}}
function botBuyArmor(bot){
if(bot.userData.money>=600&&bot.userData.armor<50){
bot.userData.money-=600;
bot.userData.armor=50;}}
