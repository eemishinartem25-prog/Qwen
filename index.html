<style>

#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,200,0,0.6),rgba(200,150,0,0.3));font-size:12px}
#jump-btn{bottom:30px;right:115px;width:60px;height:60px;background:radial-gradient(circle,rgba(0,200,100,0.6),rgba(0,150,50,0.3));font-size:11px}
#weapon-switch-btn{bottom:130px;right:115px;width:55px;height:55px;background:radial-gradient(circle,rgba(255,150,0,0.6),rgba(200,100,0,0.3));font-size:10px}

#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#respawn-timer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#f55;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;display:none}
#minimap{position:absolute;bottom:160px;left:10px;width:120px;height:120px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:5px;pointer-events:none;z-index:15}
.screen{position:absolute;inset:0;background:rgba(0,0,0,0.95);color:#ffcc00;display:none;flex-direction:column;align-items:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}

.btn-main{background:linear-gradient(180deg,#ffcc00,#cc9900);color:#000;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:200px}
.btn-mode{background:linear-gradient(180deg,#5af,#28a);color:#fff;border:none;padding:12px 30px;font-size:16px;font-weight:bold;margin:6px;border-radius:8px;cursor:pointer;min-width:250px}
.btn-map{background:rgba(255,204,0,0.2);border:2px solid #ffcc00;padding:10px;margin:5px;border-radius:8px;cursor:pointer;min-width:180px;color:#fff}
.btn-map.selected{background:rgba(0,255,0,0.3);border-color:#0f0}
.btn-agent{background:rgba(100,100,100,0.3);border:2px solid #888;padding:8px;margin:4px;border-radius:8px;cursor:pointer;min-width:220px;color:#fff;display:flex;align-items:center;gap:10px}
.btn-agent.selected{border-color:#0f0;background:rgba(0,255,0,0.2)}
.btn-agent.locked{opacity:0.5}
.agent-preview{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.agent-bonus{font-size:10px;color:#0f0;margin-top:2px}
#shop-menu{justify-content:flex-start;padding-top:20px;padding-bottom:80px}
#shop-menu h2{position:sticky;top:0;background:rgba(0,0,0,0.95);padding:10px;z-index:101;width:100%;text-align:center;font-size:24px;color:#ffcc00;border-bottom:2px solid #ffcc00}
#shop-items{width:100%;max-width:500px;overflow-y:auto;flex:1;padding:10px 15px 100px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-item{background:linear-gradient(135deg,rgba(255,204,0,0.15),rgba(255,204,0,0.05));border:2px solid #ffcc00;padding:12px;margin:8px 0;width:100%;display:flex;justify-content:space-between;align-items:center;border-radius:10px;transition:all 0.2s}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:16px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:4px}
.shop-item button{background:linear-gradient(180deg,#0f0,#0a0);color:#000;border:none;padding:10px 18px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;min-width:110px}
.shop-item button:disabled{background:#555;color:#888}
#close-shop{background:linear-gradient(180deg,#f00,#900);color:#fff;border:none;padding:14px 35px;font-size:17px;font-weight:bold;border-radius:10px;cursor:pointer;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:102;min-width:220px}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.7);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
.lock-info{font-size:11px;color:#f55;margin-top:3px}
.rank-badge{display:inline-block;padding:3px 8px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#000;border-radius:3px;font-weight:bold;margin-left:5px}
</style>
</head>

<script>

function makeTex(base,line,size,type){if(!size)size=256;var c=document.createElement('canvas');c.width=c.height=size;var ctx=c.getContext('2d');ctx.fillStyle=base;ctx.fillRect(0,0,size,size);for(var i=0;i<500;i++){ctx.fillStyle='rgba(0,0,0,'+(Math.random()*0.25)+')';ctx.beginPath();ctx.arc(Math.random()*size,Math.random()*size,Math.random()*2,0,6.28);ctx.fill();}if(type==='brick'){ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=2;for(var y=0;y<size;y+=32){var off=(y/32)%2===0?0:32;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(size,y);ctx.stroke();for(var x=off;x<size;x+=64){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+32);ctx.stroke();}}}var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

function shoot(){var wp=player.weapons[player.currentWeapon],now=performance.now();if(player.reloading||wp.ammo<=0||now-lastShot<wp.fireRate||shopOpen||!player.alive||!roundActive||gameState!=='PLAYING')return;lastShot=now;wp.ammo--;snd('shot');weaponRecoil=wp.recoil||0.1;var ch=document.getElementById('crosshair');if(ch)ch.classList.add('spread');setTimeout(function(){if(ch)ch.classList.remove('spread');},200);gun.position.z=-0.3;setTimeout(function(){gun.position.z=-0.4;},60);createMuzzleFlash(camera.position.clone());var currentSpread=wp.spread*(player.moving?2.5:1)*(!player.onGround?3:1);var d=new THREE.Vector3((Math.random()-0.5)*currentSpread,(Math.random()-0.5)*currentSpread,-1);d.applyQuaternion(camera.quaternion).normalize();raycaster.set(camera.position,d);var tgts=[];allBots.forEach(function(b){if(b.userData.alive)b.traverse(function(c){if(c.isMesh)tgts.push(c);});});var hBots=raycaster.intersectObjects(tgts);if(hBots.length>0){var o=hBots[0].object;while(o.parent&&o.userData.hp===undefined)o=o.parent;if(o.userData.hp!==undefined&&o.userData.team!==player.team){var hs=hBots[0].object.geometry.parameters&&hBots[0].object.geometry.parameters.height<0.5;var dm=hs?wp.damage*3:wp.damage;if(o.userData.armor>0)dm*=(1-o.userData.armor/100);o.userData.hp-=dm;createBlood(hBots[0].point);snd('hit');showHM();if(o.userData.hp<=0)killEntity(o,player);}}updHUD();if(wp.ammo===0&&wp.reserve>0)reload();}

function collideW(pos,vel,radius){if(!radius)radius=0.4;var onGround=false,standY=0;var feetY=pos.y-1.7;for(var i=0;i<walls.length;i++){var w=walls[i],ww=w.userData.w,dd=w.userData.d,topY=w.userData.topY;if(feetY<topY-0.3){var dx=Math.max(0,Math.abs(pos.x-w.position.x)-ww/2);var dz=Math.max(0,Math.abs(pos.z-w.position.z)-dd/2);if(dx<radius&&dz<radius){if(dx<dz)pos.z=w.position.z+Math.sign(pos.z-w.position.z)*(dd/2+radius);else pos.x=w.position.x+Math.sign(pos.x-w.position.x)*(ww/2+radius);}}if(w.userData.canStandOn){var inXZ=Math.abs(pos.x-w.position.x)<ww/2+radius&&Math.abs(pos.z-w.position.z)<dd/2+radius;if(inXZ&&feetY>=topY-0.1&&feetY<topY+0.5&&vel.y<=0.5){if(topY>standY)standY=topY;onGround=true;}}}return{onGround:onGround,standY:standY};}

function hasLOS(a,b){var d=new THREE.Vector3().subVectors(b,a),l=d.length();d.normalize();raycaster.set(a,d);raycaster.far=l;var h=raycaster.intersectObjects(walls);raycaster.far=1e9;return h.length===0;}

var tgt=findTgt(b);b.userData.target=tgt;var tp=tgt?(tgt===player?player.pos:tgt.position):null;var dist=tp?b.position.distanceTo(tp):999;var eye=new THREE.Vector3(b.position.x,1.7,b.position.z);var canSee=tp&&hasLOS(eye,new THREE.Vector3(tp.x,1.7,tp.z))&&dist<b.userData.viewDistance;

b.userData.vel.y-=18*dt;b.position.y+=b.userData.vel.y*dt;var col=collideW(b.position,b.userData.vel,0.4);var groundY=col.standY>0?col.standY:0;if(b.position.y<=groundY+0.01){b.position.y=groundY;b.userData.vel.y=0;}
if(Math.abs(b.position.x)>60||Math.abs(b.position.z)>60){var spawn=b.userData.team==='CT'?mapSpawns.ct:mapSpawns.t;b.position.set(spawn.x,groundY,spawn.z);}
if(b.userData.state==='combat'&&tp){var toT=new THREE.Vector3().subVectors(tp,b.position);toT.y=0;toT.normalize();b.rotation.y=Math.atan2(toT.x,toT.z);
if(dist>8){b.position.x+=toT.x*b.userData.speed*dt;b.position.z+=toT.z*b.userData.speed*dt;}
if(dist<15){var st=new THREE.Vector3(-toT.z,0,toT.x);b.position.x+=st.x*b.userData.strafeDir*b.userData.speed*0.4*dt;b.position.z+=st.z*b.userData.strafeDir*b.userData.speed*0.4*dt;if(Math.random()<0.02)b.userData.strafeDir*=-1;}
var wp=weaponsData[b.userData.weapon];var fr=wp.fireRate*3.5;
if(now-b.userData.lastShot>fr&&dist<b.userData.viewDistance&&dist>5){b.userData.lastShot=now;var hc=b.userData.accuracy*Math.max(0.1,1-dist/80);

snd('shot');createMuzzleFlash(b.position.clone().add(new THREE.Vector3(0,1.5,0)));}}
else{var rt=b.userData.route;if(rt&&rt.length>0){var wp=rt[b.userData.wpIdx];var toWP=new THREE.Vector3(wp.x-b.position.x,0,wp.z-b.position.z);var wpDist=toWP.length();

function updateMinimap(){var canvas=document.getElementById('minimap'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,120,120);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,120,120);var scale=0.85,cx=60,cy=60;ctx.fillStyle='rgba(150,150,150,0.5)';walls.forEach(function(w){var x=cx+(w.position.x-player.pos.x)*scale;var y=cy+(w.position.z-player.pos.z)*scale;var ww=w.userData.w*scale;var dd=w.userData.d*scale;if(x>-30&&x<150&&y>-30&&y<150)ctx.fillRect(x-ww/2,y-dd/2,ww,dd);});allBots.forEach(function(b){if(b.userData.alive&&b.userData.team===player.team){var x=cx+(b.position.x-player.pos.x)*scale;var y=cy+(b.position.z-player.pos.z)*scale;if(x>0&&x<120&&y>0&&y<120){ctx.fillStyle='#5af';ctx.beginPath();ctx.arc(x,y,2.5,0,6.28);ctx.fill();}}});allBots.forEach(function(b){if(b.userData.alive&&b.userData.team!==player.team){var d=b.position.distanceTo(player.pos);if(d<25){var x=cx+(b.position.x-player.pos.x)*scale;var y=cy+(b.position.z-player.pos.z)*scale;if(x>0&&x<120&&y>0&&y<120){ctx.fillStyle='#f55';ctx.beginPath();ctx.arc(x,y,2.5,0,6.28);ctx.fill();}}}});ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(cx,cy,3,0,6.28);ctx.fill();}

function startMatch(){initAudio();document.getElementById('lobby').classList.remove('active');loadMap(selectedMap);roundNum=1;ctScore=0;tScore=0;player.score=0;player.kills=0;player.deaths=0;if(gameMode==='dm')player.money=999999;else player.money=800;player.maxHp=100+agents[selectedAgent].hpBonus;player.armor=0;player.currentWeapon='glock';player.weapons={glock:{name:'GLOCK-18',damage:22,fireRate:150,ammo:20,maxAmmo:20,reserve:60,reloadTime:1800,spread:0.025,type:'pistol',bodyColor:0x1a1a1a,accentColor:0x333333,recoil:0.05}};player.weaponSlots=['glock',null];swW();startRound();}
