<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Strike Pro</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
body{margin:0;overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:10px;left:10px;right:10px;color:#ffcc00;font-size:16px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hp-bar{width:100px;height:10px;background:#300;border:2px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:#0f0;transition:width 0.2s}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:5}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,0,0.8)}
#crosshair::before{left:9px;top:0;width:2px;height:20px}
#crosshair::after{top:9px;left:0;height:2px;width:20px}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:rgba(255,204,0,0.5);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.5);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:rgba(255,50,50,0.4);font-size:14px}
#fire-btn:active{background:rgba(255,50,50,0.8)}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:rgba(50,150,255,0.4);font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:rgba(255,200,0,0.4);font-size:12px}
#menu,#shop-menu,#end-menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);color:#ffcc00;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;font-size:14px;padding:15px}
#menu h1,#end-menu h1{font-size:32px;margin:0 0 15px;color:#ff3300}
#menu button,#end-menu button{background:#ffcc00;color:#000;border:none;padding:15px 40px;font-size:20px;font-weight:bold;margin-top:20px;border-radius:8px;cursor:pointer}
#menu button:active,#end-menu button:active{background:#fff}
#shop-menu{justify-content:flex-start;padding-top:40px;overflow-y:auto}
#shop-menu h2{font-size:28px;margin:0 0 20px;color:#ffcc00}
.shop-item{background:rgba(255,204,0,0.1);border:2px solid #ffcc00;padding:15px;margin:10px 0;width:90%;max-width:400px;display:flex;justify-content:space-between;align-items:center;border-radius:8px}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:18px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:12px;color:#aaa;margin-top:5px}
.shop-item button{background:#0f0;color:#000;border:none;padding:10px 20px;font-size:14px;font-weight:bold;border-radius:5px;cursor:pointer}
.shop-item button:disabled{background:#555;color:#888}
#close-shop{background:#f00;color:#fff;border:none;padding:12px 30px;font-size:16px;margin-top:20px;border-radius:8px;cursor:pointer}
.hidden{display:none!important}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#weapon-name{position:absolute;bottom:120px;right:100px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#timer{position:absolute;top:50px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hit-marker">✕</div>
<div id="timer">2:00</div>
<div id="hud">
<div>
HP: <span id="hp">100</span>
<div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div style="margin-top:5px">💰 <span id="money">0</span></div>
</div>
<div style="text-align:right">
<span id="ammo">12</span> / <span id="reserve">36</span><br>
СЧЕТ: <span id="score">0</span><br>
УБИЙСТВ: <span id="kills">0</span>
</div>
</div>
<div id="weapon-name">ПИСТОЛЕТ</div>
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="fire-btn" class="action-btn">ОГОНЬ</button>
<button id="reload-btn" class="action-btn">R</button>
<button id="shop-btn" class="action-btn">🛒</button>
<div id="menu">
<h1>MINI STRIKE PRO</h1>
<div id="controls-info"></div>
<button id="startBtn">НАЧАТЬ ИГРУ</button>
</div>
<div id="shop-menu" class="hidden">
<h2>МАГАЗИН</h2>
<div id="shop-items"></div>
<button id="close-shop">ЗАКРЫТЬ</button>
</div>
<div id="end-menu" class="hidden">
<h1 id="end-title">МИССИЯ ЗАВЕРШЕНА</h1>
<div id="end-stats"></div>
<button id="restartBtn">ИГРАТЬ СНОВА</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent) || ('ontouchstart' in window);
if(isMobile){
document.getElementById('controls-info').innerHTML='ЛЕВАЯ часть: джойстик движения<br>ПРАВАЯ часть: обзор камерой<br>Кнопки: стрельба, перезарядка, магазин';
}else{
document.getElementById('controls-info').innerHTML='WASD — движение<br>МЫШЬ — обзор<br>ЛКМ — огонь | R — перезарядка | B — магазин<br>Кликни по экрану для захвата мыши';
}
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,20,90);
var camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
var sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(30,60,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);
function makeTexture(base,line){
var c=document.createElement('canvas');
c.width=c.height=128;
var ctx=c.getContext('2d');
ctx.fillStyle=base;ctx.fillRect(0,0,128,128);
ctx.strokeStyle=line;ctx.lineWidth=2;
for(var i=0;i<=128;i+=32){
ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,128);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(128,i);ctx.stroke();
}
var t=new THREE.CanvasTexture(c);
t.wrapS=t.wrapT=THREE.RepeatWrapping;
return t;
}
var floorMesh=new THREE.Mesh(
new THREE.PlaneGeometry(120,120),
new THREE.MeshStandardMaterial({map:makeTexture('#6b5d4a','#4a3f30')})
);
floorMesh.rotation.x=-Math.PI/2;
floorMesh.receiveShadow=true;
scene.add(floorMesh);
var walls=[];
function addWall(x,z,w,h,d,color){
if(!color)color='#8b7355';
var m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({map:makeTexture(color,'#3a2f20')})
);
m.position.set(x,h/2,z);
m.castShadow=true;m.receiveShadow=true;
m.userData={w:w,h:h,d:d};
scene.add(m);
walls.push(m);
}
addWall(0,-40,80,5,1);addWall(0,40,80,5,1);
addWall(-40,0,1,5,80);addWall(40,0,1,5,80);
addWall(-15,-10,5,2.5,2);addWall(12,-15,3,2,6);
addWall(-8,15,6,2,2);addWall(18,10,3,3,3);
addWall(0,0,4,2,4);addWall(-25,20,4,2.5,4);
var weaponsData={
pistol:{name:'ПИСТОЛЕТ',damage:25,fireRate:300,maxAmmo:12,reserve:36,reloadTime:1200,price:0},
rifle:{name:'АВТОМАТ',damage:35,fireRate:120,maxAmmo:30,reserve:90,reloadTime:2000,price:800},
shotgun:{name:'ДРОБОВИК',damage:80,fireRate:800,maxAmmo:6,reserve:24,reloadTime:2500,price:1200}
};
var player={
pos:new THREE.Vector3(0,1.7,25),
vel:new THREE.Vector3(),
yaw:0,pitch:0,
hp:100,maxHp:100,
money:0,score:0,kills:0,
currentWeapon:'pistol',
weapons:{pistol:{name:'ПИСТОЛЕТ',damage:25,fireRate:300,ammo:12,maxAmmo:12,reserve:36,reloadTime:1200},rifle:null,shotgun:null},
reloading:false,onGround:true
};
camera.position.copy(player.pos);
var gun;
function createGunModel(type){
var g=new THREE.Group();
if(type==='pistol'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.4),new THREE.MeshStandardMaterial({color:0x222222,metalness:0.8})));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.2),new THREE.MeshStandardMaterial({color:0x111111,metalness:0.9}));
b.rotation.x=Math.PI/2;b.position.z=-0.25;g.add(b);
}else if(type==='rifle'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1,0.15,0.7),new THREE.MeshStandardMaterial({color:0x333333,metalness:0.8})));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.4),new THREE.MeshStandardMaterial({color:0x111111,metalness:0.9}));
b.rotation.x=Math.PI/2;b.position.z=-0.5;g.add(b);
var mag=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.2,0.1),new THREE.MeshStandardMaterial({color:0x222222}));
mag.position.set(0,-0.15,-0.1);g.add(mag);
}else if(type==='shotgun'){
g.add(new THREE.Mesh(new THREE.BoxGeometry(0.12,0.18,0.8),new THREE.MeshStandardMaterial({color:0x442200,metalness:0.6})));
var b=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.5),new THREE.MeshStandardMaterial({color:0x111111,metalness:0.9}));
b.rotation.x=Math.PI/2;b.position.z=-0.6;g.add(b);
}
g.position.set(0.25,-0.2,-0.4);
return g;
}
gun=createGunModel('pistol');
camera.add(gun);
scene.add(camera);
var muzzle=new THREE.PointLight(0xffaa00,0,4);
muzzle.position.set(0.25,-0.15,-0.8);
camera.add(muzzle);
function createCharacter(color){
var g=new THREE.Group();
var body=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.2,0.4),new THREE.MeshStandardMaterial({color:color}));
body.position.y=1.0;body.castShadow=true;g.add(body);
var head=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,0.45),new THREE.MeshStandardMaterial({color:0xddaa88}));
head.position.y=1.85;head.castShadow=true;g.add(head);
var armMat=new THREE.MeshStandardMaterial({color:color});
var la=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2),armMat);
la.position.set(-0.55,1.0,0);la.castShadow=true;g.add(la);
var ra=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2),armMat);
ra.position.set(0.55,1.0,0);ra.castShadow=true;g.add(ra);
var legMat=new THREE.MeshStandardMaterial({color:0x333333});
var ll=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.9,0.25),legMat);
ll.position.set(-0.2,0.45,0);ll.castShadow=true;g.add(ll);
var rl=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.9,0.25),legMat);
rl.position.set(0.2,0.45,0);rl.castShadow=true;g.add(rl);
return g;
}
var enemies=[];
function spawnEnemy(){
var g=createCharacter(0xaa2222);
var x,z;
do{x=(Math.random()-0.5)*70;z=(Math.random()-0.5)*70;}
while(Math.hypot(x-player.pos.x,z-player.pos.z)<15);
g.position.set(x,0,z);
g.userData={hp:100,lastShot:0,speed:2.5+Math.random()*1.5};
scene.add(g);
enemies.push(g);
}
var audioCtx;
function initAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playShot(){
if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='square';
o.frequency.setValueAtTime(150,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(30,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.2,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.1);
}
function playHit(){
if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(600,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(150,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.15,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.1);
}
function playBuy(){
if(!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='sine';
o.frequency.setValueAtTime(800,audioCtx.currentTime);
o.frequency.setValueAtTime(1000,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.2,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.2);
}
var joystick={active:false,dx:0,dy:0,originX:0,originY:0,touchId:null};
var look={active:false,lastX:0,lastY:0,touchId:null};
var firing=false;
var joyZone=document.getElementById('joystick-zone');
var joyKnob=document.getElementById('joystick-knob');
if(isMobile){
joyZone.addEventListener('touchstart',function(e){
e.preventDefault();
var touch=e.changedTouches[0];
joystick.active=true;
joystick.touchId=touch.identifier;
var rect=joyZone.getBoundingClientRect();
joystick.originX=rect.left+rect.width/2;
joystick.originY=rect.top+rect.height/2;
updateJoystick(touch.clientX,touch.clientY);
},{passive:false});
joyZone.addEventListener('touchmove',function(e){
e.preventDefault();
for(var i=0;i<e.changedTouches.length;i++){
if(e.changedTouches[i].identifier===joystick.touchId){
updateJoystick(e.changedTouches[i].clientX,e.changedTouches[i].clientY);
break;
}
}
},{passive:false});
var endJoystick=function(e){
for(var i=0;i<e.changedTouches.length;i++){
if(e.changedTouches[i].identifier===joystick.touchId){
joystick.active=false;
joystick.dx=0;joystick.dy=0;
joyKnob.style.transform='translate(-50%,-50%)';
break;
}
}
};
joyZone.addEventListener('touchend',endJoystick);
joyZone.addEventListener('touchcancel',endJoystick);
document.addEventListener('touchstart',function(e){
for(var i=0;i<e.changedTouches.length;i++){
var t=e.changedTouches[i];
if(t.clientX>innerWidth/2&&!e.target.classList.contains('action-btn')&&!e.target.closest('#shop-menu')&&!e.target.closest('#menu')&&!e.target.closest('#end-menu')){
look.active=true;
look.touchId=t.identifier;
look.lastX=t.clientX;
look.lastY=t.clientY;
}
}
},{passive:false});
document.addEventListener('touchmove',function(e){
for(var i=0;i<e.changedTouches.length;i++){
var t=e.changedTouches[i];
if(look.active&&t.identifier===look.touchId){
var deltaX=t.clientX-look.lastX;
var deltaY=t.clientY-look.lastY;
player.yaw-=deltaX*0.005;
player.pitch-=deltaY*0.005;
player.pitch=Math.max(-Math.PI/2+0.1,Math.min(Math.PI/2-0.1,player.pitch));
look.lastX=t.clientX;
look.lastY=t.clientY;
}
}
},{passive:false});
var endLook=function(e){
for(var i=0;i<e.changedTouches.length;i++){
if(e.changedTouches[i].identifier===look.touchId){
look.active=false;
break;
}
}
};
document.addEventListener('touchend',endLook);
document.addEventListener('touchcancel',endLook);
document.getElementById('fire-btn').addEventListener('touchstart',function(e){e.preventDefault();firing=true;},{passive:false});
document.getElementById('fire-btn').addEventListener('touchend',function(e){e.preventDefault();firing=false;});
document.getElementById('reload-btn').addEventListener('touchstart',function(e){e.preventDefault();reload();},{passive:false});
document.getElementById('shop-btn').addEventListener('touchstart',function(e){e.preventDefault();openShop();},{passive:false});
document.getElementById('close-shop').addEventListener('touchstart',function(e){e.preventDefault();closeShop();},{passive:false});
}else{
joyZone.style.display='none';
document.getElementById('fire-btn').style.display='none';
document.getElementById('reload-btn').style.display='none';
document.getElementById('shop-btn').style.display='none';
var keys={};
window.addEventListener('keydown',function(e){
keys[e.code]=true;
if(e.code==='KeyR')reload();
if(e.code==='KeyB')openShop();
if(e.code==='Escape')closeShop();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
renderer.domElement.addEventListener('click',function(){
if(!gameOver&&!shopOpen)renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange',function(){
locked=document.pointerLockElement===renderer.domElement;
});
document.addEventListener('mousemove',function(e){
if(!locked)return;
player.yaw-=e.movementX*0.002;
player.pitch-=e.movementY*0.002;
player.pitch=Math.max(-Math.PI/2+0.1,Math.min(Math.PI/2-0.1,player.pitch));
});
document.addEventListener('mousedown',function(e){
if(e.button===0&&locked)firing=true;
});
document.addEventListener('mouseup',function(e){
if(e.button===0)firing=false;
});
window.getKeys=function(){return keys;};
}
var locked=false;
var shopOpen=false;
function updateJoystick(x,y){
var dx=x-joystick.originX;
var dy=y-joystick.originY;
var dist=Math.hypot(dx,dy);
var maxDist=40;
if(dist>maxDist){dx=(dx/dist)*maxDist;dy=(dy/dist)*maxDist;}
joyKnob.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
joystick.dx=dx/maxDist;
joystick.dy=dy/maxDist;
}
function openShop(){
shopOpen=true;
var shopItems=document.getElementById('shop-items');
shopItems.innerHTML='';
var types=['rifle','shotgun'];
for(var i=0;i<types.length;i++){
var key=types[i];
var data=weaponsData[key];
var owned=player.weapons[key]!==null;
var item=document.createElement('div');
item.className='shop-item';
var btnText=owned?'КУПЛЕНО':data.price+'💰';
var dis=(owned||player.money<data.price)?'disabled':'';
item.innerHTML='<div class="shop-item-info"><div class="shop-item-name">'+data.name+'</div><div class="shop-item-desc">Урон: '+data.damage+' | Магазин: '+data.maxAmmo+'</div></div><button '+dis+' data-weapon="'+key+'">'+btnText+'</button>';
shopItems.appendChild(item);
}
var ammoItem=document.createElement('div');
ammoItem.className='shop-item';
var wp=player.weapons[player.currentWeapon];
var ammoDis=player.money<200?'disabled':'';
ammoItem.innerHTML='<div class="shop-item-info"><div class="shop-item-name">ПАТРОНЫ</div><div class="shop-item-desc">Полный резерв для '+wp.name+'</div></div><button '+ammoDis+' data-action="ammo">200💰</button>';
shopItems.appendChild(ammoItem);
var healItem=document.createElement('div');
healItem.className='shop-item';
var healDis=(player.money<300||player.hp>=player.maxHp)?'disabled':'';
healItem.innerHTML='<div class="shop-item-info"><div class="shop-item-name">АПТЕЧКА</div><div class="shop-item-desc">Восстанавливает 50 HP</div></div><button '+healDis+' data-action="heal">300💰</button>';
shopItems.appendChild(healItem);
var btns=shopItems.querySelectorAll('button');
for(var j=0;j<btns.length;j++){
btns[j].addEventListener('click',function(){
var w=this.getAttribute('data-weapon');
var a=this.getAttribute('data-action');
if(w)buyWeapon(w);
if(a==='ammo')buyAmmo();
if(a==='heal')buyHeal();
});
btns[j].addEventListener('touchstart',function(e){
e.preventDefault();
var w=this.getAttribute('data-weapon');
var a=this.getAttribute('data-action');
if(w)buyWeapon(w);
if(a==='ammo')buyAmmo();
if(a==='heal')buyHeal();
},{passive:false});
}
document.getElementById('shop-menu').classList.remove('hidden');
}
function closeShop(){
shopOpen=false;
document.getElementById('shop-menu').classList.add('hidden');
}
function buyWeapon(type){
var data=weaponsData[type];
if(player.money>=data.price&&!player.weapons[type]){
player.money-=data.price;
player.weapons[type]={name:data.name,damage:data.damage,fireRate:data.fireRate,ammo:data.maxAmmo,maxAmmo:data.maxAmmo,reserve:data.reserve,reloadTime:data.reloadTime};
player.currentWeapon=type;
switchWeapon();
playBuy();
updateHUD();
openShop();
}
}
function buyAmmo(){
if(player.money>=200){
player.money-=200;
var wp=player.weapons[player.currentWeapon];
wp.reserve=wp.maxAmmo*3;
playBuy();
updateHUD();
openShop();
}
}
function buyHeal(){
if(player.money>=300&&player.hp<player.maxHp){
player.money-=300;
player.hp=Math.min(player.maxHp,player.hp+50);
playBuy();
updateHUD();
openShop();
}
}
function switchWeapon(){
camera.remove(gun);
gun=createGunModel(player.currentWeapon);
camera.add(gun);
document.getElementById('weapon-name').textContent=player.weapons[player.currentWeapon].name;
}
var raycaster=new THREE.Raycaster();
var lastShot=0;
function shoot(){
var wp=player.weapons[player.currentWeapon];
var now=performance.now();
if(player.reloading||wp.ammo<=0||now-lastShot<wp.fireRate||shopOpen)return;
lastShot=now;
wp.ammo--;
playShot();
gun.position.z=-0.3;
muzzle.intensity=4;
setTimeout(function(){muzzle.intensity=0;gun.position.z=-0.4;},60);
raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
var enemyMeshes=[];
for(var i=0;i<enemies.length;i++){
enemies[i].traverse(function(c){if(c.isMesh)enemyMeshes.push(c);});
}
var hits=raycaster.intersectObjects(enemyMeshes);
if(hits.length>0){
var obj=hits[0].object;
while(obj.parent&&obj.userData.hp===undefined)obj=obj.parent;
if(obj.userData.hp!==undefined){
var dmg=hits[0].object.geometry.parameters.height>1?wp.damage:wp.damage*2;
obj.userData.hp-=dmg;
playHit();
showHitMarker();
if(obj.userData.hp<=0){
scene.remove(obj);
var idx=enemies.indexOf(obj);
if(idx>-1)enemies.splice(idx,1);
player.score+=100;
player.kills++;
player.money+=150;
}
}
}
updateHUD();
if(wp.ammo===0&&wp.reserve>0)reload();
}
function reload(){
var wp=player.weapons[player.currentWeapon];
if(player.reloading||wp.ammo===wp.maxAmmo||wp.reserve===0)return;
player.reloading=true;
document.getElementById('reload-btn').style.opacity='0.5';
var rt=wp.reloadTime;
setTimeout(function(){
var need=wp.maxAmmo-wp.ammo;
var take=Math.min(need,wp.reserve);
wp.ammo+=take;
wp.reserve-=take;
player.reloading=false;
document.getElementById('reload-btn').style.opacity='1';
updateHUD();
},rt);
}
function showHitMarker(){
var h=document.getElementById('hit-marker');
h.style.opacity='1';
setTimeout(function(){h.style.opacity='0';},120);
}
function collideWalls(pos,radius){
if(!radius)radius=0.4;
for(var i=0;i<walls.length;i++){
var w=walls[i];
var ww=w.userData.w;
var dd=w.userData.d;
var dx=Math.max(0,Math.abs(pos.x-w.position.x)-ww/2);
var dz=Math.max(0,Math.abs(pos.z-w.position.z)-dd/2);
if(dx<radius&&dz<radius){
if(dx<dz)pos.z=w.position.z+Math.sign(pos.z-w.position.z)*(dd/2+radius);
else pos.x=w.position.x+Math.sign(pos.x-w.position.x)*(ww/2+radius);
}
}
}
var lastSpawn=0,gameOver=false;
var prevTime=performance.now();
var gameDuration=0;
var GAME_TIME=120;
function update(){
requestAnimationFrame(update);
if(gameOver){renderer.render(scene,camera);return;}
if(shopOpen){renderer.render(scene,camera);return;}
var now=performance.now();
var dt=Math.min((now-prevTime)/1000,0.1);
prevTime=now;
gameDuration+=dt;
var remaining=Math.max(0,GAME_TIME-gameDuration);
var mins=Math.floor(remaining/60);
var secs=Math.floor(remaining%60);
document.getElementById('timer').textContent=mins+':'+(secs<10?'0':'')+secs;
var moveX=0,moveZ=0;
if(isMobile){
if(joystick.active){
var forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
var right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
moveX=(-joystick.dy)*forward.x+joystick.dx*right.x;
moveZ=(-joystick.dy)*forward.z+joystick.dx*right.z;
var len=Math.hypot(moveX,moveZ);
if(len>0){moveX/=len;moveZ/=len;}
moveX*=5*dt;moveZ*=5*dt;
}
}else{
var k=window.getKeys();
if(k){
var forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
var right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
if(k['KeyW']){moveX+=forward.x;moveZ+=forward.z;}
if(k['KeyS']){moveX-=forward.x;moveZ-=forward.z;}
if(k['KeyD']){moveX+=right.x;moveZ+=right.z;}
if(k['KeyA']){moveX-=right.x;moveZ-=right.z;}
var len=Math.hypot(moveX,moveZ);
if(len>0){moveX/=len;moveZ/=len;}
moveX*=6*dt;moveZ*=6*dt;
}
}
player.pos.x+=moveX;
player.pos.z+=moveZ;
collideWalls(player.pos);
player.pos.x=Math.max(-39,Math.min(39,player.pos.x));
player.pos.z=Math.max(-39,Math.min(39,player.pos.z));
if(player.pos.y>1.7){
player.vel.y-=15*dt;
player.pos.y+=player.vel.y*dt;
if(player.pos.y<=1.7){player.pos.y=1.7;player.vel.y=0;}
}
camera.position.copy(player.pos);
camera.rotation.order='YXZ';
camera.rotation.y=player.yaw;
camera.rotation.x=player.pitch;
if(firing)shoot();
for(var i=0;i<enemies.length;i++){
var e=enemies[i];
var toPlayer=new THREE.Vector3().subVectors(player.pos,e.position);
toPlayer.y=0;
var dist=toPlayer.length();
toPlayer.normalize();
e.rotation.y=Math.atan2(toPlayer.x,toPlayer.z);
if(dist>6){
e.position.x+=toPlayer.x*e.userData.speed*dt;
e.position.z+=toPlayer.z*e.userData.speed*dt;
}
if(now-e.userData.lastShot>1800&&dist<25){
e.userData.lastShot=now;
if(Math.random()<0.4-dist*0.01){
player.hp-=10;
playHit();
if(player.hp<=0){player.hp=0;endGame(false);}
updateHUD();
}
}
}
if(now-lastSpawn>3500&&enemies.length<5){
spawnEnemy();
lastSpawn=now;
}
if(enemies.length===0&&now-lastSpawn>1000){
spawnEnemy();spawnEnemy();
lastSpawn=now;
}
if(gameDuration>=GAME_TIME){
endGame(true);
}
updateHUD();
renderer.render(scene,camera);
}
function updateHUD(){
document.getElementById('hp').textContent=Math.max(0,player.hp);
document.getElementById('hp-fill').style.width=(player.hp/player.maxHp*100)+'%';
document.getElementById('hp-fill').style.background=player.hp>50?'#0f0':player.hp>25?'#ff0':'#f00';
document.getElementById('money').textContent=player.money;
var wp=player.weapons[player.currentWeapon];
document.getElementById('ammo').textContent=wp.ammo;
document.getElementById('reserve').textContent=wp.reserve;
document.getElementById('score').textContent=player.score;
document.getElementById('kills').textContent=player.kills;
}
function endGame(win){
gameOver=true;
firing=false;
if(!isMobile&&document.pointerLockElement)document.exitPointerLock();
var menu=document.getElementById('end-menu');
menu.classList.remove('hidden');
document.getElementById('end-title').textContent=win?'МИССИЯ ВЫПОЛНЕНА!':'ВЫ УБИТЫ';
document.getElementById('end-title').style.color=win?'#0f0':'#f00';
document.getElementById('end-stats').innerHTML='<div style="font-size:18px;margin:20px 0;line-height:2">СЧЕТ: '+player.score+'<br>УБИЙСТВ: '+player.kills+'<br>ДЕНЬГИ: '+player.money+'💰<br>ВРЕМЯ: '+Math.floor(gameDuration)+'с</div>';
}
document.getElementById('startBtn').addEventListener('click',function(){
initAudio();
document.getElementById('menu').classList.add('hidden');
player.pos.set(0,1.7,25);
player.yaw=0;player.pitch=0;
player.hp=100;player.money=0;player.score=0;player.kills=0;
player.currentWeapon='pistol';
player.weapons={
pistol:{name:'ПИСТОЛЕТ',damage:25,fireRate:300,ammo:12,maxAmmo:12,reserve:36,reloadTime:1200},
rifle:null,shotgun:null
};
switchWeapon();
for(var i=0;i<enemies.length;i++)scene.remove(enemies[i]);
enemies.length=0;
gameOver=false;
gameDuration=0;
firing=false;
for(var i=0;i<3;i++)spawnEnemy();
prevTime=performance.now();
update();
});
document.getElementById('startBtn').addEventListener('touchstart',function(e){
e.preventDefault();
initAudio();
document.getElementById('menu').classList.add('hidden');
player.pos.set(0,1.7,25);
player.yaw=0;player.pitch=0;
player.hp=100;player.money=0;player.score=0;player.kills=0;
player.currentWeapon='pistol';
player.weapons={
pistol:{name:'ПИСТОЛЕТ',damage:25,fireRate:300,ammo:12,maxAmmo:12,reserve:36,reloadTime:1200},
rifle:null,shotgun:null
};
switchWeapon();
for(var i=0;i<enemies.length;i++)scene.remove(enemies[i]);
enemies.length=0;
gameOver=false;
gameDuration=0;
firing=false;
for(var i=0;i<3;i++)spawnEnemy();
prevTime=performance.now();
update();
},{passive:false});
document.getElementById('restartBtn').addEventListener('click',function(){
document.getElementById('end-menu').classList.add('hidden');
document.getElementById('menu').classList.remove('hidden');
});
document.getElementById('restartBtn').addEventListener('touchstart',function(e){
e.preventDefault();
document.getElementById('end-menu').classList.add('hidden');
document.getElementById('menu').classList.remove('hidden');
},{passive:false});
document.getElementById('close-shop').addEventListener('click',function(){
closeShop();
});
window.addEventListener('resize',function(){
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
renderer.render(scene,camera);
</script>
</body>
</html>
