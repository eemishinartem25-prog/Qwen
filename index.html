<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Strike: Inferno Pro</title>
<style>
/* === СТИЛИ ИНТЕРФЕЙСА === */
* { box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; margin: 0; padding: 0; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #ffcc00; }
canvas { display: block; width: 100vw; height: 100vh; }

/* Виньетка для атмосферы */
#vignette {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
}

/* HUD */
#hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    font-size: 14px; text-shadow: 1px 1px 0 #000;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
}
#hud-left, #hud-right {
    background: rgba(0, 0, 0, 0.6); padding: 8px; border-radius: 5px;
    border: 1px solid #ffcc00; backdrop-filter: blur(4px);
}
#hp-bar { width: 120px; height: 10px; background: #300; border: 1px solid #ffcc00; margin-top: 3px; }
#hp-fill { height: 100%; background: linear-gradient(90deg, #0f0, #5f5); transition: width 0.2s; }

#round-info {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.7); padding: 8px 20px;
    border: 2px solid #ffcc00; border-radius: 5px;
    font-size: 16px; text-align: center; z-index: 10; pointer-events: none;
}
#team-score { display: flex; gap: 20px; margin-top: 5px; }
.ct-score { color: #5af; text-shadow: 0 0 8px #5af; }
.t-score { color: #f55; text-shadow: 0 0 8px #f55; }

/* Прицел */
#crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; pointer-events: none; z-index: 5;
}
#crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0, 255, 0, 0.9);
    box-shadow: 0 0 4px #0f0;
}
#crosshair::before { left: 11px; top: 0; width: 2px; height: 24px; }
#crosshair::after { top: 11px; left: 0; height: 2px; width: 24px; }

/* Управление (Джойстик и кнопки) */
#joystick-zone {
    position: absolute; bottom: 20px; left: 20px; width: 130px; height: 130px;
    border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
    pointer-events: auto; z-index: 20; background: rgba(0, 0, 0, 0.2);
}
#joystick-knob {
    position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
    background: radial-gradient(circle, rgba(255, 204, 0, 0.8), rgba(255, 204, 0, 0.3));
    border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
}

.action-btn {
    position: absolute; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.5);
    color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 20; font-family: inherit;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
}
#fire-btn {
    bottom: 30px; right: 20px; width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(255, 50, 50, 0.6), rgba(200, 0, 0, 0.3));
    font-size: 14px;
}
#reload-btn {
    bottom: 130px; right: 30px; width: 55px; height: 55px;
    background: radial-gradient(circle, rgba(50, 150, 255, 0.6), rgba(0, 100, 200, 0.3));
    font-size: 12px;
}
#shop-btn {
    bottom: 200px; right: 40px; width: 50px; height: 50px;
    background: radial-gradient(circle, rgba(255, 200, 0, 0.6), rgba(200, 150, 0, 0.3));
    font-size: 12px;
}
#jump-btn {
    bottom: 30px; right: 115px; width: 60px; height: 60px;
    background: radial-gradient(circle, rgba(0, 200, 100, 0.6), rgba(0, 150, 50, 0.3));
    font-size: 11px;
}
#fullscreen-btn {
    position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
    background: rgba(0, 200, 0, 0.4); border: 2px solid #0f0; border-radius: 8px;
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 20; cursor: pointer;
}

#weapon-name {
    position: absolute; bottom: 120px; right: 110px;
    color: #fff; font-size: 14px; text-shadow: 1px 1px 0 #000;
    pointer-events: none; z-index: 10;
}

/* Меню и Магазин */
#menu, #shop-menu, #end-menu, #round-end {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.92); color: #ffcc00; text-align: center;
    display: none; flex-direction: column; align-items: center;
    z-index: 100; font-size: 14px; padding: 15px;
}
#menu.active, #shop-menu.active, #end-menu.active, #round-end.active { display: flex; }
#menu { justify-content: center; }

#menu h1, #end-menu h1 {
    font-size: 32px; margin: 0 0 15px; color: #ff3300;
    text-shadow: 0 0 20px rgba(255, 50, 0, 0.8);
}
#menu button, #end-menu button, #next-round-btn {
    background: linear-gradient(180deg, #ffcc00, #cc9900);
    color: #000; border: none; padding: 15px 40px;
    font-size: 20px; font-weight: bold; margin-top: 20px;
    border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 200, 0, 0.4);
}

#shop-menu { justify-content: flex-start; padding-top: 20px; padding-bottom: 80px; }
#shop-menu h2 {
    font-size: 24px; margin: 0 0 15px; color: #ffcc00;
    position: sticky; top: 0; background: rgba(0, 0, 0, 0.95);
    padding: 10px; z-index: 101; width: 100%;
    text-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
}
#shop-items {
    width: 100%; max-width: 500px; overflow-y: auto; flex: 1;
    padding-bottom: 20px; touch-action: pan-y; -webkit-overflow-scrolling: touch;
}
.shop-item {
    background: rgba(255, 204, 0, 0.1); border: 2px solid #ffcc00;
    padding: 10px; margin: 6px 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 8px; transition: all 0.2s;
}
.shop-item-info { text-align: left; flex: 1; }
.shop-item-name { font-size: 15px; font-weight: bold; color: #fff; }
.shop-item-desc { font-size: 11px; color: #aaa; margin-top: 3px; }
.shop-item button {
    background: linear-gradient(180deg, #0f0, #0a0); color: #000;
    border: none; padding: 8px 15px; font-size: 13px;
    font-weight: bold; border-radius: 5px; cursor: pointer; min-width: 100px;
    box-shadow: 0 2px 8px rgba(0, 255, 0, 0.3);
}
.shop-item button:disabled { background: #555; color: #888; box-shadow: none; }
#close-shop {
    background: linear-gradient(180deg, #f00, #900); color: #fff;
    border: none; padding: 12px 30px; font-size: 16px;
    border-radius: 8px; cursor: pointer; position: fixed;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 102; min-width: 200px;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
}

/* Эффекты */
#hit-marker {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #f00; font-size: 50px; font-weight: bold; opacity: 0;
    pointer-events: none; z-index: 15; text-shadow: 0 0 10px #f00;
}
#kill-feed {
    position: absolute; top: 60px; right: 10px; color: #fff;
    font-size: 13px; text-shadow: 1px 1px 0 #000;
    pointer-events: none; z-index: 10; text-align: right;
}
.kill-msg {
    background: rgba(0, 0, 0, 0.7); padding: 3px 8px; margin: 2px 0;
    border-radius: 3px; animation: fadeOut 3s forwards; border-left: 3px solid #f55;
}
@keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }

#round-msg {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 48px; font-weight: bold;
    text-shadow: 3px 3px 0 #000, 0 0 30px currentColor;
    pointer-events: none; z-index: 50; opacity: 0; transition: opacity 0.3s;
}
</style>
</head>
<body>

<!-- Элементы интерфейса -->
<div id="vignette"></div>
<div id="crosshair"></div>
<div id="hit-marker">✕</div>
<div id="round-msg"></div>

<div id="round-info">
    РАУНД <span id="round-num">1</span> | <span id="round-timer">1:45</span>
    <div id="team-score">
        <span class="ct-score">CT: <span id="ct-score">0</span></span>
        <span class="t-score">T: <span id="t-score">0</span></span>
    </div>
</div>

<div id="hud">
    <div id="hud-left">
        HP: <span id="hp">100</span>
        <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
        <div style="margin-top:5px">💰 <span id="money">800</span></div>
        <div style="margin-top:3px;font-size:12px">🛡️ <span id="armor">0</span>%</div>
    </div>
    <div id="hud-right">
        <div id="weapon-name">GLOCK</div>
        <span id="ammo">20</span> / <span id="reserve">60</span><br>
        СЧЕТ: <span id="score">0</span> | УБИЙСТВ: <span id="kills">0</span>
    </div>
</div>

<div id="kill-feed"></div>

<!-- Управление -->
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="fire-btn" class="action-btn">ОГОНЬ</button>
<button id="jump-btn" class="action-btn">ПРЫГ</button>
<button id="reload-btn" class="action-btn">R</button>
<button id="shop-btn" class="action-btn">🛒</button>
<button id="fullscreen-btn" title="Полный экран">⛶</button>

<!-- Экраны меню -->
<div id="menu" class="active">
    <h1>MINI STRIKE: INFERNO</h1>
    <div id="controls-info"></div>
    <div style="margin:15px 0;font-size:13px;color:#aaa">Полная карта Inferno • Умный ИИ • 10 оружий • Прыжок</div>
    <button id="startBtn">НАЧАТЬ ИГРУ</button>
</div>

<div id="shop-menu">
    <h2>МАГАЗИН ОРУЖИЯ</h2>
    <div id="shop-items"></div>
    <button id="close-shop">ЗАКРЫТЬ</button>
</div>

<div id="round-end">
    <h1 id="round-end-title">РАУНД ОКОНЧЕН</h1>
    <div id="round-end-stats"></div>
    <button id="next-round-btn">СЛЕДУЮЩИЙ РАУНД</button>
</div>

<div id="end-menu">
    <h1 id="end-title">ИГРА ОКОНЧЕНА</h1>
    <div id="end-stats"></div>
    <button id="restartBtn">ИГРАТЬ СНОВА</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==========================================
// 1. НАСТРОЙКИ И ИНИЦИАЛИЗАЦИЯ
// ==========================================
var isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent) || ('ontouchstart' in window);
if (isMobile) {
    document.getElementById('controls-info').innerHTML = 'ЛЕВАЯ часть: джойстик<br>ПРАВАЯ часть: обзор<br>Кнопки: ОГОНЬ, ПРЫГ, R, 🛒';
} else {
    document.getElementById('controls-info').innerHTML = 'WASD — движение | МЫШЬ — обзор<br>SPACE — прыжок | ЛКМ — огонь<br>R — перезарядка | B — магазин | F — полный экран';
}

// Сцена и рендерер
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4a574); // Цвет неба Inferno
scene.fog = new THREE.FogExp2(0xd4a574, 0.008); // Туман для глубины

var camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);
var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Мягкие тени
renderer.toneMapping = THREE.ACESFilmicToneMapping; // Киношная цветокоррекция
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Освещение
var hemiLight = new THREE.HemisphereLight(0xffeecc, 0x886644, 0.7); // Небо/Земля
scene.add(hemiLight);
scene.add(new THREE.AmbientLight(0xffddaa, 0.3));
var sun = new THREE.DirectionalLight(0xffeecc, 1.0);
sun.position.set(50, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ==========================================
// 2. ГЕНЕРАЦИЯ ТЕКСТУР (Процедурные)
// ==========================================
function makeTexture(base, line, size) {
    if (!size) size = 256;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    
    // Градиентный фон
    var grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, base);
    grad.addColorStop(1, line);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    
    // Шум (грязь)
    for (var i = 0; i < 500; i++) {
        ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.3) + ')';
        ctx.beginPath();
        ctx.arc(Math.random() * size, Math.random() * size, Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Кирпичи/Трещины
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    for (var k = 0; k < 5; k++) {
        ctx.beginPath();
        var x = Math.random() * size, y = Math.random() * size;
        ctx.moveTo(x, y);
        for (var l = 0; l < 4; l++) {
            x += (Math.random() - 0.5) * 40;
            y += (Math.random() - 0.5) * 40;
            ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8; // Четкость под углом
    return t;
}

var sandTex = makeTexture('#c9a57a', '#8b6f47');
var darkWoodTex = makeTexture('#6b4423', '#3d2410');
var roofTex = makeTexture('#8b3a1f', '#5a2410');
var stoneTex = makeTexture('#8a8070', '#5a5040');
var groundTex = makeTexture('#b89968', '#7a6540');
groundTex.repeat.set(40, 40);

// ==========================================
// 3. ПОСТРОЕНИЕ КАРТЫ INFERNO
// ==========================================
var floorMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9, metalness: 0.05 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

var walls = [];
var wallMaterials = {
    sand: new THREE.MeshStandardMaterial({ map: sandTex, roughness: 0.85, metalness: 0.05 }),
    wood: new THREE.MeshStandardMaterial({ map: darkWoodTex, roughness: 0.7, metalness: 0.1 }),
    roof: new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.8, metalness: 0.05 }),
    stone: new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9, metalness: 0.1 })
};

function addWall(x, z, w, h, d, matKey) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMaterials[matKey] || wallMaterials.sand);
    m.position.set(x, h / 2, z);
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData = { w: w, h: h, d: d }; // Для коллизий
    scene.add(m);
    walls.push(m);
    return m;
}

// --- ГРАНИЦЫ КАРТЫ ---
addWall(0, -95, 190, 6, 1, 'stone'); // Север
addWall(0, 95, 190, 6, 1, 'stone');  // Юг
addWall(-95, 0, 1, 6, 190, 'stone'); // Запад
addWall(95, 0, 1, 6, 190, 'stone');  // Восток

// --- CT SPAWN (Север, Z=-80) ---
addWall(-15, -85, 1, 5, 16, 'sand');
addWall(15, -85, 1, 5, 16, 'sand');
addWall(0, -93, 30, 5, 1, 'sand');

// --- T SPAWN (Юг, Z=80) ---
addWall(-15, 85, 1, 5, 16, 'sand');
addWall(15, 85, 1, 5, 16, 'sand');
addWall(0, 93, 30, 5, 1, 'sand');

// --- A SITE (Северо-Запад, X=-40, Z=-55) ---
// Периметр сайта
addWall(-55, -55, 1, 5, 24, 'sand');
addWall(-30, -55, 1, 5, 24, 'sand');
addWall(-42, -67, 25, 5, 1, 'sand');
addWall(-42, -43, 25, 5, 1, 'sand');
// Квартиры (двухэтажные)
addWall(-50, -60, 8, 5, 1, 'sand');
addWall(-35, -60, 8, 5, 1, 'sand');
addWall(-42, -63, 1, 5, 6, 'sand');
addWall(-42, -60, 12, 0.5, 6, 'roof'); // Крыша
// Ящики на A
addWall(-50, -48, 3, 2, 3, 'wood');
addWall(-35, -48, 3, 2, 3, 'wood');
addWall(-42, -52, 2, 2, 2, 'wood');

// --- LONG A (Запад, X=-65) ---
addWall(-75, -25, 1, 5, 40, 'sand');
addWall(-55, -25, 1, 5, 40, 'sand');
addWall(-65, 0, 20, 5, 1, 'sand'); // Поворот к миду
// Ящики на Long
addWall(-70, -15, 3, 2, 3, 'wood');
addWall(-60, -35, 3, 2, 3, 'wood');

// --- SHORT A / CONNECTOR (Центр-Лево) ---
addWall(-25, -20, 1, 4, 16, 'sand');
addWall(-15, -20, 1, 4, 16, 'sand');
addWall(-20, -35, 10, 4, 1, 'stone'); // Стена коннектора

// --- MID (Центр, X=0) ---
addWall(-10, 15, 1, 5, 30, 'sand'); // Левая стена мида
addWall(10, 15, 1, 5, 30, 'sand');  // Правая стена мида
addWall(0, 0, 20, 5, 1, 'stone');   // Арка верхняя
addWall(0, -10, 20, 5, 1, 'stone'); // Арка нижняя
// Ящики в миду
addWall(-5, 10, 2, 2, 2, 'wood');
addWall(5, 20, 2, 2, 2, 'wood');

// --- BANANA (Путь к B, Восток, X=55) ---
addWall(45, 35, 1, 5, 30, 'sand');
addWall(65, 35, 1, 5, 30, 'sand');
addWall(55, 50, 20, 5, 1, 'sand');
// Ящики на банане
addWall(50, 25, 3, 2, 3, 'wood');
addWall(60, 40, 3, 2, 3, 'wood');

// --- B SITE (Восток-Юг, X=47, Z=55) ---
addWall(35, 55, 1, 5, 24, 'sand');
addWall(60, 55, 1, 5, 24, 'sand');
addWall(47, 67, 25, 5, 1, 'sand');
addWall(47, 43, 25, 5, 1, 'sand');
// Ящики на B
addWall(40, 50, 3, 2, 3, 'wood');
addWall(55, 60, 3, 2, 3, 'wood');
addWall(47, 55, 2, 2, 2, 'wood');

// --- TUNNELS (Туннели к B) ---
addWall(25, 65, 1, 4, 16, 'stone');
addWall(35, 65, 1, 4, 16, 'stone');
addWall(30, 57, 10, 4, 1, 'stone');

// --- ДОПОЛНИТЕЛЬНЫЕ УКРЫТИЯ ---
addWall(-30, 30, 3, 2, 3, 'wood');
addWall(30, -30, 3, 2, 3, 'wood');
addWall(0, 40, 4, 2, 2, 'wood');
addWall(0, -40, 4, 2, 2, 'wood');
addWall(-75, 30, 3, 2, 3, 'wood');
addWall(75, -30, 3, 2, 3, 'wood');

var CT_SPAWN = { x: 0, z: -80 };
var T_SPAWN = { x: 0, z: 80 };

// ==========================================
// 4. WAYPOINTS (Маршруты для ИИ)
// ==========================================
// Боты идут строго по этим точкам, поэтому они НЕ ЗАСТРЕВАЮТ.
var routes = {
    tToA: [
        {x:0,z:70}, {x:0,z:40}, {x:-5,z:15}, {x:-15,z:-5}, 
        {x:-20,z:-20}, {x:-30,z:-35}, {x:-42,z:-48}, {x:-42,z:-55}
    ],
    tToB: [
        {x:0,z:70}, {x:20,z:65}, {x:30,z:60}, {x:40,z:55}, {x:47,z:55}
    ],
    tToMid: [
        {x:0,z:70}, {x:0,z:40}, {x:0,z:15}, {x:0,z:5}
    ],
    ctToA: [
        {x:0,z:-80}, {x:-20,z:-70}, {x:-42,z:-60}, {x:-42,z:-55}
    ],
    ctToB: [
        {x:0,z:-80}, {x:0,z:-50}, {x:0,z:-10}, {x:0,z:5}, 
        {x:15,z:20}, {x:30,z:35}, {x:40,z:45}, {x:47,z:55}
    ],
    ctToMid: [
        {x:0,z:-80}, {x:0,z:-50}, {x:0,z:-10}, {x:0,z:-5}
    ]
};

// ==========================================
// 5. ОРУЖИЕ И ИГРОК
// ==========================================
var weaponsData = {
    glock: {name:'GLOCK-18', damage:22, fireRate:150, maxAmmo:20, reserve:60, reloadTime:1800, price:0, spread:0.02, type:'pistol'},

var audioCtx;
function initAudio() { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function snd(type) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    if (type === 'shot') {
        o.type = 'square';
        o.frequency.setValueAtTime(180, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(600, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    } else { // buy
        o.type = 'sine';
        o.frequency.setValueAtTime(800, audioCtx.currentTime);
        o.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    }
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
}

var joystick = { active: false, dx: 0, dy: 0, ox: 0, oy: 0, tid: null };
var look = { active: false, lx: 0, ly: 0, tid: null };

function updJoy(x, y) {
    var dx = x - joystick.ox, dy = y - joystick.oy;
    var d = Math.hypot(dx, dy), mx = 40;
    if (d > mx) { dx = dx/d*mx; dy = dy/d*mx; }
    joyK.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
    joystick.dx = dx/mx; joystick.dy = dy/mx;
}

var shopOpen = false, locked = false, roundActive = false;

// Универсальный бинд кнопок (клик + тач)
function bind(id, cb) {
    var e = document.getElementById(id);
    e.addEventListener('click', function(ev) { ev.preventDefault(); cb(); });
    e.addEventListener('touchstart', function(ev) { ev.preventDefault(); cb(); }, {passive:false});
}

if (isMobile) {
    joyZ.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var t = e.changedTouches[0];
        joystick.active = true; joystick.tid = t.identifier;
        var r = joyZ.getBoundingClientRect();
        joystick.ox = r.left + r.width/2; joystick.oy = r.top + r.height/2;
        updJoy(t.clientX, t.clientY);
    }, {passive:false});
    
    joyZ.addEventListener('touchmove', function(e) {
        e.preventDefault();
        for(var i=0; i<e.changedTouches.length; i++)
            if(e.changedTouches[i].identifier === joystick.tid)
                updJoy(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
    }, {passive:false});
    
    var ej = function(e) {
        for(var i=0; i<e.changedTouches.length; i++)
            if(e.changedTouches[i].identifier === joystick.tid) {
                joystick.active = false; joystick.dx = 0; joystick.dy = 0;
                joyK.style.transform = 'translate(-50%,-50%)'; break;
            }
    };
    joyZ.addEventListener('touchend', ej); joyZ.addEventListener('touchcancel', ej);
    
    document.addEventListener('touchstart', function(e) {
        for(var i=0; i<e.changedTouches.length; i++) {
            var t = e.changedTouches[i];
            if (t.clientX > innerWidth/2 && !e.target.closest('#shop-menu') && !e.target.closest('.action-btn')) {
                look.active = true; look.tid = t.identifier;
                look.lx = t.clientX; look.ly = t.clientY;
            }
        }
    }, {passive:false});
    
    document.addEventListener('touchmove', function(e) {
        for(var i=0; i<e.changedTouches.length; i++) {
            var t = e.changedTouches[i];
            if (look.active && t.identifier === look.tid) {
                player.yaw -= (t.clientX - look.lx) * 0.005;
                player.pitch -= (t.clientY - look.ly) * 0.005;
                player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
                look.lx = t.clientX; look.ly = t.clientY;
            }
        }
    }, {passive:false});
    
    var el = function(e) {
        for(var i=0; i<e.changedTouches.length; i++)
            if(e.changedTouches[i].identifier === look.tid) { look.active = false; break; }
    };
    document.addEventListener('touchend', el); document.addEventListener('touchcancel', el);
    
    bind('fire-btn', function(){ firing = true; });
    document.getElementById('fire-btn').addEventListener('touchend', function(e){ e.preventDefault(); firing = false; });
    bind('jump-btn', function(){ if(player.onGround){ player.vel.y = 7; player.onGround = false; } });
    bind('reload-btn', reload);
    bind('shop-btn', openShop);
} else {

    ['fire-btn','reload-btn','shop-btn','jump-btn'].forEach(function(id){ document.getElementById(id).style.display = 'none'; });
    
    var keys = {};
    window.addEventListener('keydown', function(e) {
        keys[e.code] = true;
        if(e.code === 'KeyR') reload();

        if(e.code === 'Escape' && shopOpen) closeShop();

            player.vel.y = 7; player.onGround = false;
        }
    });
    window.addEventListener('keyup', function(e) { keys[e.code] = false; });
    
    renderer.domElement.addEventListener('click', function(){
        if(!gameOver && !shopOpen && roundActive) renderer.domElement.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', function(){ locked = document.pointerLockElement === renderer.domElement; });
    document.addEventListener('mousemove', function(e) {
        if(!locked) return;
        player.yaw -= e.movementX * 0.002;
        player.pitch -= e.movementY * 0.002;
        player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
    });
    document.addEventListener('mousedown', function(e){ if(e.button===0 && locked) firing = true; });
    document.addEventListener('mouseup', function(e){ if(e.button===0) firing = false; });
    window.getKeys = function(){ return keys; };
}

var raycaster = new THREE.Raycaster(), lastShot = 0;

function shoot() {
    var wp = player.weapons[player.currentWeapon], now = performance.now();
    if(player.reloading || wp.ammo <= 0 || now-lastShot < wp.fireRate || shopOpen || !player.alive || !roundActive) return;
    
    lastShot = now; wp.ammo--; snd('shot');
    gun.position.z = -0.3; muzzle.intensity = 4;
    setTimeout(function(){ muzzle.intensity = 0; gun.position.z = -0.4; }, 60);
    
    var d = new THREE.Vector3((Math.random()-0.5)*wp.spread, (Math.random()-0.5)*wp.spread, -1);
    d.applyQuaternion(camera.quaternion).normalize();
    raycaster.set(camera.position, d);
    
    var tgts = [];
    allBots.forEach(function(b){ if(b.userData.alive) b.traverse(function(c){ if(c.isMesh) tgts.push(c); }); });
    
    var h = raycaster.intersectObjects(tgts);
    if(h.length > 0) {
        var o = h[0].object;
        while(o.parent && o.userData.hp === undefined) o = o.parent;
        if(o.userData.hp !== undefined && o.userData.team !== player.team) {
            var hs = h[0].object.geometry.parameters && h[0].object.geometry.parameters.height < 0.5;
            var dm = hs ? wp.damage * 3 : wp.damage;
            if(o.userData.armor > 0) dm *= (1 - o.userData.armor/100); // Броня снижает урон
            o.userData.hp -= dm;
            snd('hit'); showHM();
            if(o.userData.hp <= 0) killBot(o, player);
        }
    }
    updHUD();
    if(wp.ammo === 0 && wp.reserve > 0) reload();
}

function reload() {
    var wp = player.weapons[player.currentWeapon];
    if(player.reloading || wp.ammo === wp.maxAmmo || wp.reserve === 0) return;
    player.reloading = true;
    document.getElementById('reload-btn').style.opacity = '0.5';
    setTimeout(function(){
        var n = wp.maxAmmo - wp.ammo, t = Math.min(n, wp.reserve);
        wp.ammo += t; wp.reserve -= t;
        player.reloading = false;
        document.getElementById('reload-btn').style.opacity = '1';
        updHUD();
    }, wp.reloadTime);
}

function showHM() {
    var h = document.getElementById('hit-marker');
    h.style.opacity = '1';
    setTimeout(function(){ h.style.opacity = '0'; }, 120);
}

function killBot(b, k) {
    b.userData.alive = false;
    b.rotation.x = Math.PI/2; b.position.y = 0.3;
    var kn = k === player ? 'ТЫ' : k.userData.name;
    addKF(kn, b.userData.name, k === player || k.userData.team === player.team);
    if(k === player) { player.score += 100; player.kills++; player.money += 300; }
}

function addKF(k, v, f) {
    var fd = document.getElementById('kill-feed'), m = document.createElement('div');
    m.className = 'kill-msg'; m.style.color = f ? '#5af' : '#f55';
    m.textContent = k + ' ✕ ' + v;
    fd.appendChild(m);
    setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); }, 3000);
}

function collideW(pos, r) {
    if(!r) r = 0.4;
    for(var i=0; i<walls.length; i++) {
        var w = walls[i], ww = w.userData.w, dd = w.userData.d;
        var dx = Math.max(0, Math.abs(pos.x - w.position.x) - ww/2);
        var dz = Math.max(0, Math.abs(pos.z - w.position.z) - dd/2);
        if(dx < r && dz < r) {
            if(dx < dz) pos.z = w.position.z + Math.sign(pos.z - w.position.z) * (dd/2 + r);
            else pos.x = w.position.x + Math.sign(pos.x - w.position.x) * (ww/2 + r);
        }
    }
}

function findTgt(b) {
    var en = [];
    if(b.userData.team === 'CT') {
        allBots.forEach(function(o){ if(o.userData.team==='T' && o.userData.alive) en.push(o); });
        if(player.alive && player.team === 'T') en.push(player);
    } else {
        allBots.forEach(function(o){ if(o.userData.team==='CT' && o.userData.alive) en.push(o); });
        if(player.alive && player.team === 'CT') en.push(player);
    }
    var cl = null, md = 1e9;
    en.forEach(function(e) {
        var d = b.position.distanceTo(e === player ? player.pos : e.position);
        if(d < md) { md = d; cl = e; }
    });
    return cl;
}

function hasLOS(a, b) {
    var d = new THREE.Vector3().subVectors(b, a), l = d.length();
    d.normalize();
    raycaster.set(a, d); raycaster.far = l;
    var h = raycaster.intersectObjects(walls);
    raycaster.far = 1e9;
    return h.length === 0;
}

function updBot(b, dt, now) {
    if(!b.userData.alive || !roundActive) return;
    
    var tgt = findTgt(b);
    b.userData.target = tgt;
    var tp = tgt ? (tgt === player ? player.pos : tgt.position) : null;
    var dist = tp ? b.position.distanceTo(tp) : 999;
    var eye = new THREE.Vector3(b.position.x, 1.7, b.position.z);
    var canSee = tp && hasLOS(eye, new THREE.Vector3(tp.x, 1.7, tp.z)) && dist < 40;
    
    if(canSee) { b.userData.state = 'combat'; b.userData.stateTimer = 0; }
    else { b.userData.stateTimer += dt; if(b.userData.stateTimer > 1.5) b.userData.state = 'patrol'; }
    
    if(b.userData.state === 'combat' && tp) {
        // БОЙ
        var toT = new THREE.Vector3().subVectors(tp, b.position); toT.y = 0; toT.normalize();
        b.rotation.y = Math.atan2(toT.x, toT.z);
        
        if(dist > 10) {
            b.position.x += toT.x * b.userData.speed * dt;
            b.position.z += toT.z * b.userData.speed * dt;
            collideW(b.position);
        }
        if(dist < 18) {
            var st = new THREE.Vector3(-toT.z, 0, toT.x);
            b.position.x += st.x * b.userData.strafeDir * b.userData.speed * 0.4 * dt;
            b.position.z += st.z * b.userData.strafeDir * b.userData.speed * 0.4 * dt;
            if(Math.random() < 0.02) b.userData.strafeDir *= -1;
            collideW(b.position);
        }
        
        var fr = weaponsData[b.userData.weapon].fireRate * 2.5;
        if(now - b.userData.lastShot > fr && dist < 35) {
            b.userData.lastShot = now;
            var hc = b.userData.accuracy * (1 - dist/50);
            if(Math.random() < hc) {
                var dm = weaponsData[b.userData.weapon].damage * 0.4;
                if(tgt === player) {
                    if(player.alive) {
                        if(player.armor > 0) dm *= (1 - player.armor/100);
                        player.hp -= dm; snd('hit');
                        if(player.hp <= 0) { player.hp = 0; player.alive = false; addKF(b.userData.name, 'ТЫ', false); }
                        updHUD();
                    }
                } else if(tgt.userData.alive) {
                    if(tgt.userData.armor > 0) dm *= (1 - tgt.userData.armor/100);
                    tgt.userData.hp -= dm;
                    if(tgt.userData.hp <= 0) killBot(tgt, b);
                }
            }
            snd('shot');
        }
    } else {
        // ПАТРУЛЬ (Waypoints)
        var rt = b.userData.route;
        if(rt && rt.length > 0) {
            var wp = rt[b.userData.wpIdx];
            var toWP = new THREE.Vector3(wp.x - b.position.x, 0, wp.z - b.position.z);
            var wpDist = toWP.length();
            
            if(wpDist < 3) {
                b.userData.wpIdx = (b.userData.wpIdx + 1) % rt.length;
                wp = rt[b.userData.wpIdx];
                toWP.set(wp.x - b.position.x, 0, wp.z - b.position.z);
                wpDist = toWP.length();
            }
            
            toWP.normalize();
            b.rotation.y = Math.atan2(toWP.x, toWP.z);
            
            // Движение к точке
            b.position.x += toWP.x * b.userData.speed * dt;
            b.position.z += toWP.z * b.userData.speed * dt;
            collideW(b.position);
            
            // Анти-застревание
            var moved = b.position.distanceTo(b.userData.lastPos);
            if(moved < 0.05 * dt) {
                b.userData.stuckT += dt;
                if(b.userData.stuckT > 0.8) {
                    // Телепорт на точку если застрял
                    b.position.set(wp.x, 0, wp.z);
                    b.userData.stuckT = 0;
                    b.userData.wpIdx = (b.userData.wpIdx + 1) % rt.length;
                }
            } else {
                b.userData.stuckT = 0;
            }
            b.userData.lastPos.copy(b.position);
        }
    }
}

// ==========================================
// 11. СИСТЕМА РАУНДОВ
// ==========================================
var roundNum = 1, ctScore = 0, tScore = 0, roundTime = 105, roundTimer = roundTime, gameOver = false, MAX_ROUNDS = 10;

function startRound() {
    player.pos.set(CT_SPAWN.x, 1.7, CT_SPAWN.z);
    player.yaw = 0; player.pitch = 0;
    player.hp = player.maxHp; player.alive = true; player.reloading = false;
    player.vel.set(0,0,0); player.onGround = true;
    
    for(var k in player.weapons) player.weapons[k].ammo = player.weapons[k].maxAmmo;
    
    allBots.forEach(function(b){ scene.remove(b); }); allBots = [];
    
    // Создаем ботов с маршрутами
    createBot('CT', 'АЛЕКС', routes.ctToA);
    createBot('CT', 'ВИКТОР', routes.ctToB);
    createBot('CT', 'МАКС', routes.ctToMid);
    
    createBot('T', 'ИВАН', routes.tToA);
    createBot('T', 'ДМИТРИЙ', routes.tToB);
    createBot('T', 'СЕРГЕЙ', routes.tToMid);
    createBot('T', 'АНДРЕЙ', routes.tToA);
    createBot('T', 'НИКОЛАЙ', routes.tToB);
    
    roundActive = true; roundTimer = roundTime;
    prevTime = performance.now();
    showRM('РАУНД ' + roundNum, 2000);
}

function endRound(w) {
    roundActive = false;
    if(w === 'CT') { ctScore++; player.money += 3000; showRM('ПОБЕДА CT!', 2500); }
    else { tScore++; player.money += 1400; showRM('ПОБЕДА T!', 2500); }
    
    player.money += 500;
    if(player.money > 16000) player.money = 16000;
    updHUD();
    
    setTimeout(function(){
        if(roundNum >= MAX_ROUNDS || ctScore >= 6 || tScore >= 6) showGO();
        else showRE(w);
    }, 2500);
}

function showRM(t, d) {
    var m = document.getElementById('round-msg');
    m.textContent = t; m.style.opacity = '1';
    m.style.color = t.indexOf('CT') > -1 ? '#5af' : '#f55';
    setTimeout(function(){ m.style.opacity = '0'; }, d);
}

function showRE(w) {
    document.getElementById('round-end').classList.add('active');
    document.getElementById('round-end-title').textContent = w === 'CT' ? 'РАУНД ЗА CT' : 'РАУНД ЗА T';
    document.getElementById('round-end-title').style.color = w === 'CT' ? '#5af' : '#f55';
    document.getElementById('round-end-stats').innerHTML = 
        '<div style="font-size:16px;margin:12px 0;line-height:1.8">CT '+ctScore+' - '+tScore+' T<br>УБИЙСТВ: '+player.kills+'<br>💰 '+player.money+'</div>';
}

function showGO() {
    gameOver = true;
    document.getElementById('end-menu').classList.add('active');
    var w = ctScore > tScore;
    document.getElementById('end-title').textContent = w ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
    document.getElementById('end-title').style.color = w ? '#0f0' : '#f00';
    document.getElementById('end-stats').innerHTML = 
        '<div style="font-size:16px;margin:12px 0;line-height:1.8">CT: '+ctScore+' - T: '+tScore+'<br>УБИЙСТВ: '+player.kills+'<br>СЧЕТ: '+player.score+'<br>💰 '+player.money+'</div>';
}

// ==========================================
// 12. ГЛАВНЫЙ ЦИКЛ
// ==========================================
var prevTime = performance.now();

function update() {
    requestAnimationFrame(update);
    if(gameOver) { renderer.render(scene, camera); return; }
    
    var now = performance.now(), dt = Math.min((now - prevTime) / 1000, 0.1);
    prevTime = now;
    
    if(roundActive) {
        roundTimer -= dt;
        var mn = Math.floor(roundTimer/60), sc = Math.floor(roundTimer%60);
        document.getElementById('round-timer').textContent = mn + ':' + (sc<10?'0':'') + sc;
        if(roundTimer <= 0) { endRound('T'); return; }
    }
    
    // Движение игрока
    if(player.alive && roundActive && !shopOpen) {
        var mx = 0, mz = 0;
        if(isMobile) {
            if(joystick.active) {
                var fw = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
                var rt = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
                mx = (-joystick.dy)*fw.x + joystick.dx*rt.x;
                mz = (-joystick.dy)*fw.z + joystick.dx*rt.z;
                var l = Math.hypot(mx, mz);
                if(l > 0) { mx /= l; mz /= l; }
                mx *= 5*dt; mz *= 5*dt;
            }
        } else {
            var k = window.getKeys();
            if(k) {
                var fw = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
                var rt = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
                if(k['KeyW']) { mx += fw.x; mz += fw.z; }
                if(k['KeyS']) { mx -= fw.x; mz -= fw.z; }
                if(k['KeyD']) { mx += rt.x; mz += rt.z; }
                if(k['KeyA']) { mx -= rt.x; mz -= rt.z; }
                var l = Math.hypot(mx, mz);
                if(l > 0) { mx /= l; mz /= l; }
                mx *= 6*dt; mz *= 6*dt;
            }
        }
        player.pos.x += mx; player.pos.z += mz;
        collideW(player.pos);
        player.pos.x = Math.max(-93, Math.min(93, player.pos.x));
        player.pos.z = Math.max(-93, Math.min(93, player.pos.z));
    }
    
    // Гравитация и прыжок
    player.vel.y -= 18*dt;
    player.pos.y += player.vel.y*dt;
    if(player.pos.y <= 1.7) { player.pos.y = 1.7; player.vel.y = 0; player.onGround = true; }
    
    camera.position.copy(player.pos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
    
    if(firing && player.alive) shoot();
    
    allBots.forEach(function(b){ updBot(b, dt, now); });
    
    // Проверка конца раунда
    if(roundActive) {
        var ca = player.alive && player.team === 'CT', ta = false;
        allBots.forEach(function(b){
            if(b.userData.alive) {
                if(b.userData.team === 'CT') ca = true;
                else ta = true;
            }
        });
        if(!ca) { endRound('T'); return; }
        if(!ta) { endRound('CT'); return; }
    }
    
    updHUD();
    renderer.render(scene, camera);
}

function updHUD() {
    document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
    document.getElementById('hp-fill').style.width = (player.hp/player.maxHp*100) + '%';
    document.getElementById('hp-fill').style.background = player.hp > player.maxHp*0.5 ? '#0f0' : player.hp > player.maxHp*0.25 ? '#ff0' : '#f00';
    document.getElementById('armor').textContent = player.armor;
    document.getElementById('money').textContent = player.money;
    var wp = player.weapons[player.currentWeapon];
    document.getElementById('ammo').textContent = wp.ammo;
    document.getElementById('reserve').textContent = wp.reserve;
    document.getElementById('score').textContent = player.score;
    document.getElementById('kills').textContent = player.kills;
    document.getElementById('round-num').textContent = roundNum;
    document.getElementById('ct-score').textContent = ctScore;
    document.getElementById('t-score').textContent = tScore;
}

function toggleFS() {
    var e = document.documentElement;
    if(!document.fullscreenElement) {
        if(e.requestFullscreen) e.requestFullscreen();
        else if(e.webkitRequestFullscreen) e.webkitRequestFullscreen();
    } else {
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
}

// Привязка кнопок меню
bind('startBtn', startGame);
bind('next-round-btn', function(){ document.getElementById('round-end').classList.remove('active'); roundNum++; startRound(); });
bind('restartBtn', function(){ document.getElementById('end-menu').classList.remove('active'); document.getElementById('menu').classList.add('active'); });
bind('close-shop', closeShop);
bind('fullscreen-btn', toggleFS);

function startGame() {
    initAudio();
    document.getElementById('menu').classList.remove('active');
    roundNum = 1; ctScore = 0; tScore = 0; gameOver = false;
    player.money = 800; player.score = 0; player.kills = 0;
    player.maxHp = 100; player.armor = 0;
    player.currentWeapon = 'glock';
    player.weapons = { glock: {name:'GLOCK-18', damage:22, fireRate:150, ammo:20, maxAmmo:20, reserve:60, reloadTime:1800, spread:0.02, type:'pistol'} };
    swW();
    startRound();
}

window.addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

renderer.render(scene, camera);
update();
</script>
