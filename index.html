<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Strike Pro: Ultimate Edition</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;margin:0;padding:0}
body{overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#ffcc00}
canvas{display:block;width:100vw;height:100vh}
#vignette{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.7) 100%)}
#damage-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0) 100%);transition:background 0.3s}
#hud{position:absolute;top:10px;left:10px;right:10px;font-size:14px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hud-left,#hud-right{background:rgba(0,0,0,0.7);padding:8px;border-radius:5px;border:1px solid #ffcc00;backdrop-filter:blur(4px)}
#hp-bar{width:120px;height:10px;background:#300;border:1px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:linear-gradient(90deg,#0f0,#5f5);transition:width 0.2s}
#round-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);padding:8px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:10;pointer-events:none}
#team-score{display:flex;gap:20px;margin-top:5px}
.ct-score{color:#5af;text-shadow:0 0 8px #5af}
.t-score{color:#f55;text-shadow:0 0 8px #f55}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:5}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,0,0.95);box-shadow:0 0 4px #0f0}
#crosshair::before{left:11px;top:0;width:2px;height:24px}
#crosshair::after{top:11px;left:0;height:2px;width:24px}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20;background:rgba(0,0,0,0.2)}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:radial-gradient(circle,rgba(255,204,0,0.8),rgba(255,204,0,0.3));border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.5);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,50,50,0.6),rgba(200,0,0,0.3));font-size:14px}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:radial-gradient(circle,rgba(50,150,255,0.6),rgba(0,100,200,0.3));font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,200,0,0.6),rgba(200,150,0,0.3));font-size:12px}
#jump-btn{bottom:30px;right:115px;width:60px;height:60px;background:radial-gradient(circle,rgba(0,200,100,0.6),rgba(0,150,50,0.3));font-size:11px}
#grenade-btn{bottom:200px;right:115px;width:55px;height:55px;background:radial-gradient(circle,rgba(150,100,255,0.6),rgba(100,50,200,0.3));font-size:10px}
#plant-btn,#defuse-btn{bottom:280px;right:40px;width:60px;height:60px;font-size:10px;display:none}
#plant-btn{background:radial-gradient(circle,rgba(255,150,0,0.8),rgba(200,100,0,0.4))}
#defuse-btn{background:radial-gradient(circle,rgba(0,150,255,0.8),rgba(0,100,200,0.4))}
#fullscreen-btn{position:absolute;top:10px;right:10px;width:40px;height:40px;background:rgba(0,200,0,0.4);border:2px solid #0f0;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;cursor:pointer}
#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#spectate-info{position:absolute;top:50%;left:50%;transform:translate(-50%,-100px);background:rgba(0,0,0,0.8);padding:10px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:15;pointer-events:none;display:none}
#respawn-timer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#f55;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;display:none}
#minimap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:160px;height:160px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:5px;pointer-events:none;z-index:15}
#kill-streak{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#ff0;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:15;opacity:0;transition:opacity 0.3s}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);color:#ffcc00;display:none;flex-direction:column;align-items:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.active{display:flex}
.screen h1{font-size:32px;margin:15px 0;color:#ff3300;text-shadow:0 0 20px rgba(255,50,0,0.8)}
.screen h2{font-size:22px;margin:15px 0 10px;color:#ffcc00}
.btn-main{background:linear-gradient(180deg,#ffcc00,#cc9900);color:#000;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:200px}
.btn-mode{background:linear-gradient(180deg,#5af,#28a);color:#fff;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:250px}
.btn-map{background:rgba(255,204,0,0.2);border:2px solid #ffcc00;padding:12px;margin:6px;border-radius:8px;cursor:pointer;min-width:200px;color:#fff}
.btn-map.selected{background:rgba(0,255,0,0.3);border-color:#0f0}
.btn-agent{background:rgba(100,100,100,0.3);border:2px solid #888;padding:10px;margin:5px;border-radius:8px;cursor:pointer;min-width:180px;color:#fff;display:flex;align-items:center;gap:10px}
.btn-agent.selected{border-color:#0f0;background:rgba(0,255,0,0.2)}
.btn-agent.locked{opacity:0.5}
.agent-preview{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
#shop-menu{justify-content:flex-start;padding-top:20px;padding-bottom:80px}
#shop-menu h2{position:sticky;top:0;background:rgba(0,0,0,0.95);padding:10px;z-index:101;width:100%}
#shop-items{width:100%;max-width:500px;overflow-y:auto;flex:1;padding-bottom:20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-item{background:rgba(255,204,0,0.1);border:2px solid #ffcc00;padding:10px;margin:6px 0;width:100%;display:flex;justify-content:space-between;align-items:center;border-radius:8px}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:15px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:3px}
.shop-item button{background:linear-gradient(180deg,#0f0,#0a0);color:#000;border:none;padding:8px 15px;font-size:13px;font-weight:bold;border-radius:5px;cursor:pointer;min-width:100px}
.shop-item button:disabled{background:#555;color:#888}
#close-shop{background:linear-gradient(180deg,#f00,#900);color:#fff;border:none;padding:12px 30px;font-size:16px;border-radius:8px;cursor:pointer;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:102;min-width:200px}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.7);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
#bomb-status{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,0.8);padding:8px 20px;border:2px solid #f00;border-radius:5px;font-size:18px;color:#fff;display:none;z-index:15;pointer-events:none;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.lock-info{font-size:11px;color:#f55;margin-top:3px}
.rank-badge{display:inline-block;padding:3px 8px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#000;border-radius:3px;font-weight:bold;margin-left:5px}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="damage-overlay"></div>
<div id="crosshair"></div>
<div id="hit-marker">✕</div>
<div id="round-msg"></div>
<div id="kill-streak"></div>
<div id="bomb-status">💣 бомба: <span id="bomb-timer">40</span>с</div>
<div id="round-info">
<span id="round-title">РАУНД 1</span> | <span id="round-timer">1:45</span>
<div id="team-score"><span class="ct-score">CT: <span id="ct-score">0</span></span><span class="t-score">T: <span id="t-score">0</span></span></div>
</div>
<div id="hud">
<div id="hud-left">HP: <span id="hp">100</span><div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div style="margin-top:5px">💰 <span id="money">800</span></div>
<div style="font-size:12px">🛡️ <span id="armor">0</span>% <span id="rank-display"></span></div></div>
<div id="hud-right"><div id="weapon-name">GLOCK</div>
<span id="ammo">20</span>/<span id="reserve">60</span><br>
СЧЕТ: <span id="score">0</span> | K: <span id="kills">0</span></div></div>
<div id="kill-feed"></div>
<canvas id="minimap" width="160" height="160"></canvas>
<div id="spectate-info">НАБЛЮДЕНИЕ: <span id="spectate-name">-</span><br><small>Тап/клик для смены</small></div>
<div id="respawn-timer"></div>
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="fire-btn" class="action-btn">ОГОНЬ</button>
<button id="jump-btn" class="action-btn">ПРЫГ</button>
<button id="reload-btn" class="action-btn">R</button>
<button id="grenade-btn" class="action-btn">💣</button>
<button id="shop-btn" class="action-btn">🛒</button>
<button id="plant-btn" class="action-btn">💣</button>
<button id="defuse-btn" class="action-btn">🔧</button>
<button id="fullscreen-btn">⛶</button>

<div id="lobby" class="screen active">
<h1>MINI STRIKE PRO</h1>
<h2>РЕЖИМ</h2>
<button class="btn-mode" data-mode="bomb">💣 ЗАКЛАДКА БОМБЫ</button>
<button class="btn-mode" data-mode="dm">⚔️ КОМАНДНЫЙ БОЙ</button>
<h2 id="map-title">КАРТА</h2>
<div id="map-list"></div>
<h2>АГЕНТ</h2>
<div id="agent-list"></div>
<div style="margin:15px 0;font-size:13px;color:#aaa">Побед: <span id="total-wins">0</span> | Ранг: <span id="lobby-rank"></span></div>
<button class="btn-main" id="play-btn">В БОЙ!</button>
</div>

<div id="shop-menu" class="screen">
<h2>МАГАЗИН</h2>
<div id="shop-items"></div>
<button id="close-shop">ЗАКРЫТЬ</button>
</div>

<div id="round-end" class="screen">
<h1 id="round-end-title">РАУНД ОКОНЧЕН</h1>
<div id="round-end-stats"></div>
<button class="btn-main" id="next-round-btn">ДАЛЕЕ</button>
</div>

<div id="end-menu" class="screen">
<h1 id="end-title">ИГРА ОКОНЧЕНА</h1>
<div id="end-stats"></div>
<button class="btn-main" id="restartBtn">В ЛОББИ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window);
var gameState = 'LOBBY';
var gameMode = 'bomb';
var selectedMap = 'inferno';
var selectedAgent = 0;
var totalWins = parseInt(localStorage.getItem('ms_wins') || '0');
var playerRank = parseInt(localStorage.getItem('ms_rank') || '0');
var killStreak = 0;

// Ранги (как в CS)
var ranks = [
    {name:'СЕРЕБРО I', wins:0},
    {name:'СЕРЕБРО II', wins:3},
    {name:'СЕРЕБРО ЭЛИТА', wins:7},
    {name:'Золотая Нова', wins:12},
    {name:'МАГИСТР ХРАН.', wins:20},
    {name:'ЛЕГЕНДА ОРЛА', wins:30},
    {name:'ЛЕГ. ВЫСШ. РАНГА', wins:50},
    {name:'ГЛОБАЛ ЭЛИТА', wins:100}
];

// Агенты
var agents = [
    {name:'РЕКРУТ', color:0x4488cc, wins:0},
    {name:'SAS', color:0x2244aa, wins:3},
    {name:'GIGN', color:0x555577, wins:7},
    {name:'IDF', color:0x886644, wins:15},
    {name:'SEAL', color:0x224422, wins:25},
    {name:'ЭЛИТА', color:0xddaa00, wins:50}
];

var mapsByMode = {
    bomb: ['inferno','dust2','mirage','cache'],
    dm: ['nuke','vertigo','train','overpass']
};

// ============================================================
// THREE.JS SETUP С УЛУЧШЕННОЙ ГРАФИКОЙ
// ============================================================
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4a574);
scene.fog = new THREE.FogExp2(0xd4a574, 0.005);

var camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.far = 500;

var renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance",
    alpha: false
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ============================================================
// ПРОДВИНУТОЕ ОСВЕЩЕНИЕ
// ============================================================
var hemiLight = new THREE.HemisphereLight(0xffeecc, 0x886644, 0.8);
scene.add(hemiLight);

var ambientLight = new THREE.AmbientLight(0xffddaa, 0.35);
scene.add(ambientLight);

var sun = new THREE.DirectionalLight(0xffeecc, 1.1);
sun.position.set(60, 120, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Заполняющий свет (fill light)
var fillLight = new THREE.DirectionalLight(0x88aacc, 0.3);
fillLight.position.set(-40, 60, -30);
scene.add(fillLight);

// ============================================================
// СИСТЕМА ЧАСТИЦ (Гильзы, дым, кровь, следы от пуль)
// ============================================================
var particles = [];
var bulletHoles = [];
var smokeClouds = [];

function createParticle(opts) {
    var geo = opts.geo || new THREE.SphereGeometry(0.05, 4, 4);
    var mat = opts.mat || new THREE.MeshBasicMaterial({color: opts.color || 0xffff00});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(opts.pos);
    scene.add(mesh);
    particles.push({
        mesh: mesh,
        vel: opts.vel || new THREE.Vector3(),
        life: opts.life || 2,
        maxLife: opts.life || 2,
        gravity: opts.gravity !== undefined ? opts.gravity : 9.8,
        onDeath: opts.onDeath,
        scale: opts.scale || 1
    });
    return mesh;
}

function ejectShell(pos, dir) {
    var geo = new THREE.CylinderGeometry(0.02, 0.02, 0.08, 6);
    var mat = new THREE.MeshStandardMaterial({color: 0xddaa44, metalness: 0.9, roughness: 0.2});
    var shell = createParticle({
        geo: geo, mat: mat, pos: pos.clone(),
        vel: new THREE.Vector3((Math.random()-0.5)*2, 3+Math.random()*2, (Math.random()-0.5)*2),
        life: 3, gravity: 9.8
    });
}

function createBloodSplatter(pos) {
    for (var i = 0; i < 8; i++) {
        var geo = new THREE.SphereGeometry(0.05+Math.random()*0.05, 4, 4);
        var mat = new THREE.MeshBasicMaterial({color: 0xaa0000, transparent: true, opacity: 0.8});
        createParticle({
            geo: geo, mat: mat, pos: pos.clone(),
            vel: new THREE.Vector3((Math.random()-0.5)*3, Math.random()*3, (Math.random()-0.5)*3),
            life: 1.5, gravity: 9.8
        });
    }
}

function createBulletHole(pos, normal) {
    var geo = new THREE.CircleGeometry(0.08, 8);
    var mat = new THREE.MeshBasicMaterial({color: 0x111111, transparent: true, opacity: 0.8, side: THREE.DoubleSide});
    var hole = new THREE.Mesh(geo, mat);
    hole.position.copy(pos);
    if (normal) {
        hole.lookAt(pos.clone().add(normal));
    }
    hole.position.add(normal.clone().multiplyScalar(0.01));
    scene.add(hole);
    bulletHoles.push({mesh: hole, life: 15});
    // Ограничение количества
    if (bulletHoles.length > 50) {
        var old = bulletHoles.shift();
        scene.remove(old.mesh);
    }
}

function createMuzzleFlash(pos) {
    var geo = new THREE.SphereGeometry(0.15, 6, 6);
    var mat = new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 1});
    var flash = createParticle({
        geo: geo, mat: mat, pos: pos.clone(),
        vel: new THREE.Vector3(0,0,0),
        life: 0.08, gravity: 0
    });
    // Свет вспышки
    var light = new THREE.PointLight(0xffaa00, 3, 8);
    light.position.copy(pos);
    scene.add(light);
    setTimeout(function(){ scene.remove(light); }, 50);
}

function createSmokeCloud(pos) {
    var geo = new THREE.SphereGeometry(0.5, 8, 8);
    var mat = new THREE.MeshBasicMaterial({color: 0xcccccc, transparent: true, opacity: 0.6});
    var cloud = createParticle({
        geo: geo, mat: mat, pos: pos.clone(),
        vel: new THREE.Vector3((Math.random()-0.5)*0.5, 0.5+Math.random()*0.5, (Math.random()-0.5)*0.5),
        life: 8, gravity: -0.3
    });
    smokeClouds.push(cloud);
}

function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
            scene.remove(p.mesh);
            if (p.onDeath) p.onDeath();
            particles.splice(i, 1);
            continue;
        }
        p.vel.y -= p.gravity * dt;
        p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
        // Коллизия с полом
        if (p.mesh.position.y < 0.05) {
            p.mesh.position.y = 0.05;
            p.vel.y *= -0.3;
            p.vel.x *= 0.7;
            p.vel.z *= 0.7;
        }
        // Затухание
        if (p.mesh.material.transparent) {
            p.mesh.material.opacity = p.life / p.maxLife;
        }
        p.mesh.rotation.x += dt * 5;
        p.mesh.rotation.y += dt * 3;
    }
    // Следы от пуль
    for (var i = bulletHoles.length - 1; i >= 0; i--) {
        bulletHoles[i].life -= dt;
        if (bulletHoles[i].life <= 0) {
            scene.remove(bulletHoles[i].mesh);
            bulletHoles.splice(i, 1);
        } else if (bulletHoles[i].life < 3) {
            bulletHoles[i].mesh.material.opacity = bulletHoles[i].life / 3 * 0.8;
        }
    }
}

// ============================================================
// ПРОЦЕДУРНЫЕ ТЕКСТУРЫ ВЫСОКОГО КАЧЕСТВА
// ============================================================
function makeTexture(base, line, size, type) {
    if (!size) size = 512;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    
    // Базовый градиент
    var grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, base);
    grad.addColorStop(0.5, line);
    grad.addColorStop(1, base);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    
    // Шум для реалистичности
    for (var i = 0; i < 2000; i++) {
        var x = Math.random() * size;
        var y = Math.random() * size;
        var r = Math.random() * 2;
        var alpha = Math.random() * 0.3;
        ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 6.28);
        ctx.fill();
    }
    
    // Светлые пятна
    for (var i = 0; i < 500; i++) {
        var x = Math.random() * size;
        var y = Math.random() * size;
        ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.15) + ')';
        ctx.beginPath();
        ctx.arc(x, y, Math.random() * 3, 0, 6.28);
        ctx.fill();
    }
    
    // Специфичные детали по типу
    if (type === 'brick') {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 2;
        for (var y = 0; y < size; y += 32) {
            var offset = (y / 32) % 2 === 0 ? 0 : 32;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(size, y);
            ctx.stroke();
            for (var x = offset; x < size; x += 64) {
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + 32);
                ctx.stroke();
            }
        }
    } else if (type === 'wood') {
        ctx.strokeStyle = 'rgba(40,20,0,0.4)';
        ctx.lineWidth = 1;
        for (var i = 0; i < 30; i++) {
            var y = Math.random() * size;
            ctx.beginPath();
            ctx.moveTo(0, y);
            for (var x = 0; x < size; x += 20) {
                ctx.lineTo(x, y + (Math.random()-0.5) * 5);
            }
            ctx.stroke();
        }
    } else if (type === 'metal') {
        // Царапины
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        for (var i = 0; i < 20; i++) {
            ctx.beginPath();
            var x = Math.random() * size;
            var y = Math.random() * size;
            ctx.moveTo(x, y);
            ctx.lineTo(x + (Math.random()-0.5) * 100, y + (Math.random()-0.5) * 100);
            ctx.stroke();
        }
    } else if (type === 'concrete') {
        // Трещины
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        for (var i = 0; i < 8; i++) {
            ctx.beginPath();
            var x = Math.random() * size;
            var y = Math.random() * size;
            ctx.moveTo(x, y);
            for (var j = 0; j < 5; j++) {
                x += (Math.random()-0.5) * 50;
                y += (Math.random()-0.5) * 50;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    }
    
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 16;
    t.encoding = THREE.sRGBEncoding;
    return t;
}

// Нормал-мапы для объёма
function makeNormalMap(size) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#8080ff';
    ctx.fillRect(0, 0, size, size);
    for (var i = 0; i < 1000; i++) {
        var x = Math.random() * size;
        var y = Math.random() * size;
        var r = Math.random() * 3;
        var nx = Math.floor(128 + (Math.random()-0.5) * 60);
        var ny = Math.floor(128 + (Math.random()-0.5) * 60);
        ctx.fillStyle = 'rgb(' + nx + ',' + ny + ',255)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 6.28);
        ctx.fill();
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
}

};

function addWall(x, z, w, h, d, matKey, canStandOn) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMaterials[matKey] || wallMaterials.sand);
    m.position.set(x, h/2, z);
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData = {w:w, h:h, d:d, topY:h, canStandOn:canStandOn !== false};
    scene.add(m);
    walls.push(m);
    return m;
}

var audioCtx;
function initAudio() { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function snd(type) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    if (type === 'shot') {
        o.type = 'square';
        o.frequency.setValueAtTime(180, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(600, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    } else if (type === 'step') {
        o.type = 'sine';
        o.frequency.setValueAtTime(100, audioCtx.currentTime);
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    } else if (type === 'explode') {
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(100, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    } else {
        o.type = 'sine';
        o.frequency.setValueAtTime(800, audioCtx.currentTime);
        o.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    }
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.5);
}

var joystick = {active:false, dx:0, dy:0, ox:0, oy:0, tid:null};
var look = {active:false, lx:0, ly:0, tid:null};
var firing = false;
var joyZ = document.getElementById('joystick-zone'), joyK = document.getElementById('joystick-knob');

function updJoy(x, y) {
    var dx = x - joystick.ox, dy = y - joystick.oy;
    var d = Math.hypot(dx, dy), mx = 40;
    if (d > mx) { dx = dx/d*mx; dy = dy/d*mx; }
    joyK.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
    joystick.dx = dx/mx; joystick.dy = dy/mx;
}

var shopOpen = false, locked = false, roundActive = false;

function bind(id, cb) {
    var e = document.getElementById(id);
    if (!e) return;
    e.addEventListener('click', function(ev){ev.preventDefault(); cb();});
    e.addEventListener('touchstart', function(ev){ev.preventDefault(); cb();}, {passive:false});
}

if (isMobile) {
    joyZ.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var t = e.changedTouches[0];
        joystick.active = true; joystick.tid = t.identifier;
        var r = joyZ.getBoundingClientRect();
        joystick.ox = r.left + r.width/2; joystick.oy = r.top + r.height/2;
        updJoy(t.clientX, t.clientY);
    }, {passive:false});
    joyZ.addEventListener('touchmove', function(e) {
        e.preventDefault();
        for (var i=0; i<e.changedTouches.length; i++)
            if (e.changedTouches[i].identifier === joystick.tid)
                updJoy(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
    }, {passive:false});
    var ej = function(e) {
        for (var i=0; i<e.changedTouches.length; i++)
            if (e.changedTouches[i].identifier === joystick.tid) {
                joystick.active = false; joystick.dx = 0; joystick.dy = 0;
                joyK.style.transform = 'translate(-50%,-50%)'; break;
            }
    };
    joyZ.addEventListener('touchend', ej); joyZ.addEventListener('touchcancel', ej);
    
    document.addEventListener('touchstart', function(e) {
        for (var i=0; i<e.changedTouches.length; i++) {
            var t = e.changedTouches[i];
            if (t.clientX > innerWidth/2 && !e.target.closest('.screen') && !e.target.closest('.action-btn') && !e.target.closest('#fullscreen-btn')) {
                if (gameState === 'SPECTATING') {
                    cycleSpectate();
                } else {
                    look.active = true; look.tid = t.identifier;
                    look.lx = t.clientX; look.ly = t.clientY;
                }
            }
        }
    }, {passive:false});
    document.addEventListener('touchmove', function(e) {
        for (var i=0; i<e.changedTouches.length; i++) {
            var t = e.changedTouches[i];
            if (look.active && t.identifier === look.tid) {
                player.yaw -= (t.clientX - look.lx) * 0.005;
                player.pitch -= (t.clientY - look.ly) * 0.005;
                player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
                look.lx = t.clientX; look.ly = t.clientY;
            }
        }
    }, {passive:false});
    var el = function(e) {
        for (var i=0; i<e.changedTouches.length; i++)
            if (e.changedTouches[i].identifier === look.tid) { look.active = false; break; }
    };
    document.addEventListener('touchend', el); document.addEventListener('touchcancel', el);
    
    bind('fire-btn', function(){ firing = true; });
    document.getElementById('fire-btn').addEventListener('touchend', function(e){ e.preventDefault(); firing = false; });
    bind('jump-btn', function(){ if (player.onGround && player.alive) { player.vel.y = 7; player.onGround = false; } });
    bind('reload-btn', reload);
    bind('shop-btn', openShop);
    bind('grenade-btn', throwGrenade);
    bind('plant-btn', plantBomb);
    bind('defuse-btn', defuseBomb);
} else {
    joyZ.style.display = 'none';
    ['fire-btn','reload-btn','shop-btn','jump-btn','plant-btn','defuse-btn','grenade-btn'].forEach(function(id){
        var el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    var keys = {};
    window.addEventListener('keydown', function(e) {
        keys[e.code] = true;
        if (e.code === 'KeyR') reload();
        if (e.code === 'KeyB') openShop();
        if (e.code === 'Escape') {
            if (shopOpen) closeShop();
            else if (document.pointerLockElement) document.exitPointerLock();
        }
        if (e.code === 'KeyF') toggleFS();
        if (e.code === 'Space' && player.onGround && player.alive) { player.vel.y = 7; player.onGround = false; }
        if (e.code === 'KeyE') {
            if (gameState === 'SPECTATING') cycleSpectate();
            else if (player.hasBomb) plantBomb();
            else if (player.team === 'CT') defuseBomb();
        }
        if (e.code === 'KeyG') throwGrenade();
        if (e.code === 'KeyQ') {
            var types = ['he','flash','smoke','molotov'];
            var idx = types.indexOf(player.currentGrenade);
            player.currentGrenade = types[(idx+1)%types.length];
        }
    });
    window.addEventListener('keyup', function(e) { keys[e.code] = false; });
    renderer.domElement.addEventListener('click', function(){
        if (gameState === 'PLAYING' && !shopOpen && roundActive && player.alive)
            renderer.domElement.requestPointerLock();
        else if (gameState === 'SPECTATING') cycleSpectate();
    });
    document.addEventListener('pointerlockchange', function(){ locked = document.pointerLockElement === renderer.domElement; });
    document.addEventListener('mousemove', function(e) {
        if (!locked) return;
        player.yaw -= e.movementX * 0.002;
        player.pitch -= e.movementY * 0.002;
        player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
    });
    document.addEventListener('mousedown', function(e){ if (e.button === 0 && locked) firing = true; });
    document.addEventListener('mouseup', function(e){ if (e.button === 0) firing = false; });
    window.getKeys = function(){ return keys; };
}

}
function buyR() {

}
function buyG(t) {

// СТРЕЛЬБА И КОЛЛИЗИИ (ИСПРАВЛЕННЫЕ!)
// ============================================================
var raycaster = new THREE.Raycaster(), lastShot = 0;

function shoot() {
    var wp = player.weapons[player.currentWeapon], now = performance.now();
    if (player.reloading || wp.ammo <= 0 || now - lastShot < wp.fireRate || shopOpen || !player.alive || !roundActive || gameState !== 'PLAYING') return;
    lastShot = now; wp.ammo--; snd('shot');
    gun.position.z = -0.3; muzzle.intensity = 4;
    setTimeout(function(){ muzzle.intensity = 0; gun.position.z = -0.4; }, 60);
    
    // Гильза
    var shellPos = camera.position.clone();
    var shellDir = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    ejectShell(shellPos, shellDir);
    
    // Вспышка
    var flashPos = camera.position.clone();
    var fwd = new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch), Math.sin(player.pitch), -Math.cos(player.yaw)*Math.cos(player.pitch));
    flashPos.add(fwd.clone().multiplyScalar(1));
    createMuzzleFlash(flashPos);
    
    var d = new THREE.Vector3((Math.random()-0.5)*wp.spread, (Math.random()-0.5)*wp.spread, -1);
    d.applyQuaternion(camera.quaternion).normalize();
    raycaster.set(camera.position, d);
    
    // Проверка попадания в ботов И стены (для следов от пуль)
    var tgts = [];
    allBots.forEach(function(b){ if (b.userData.alive) b.traverse(function(c){ if (c.isMesh) tgts.push(c); }); });
    var hBots = raycaster.intersectObjects(tgts);
    var hWalls = raycaster.intersectObjects(walls);
    
    var hitSomething = false;
    var closestDist = Infinity;
    var hitType = null;
    var hitObj = null;
    var hitPoint = null;
    var hitNormal = null;
    
    if (hBots.length > 0) {
        closestDist = hBots[0].distance;
        hitType = 'bot';
        hitObj = hBots[0].object;
        hitPoint = hBots[0].point;
    }
    if (hWalls.length > 0 && hWalls[0].distance < closestDist) {
        closestDist = hWalls[0].distance;
        hitType = 'wall';
        hitPoint = hWalls[0].point;
        hitNormal = hWalls[0].face ? hWalls[0].face.normal.clone() : new THREE.Vector3(0,1,0);
        hitNormal.transformDirection(hWalls[0].object.matrixWorld);
    }
    
    if (hitType === 'bot') {
        var o = hitObj;
        while (o.parent && o.userData.hp === undefined) o = o.parent;
        if (o.userData.hp !== undefined && o.userData.team !== player.team) {
            var hs = hitObj.geometry.parameters && hitObj.geometry.parameters.height < 0.5;
            var dm = hs ? wp.damage * 3 : wp.damage;
            if (o.userData.armor > 0) dm *= (1 - o.userData.armor/100);
            o.userData.hp -= dm;
            createBloodSplatter(hitPoint);
            snd('hit'); showHM();
            if (o.userData.hp <= 0) killEntity(o, player);
        }
    } else if (hitType === 'wall') {
        createBulletHole(hitPoint, hitNormal);
    }
    
    updHUD();
    if (wp.ammo === 0 && wp.reserve > 0) reload();
}

function reload() {
    var wp = player.weapons[player.currentWeapon];
    if (player.reloading || wp.ammo === wp.maxAmmo || wp.reserve === 0) return;
    player.reloading = true;
    var rb = document.getElementById('reload-btn');
    if (rb) rb.style.opacity = '0.5';
    setTimeout(function(){
        var n = wp.maxAmmo - wp.ammo, t = Math.min(n, wp.reserve);
        wp.ammo += t; wp.reserve -= t;
        player.reloading = false;
        if (rb) rb.style.opacity = '1';
        updHUD();
    }, wp.reloadTime);
}

function showHM() {
    var h = document.getElementById('hit-marker');
    h.style.opacity = '1';
    setTimeout(function(){ h.style.opacity = '0'; }, 120);
}

// ИСПРАВЛЕННЫЕ КОЛЛИЗИИ - корректная работа с ящиками
function collideW(pos, vel, radius) {
    if (!radius) radius = 0.4;
    var onGround = false;
    var standY = 0;
    var feetY = pos.y - 1.7; // Высота ног игрока (поскольку pos.y - это высота глаз)
    
    for (var i = 0; i < walls.length; i++) {
        var w = walls[i];
        var ww = w.userData.w, hh = w.userData.h, dd = w.userData.d;
        var topY = w.userData.topY;
        
        // Горизонтальная коллизия - ТОЛЬКО если ноги игрока НИЖЕ верха стены
        // Это позволяет запрыгивать на ящики
        if (feetY < topY - 0.3) {
            var dx = Math.max(0, Math.abs(pos.x - w.position.x) - ww/2);
            var dz = Math.max(0, Math.abs(pos.z - w.position.z) - dd/2);
            if (dx < radius && dz < radius) {
                if (dx < dz) pos.z = w.position.z + Math.sign(pos.z - w.position.z) * (dd/2 + radius);
                else pos.x = w.position.x + Math.sign(pos.x - w.position.x) * (ww/2 + radius);
            }
        }
        
        // Вертикальная коллизия - можно стоять на ящиках
        if (w.userData.canStandOn) {
            var inXZ = Math.abs(pos.x - w.position.x) < ww/2 + radius &&
                       Math.abs(pos.z - w.position.z) < dd/2 + radius;
            if (inXZ) {
                // Игрок над ящиком и падает или уже стоит
                if (feetY >= topY - 0.1 && feetY < topY + 0.5 && vel.y <= 0.5) {
                    if (topY > standY) standY = topY;
                    onGround = true;
                }
            }
        }
    }
    
    return {onGround: onGround, standY: standY};
}

function killEntity(e, killer) {
    e.userData.alive = false;
    e.rotation.x = Math.PI/2; e.position.y = 0.3;
    var kn = killer === player ? 'ТЫ' : killer.userData.name;
    addKF(kn, e.userData.name, killer === player || killer.userData.team === player.team);
    if (killer === player) {
        player.score += 100;
        player.kills++;
        player.money += 300;
        killStreak++;
        updateKillStreak();
    }
    
    // Эффект крови
    createBloodSplatter(e.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
    
    if (e.userData.hasBomb && gameMode === 'bomb') {
        e.userData.hasBomb = false;
        var teammates = allBots.filter(function(b){ return b.userData.team === e.userData.team && b.userData.alive && b !== e; });
        if (teammates.length > 0) {
            teammates[Math.floor(Math.random()*teammates.length)].userData.hasBomb = true;
        }
    }
    
    if (gameMode === 'dm') {
        e.userData.respawnTimer = 3;
    }
}

function addKF(k, v, f) {
    var fd = document.getElementById('kill-feed'), m = document.createElement('div');
    m.className = 'kill-msg'; m.style.color = f ? '#5af' : '#f55';
    m.textContent = k + ' ✕ ' + v;
    fd.appendChild(m);
    setTimeout(function(){ if (m.parentNode) m.parentNode.removeChild(m); }, 3000);
}

function updateKillStreak() {
    var ks = document.getElementById('kill-streak');
    var msg = '';
    if (killStreak === 2) msg = 'DOUBLE KILL!';
    else if (killStreak === 3) msg = 'TRIPLE KILL!';
    else if (killStreak === 4) msg = 'QUADRA KILL!';
    else if (killStreak >= 5) msg = 'PENTA KILL!!!';
    if (msg) {
        ks.textContent = msg;
        ks.style.opacity = '1';
        setTimeout(function(){ ks.style.opacity = '0'; }, 2000);
    }
}

function throwGrenade() {
    if (gameState !== 'PLAYING' || !player.alive || !roundActive) return;
    var type = player.currentGrenade;
    if (player.grenades[type] <= 0) { showRM('НЕТ ГРАНАТ!', 1500); return; }
    player.grenades[type]--;
    
    var fwd = new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch), Math.sin(player.pitch)+0.3, -Math.cos(player.yaw)*Math.cos(player.pitch));
    var startPos = camera.position.clone().add(fwd.clone().multiplyScalar(0.5));
    
    var geo = new THREE.SphereGeometry(0.15, 8, 8);
    var color = type === 'he' ? 0x445566 : type === 'flash' ? 0xcccccc : type === 'smoke' ? 0x888888 : 0xaa4400;
    var mat = new THREE.MeshStandardMaterial({color: color, metalness: 0.5});
    var grenade = createParticle({
        geo: geo, mat: mat, pos: startPos,
        vel: fwd.clone().multiplyScalar(20),
        life: 2, gravity: 9.8,
        onDeath: function() { detonateGrenade(type, grenade.position.clone()); }
    });
    updHUD();
}

function detonateGrenade(type, pos) {
    if (type === 'he') {
        snd('explode');
        // Эффект взрыва
        for (var i = 0; i < 30; i++) {
            var geo = new THREE.SphereGeometry(0.1+Math.random()*0.2, 6, 6);
            var mat = new THREE.MeshBasicMaterial({color: Math.random() > 0.5 ? 0xff6600 : 0xffaa00, transparent: true, opacity: 1});
            createParticle({
                geo: geo, mat: mat, pos: pos.clone(),
                vel: new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10),
                life: 1, gravity: 5
            });
        }
        // Урон
        var radius = grenadesData.he.radius;
        allBots.forEach(function(b){
            if (b.userData.alive) {
                var d = b.position.distanceTo(pos);
                if (d < radius) {
                    var dmg = grenadesData.he.damage * (1 - d/radius);
                    if (b.userData.team !== player.team) {
                        b.userData.hp -= dmg;
                        createBloodSplatter(b.position.clone().add(new THREE.Vector3(0,1,0)));
                        if (b.userData.hp <= 0) killEntity(b, player);
                    }
                }
            }
        });
        if (player.alive) {
            var d = player.pos.distanceTo(pos);
            if (d < radius) {
                var dmg = grenadesData.he.damage * (1 - d/radius) * 0.5;
                player.hp -= dmg;
                showDamageOverlay();
                if (player.hp <= 0) { player.hp = 0; player.alive = false; onPlayerDeath(); }
                updHUD();
            }
        }
    } else if (type === 'smoke') {
        for (var i = 0; i < 20; i++) {
            setTimeout(function(){
                createSmokeCloud(pos.clone().add(new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2)));
            }, i * 50);
        }
    } else if (type === 'flash') {
        // Вспышка - ослепление ботов (упрощённо - просто урон)
        var flash = new THREE.PointLight(0xffffff, 10, 30);
        flash.position.copy(pos);
        scene.add(flash);
        setTimeout(function(){ scene.remove(flash); }, 300);
    } else if (type === 'molotov') {
        snd('explode');
        // Огонь
        for (var i = 0; i < 40; i++) {
            setTimeout(function(){
                var geo = new THREE.SphereGeometry(0.2+Math.random()*0.3, 6, 6);
                var mat = new THREE.MeshBasicMaterial({color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00, transparent: true, opacity: 0.8});
                createParticle({
                    geo: geo, mat: mat, pos: pos.clone().add(new THREE.Vector3((Math.random()-0.5)*3, 0, (Math.random()-0.5)*3)),
                    vel: new THREE.Vector3((Math.random()-0.5)*2, 2+Math.random()*3, (Math.random()-0.5)*2),
                    life: 2, gravity: -1
                });
            }, i * 100);
        }
        // Урон по площади
        var radius = grenadesData.molotov.radius;
        var ticks = 0;
        var interval = setInterval(function(){
            ticks++;
            if (ticks > 10) { clearInterval(interval); return; }
            allBots.forEach(function(b){
                if (b.userData.alive && b.userData.team !== player.team) {
                    var d = b.position.distanceTo(pos);
                    if (d < radius) {
                        b.userData.hp -= grenadesData.molotov.damage * 0.3;
                        if (b.userData.hp <= 0) killEntity(b, player);
                    }
                }
            });
        }, 500);
    }
}

function showDamageOverlay() {
    var ov = document.getElementById('damage-overlay');
    ov.style.background = 'radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0.5) 100%)';
    setTimeout(function(){
        ov.style.background = 'radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0) 100%)';
    }, 300);
}

// ИИ БОТОВ (ИСПРАВЛЕННЫЙ)
// ============================================================
function findTgt(b) {
    var en = [];
    if (b.userData.team === 'CT') {
        allBots.forEach(function(o){ if (o.userData.team === 'T' && o.userData.alive) en.push(o); });
        if (player.alive && player.team === 'T') en.push(player);
    } else {
        allBots.forEach(function(o){ if (o.userData.team === 'CT' && o.userData.alive) en.push(o); });
        if (player.alive && player.team === 'CT') en.push(player);
    }
    var cl = null, md = 1e9;
    en.forEach(function(e) {
        var d = b.position.distanceTo(e === player ? player.pos : e.position);
        if (d < md) { md = d; cl = e; }
    });
    return cl;
}

function hasLOS(a, b) {
    var d = new THREE.Vector3().subVectors(b, a), l = d.length();
    d.normalize();
    raycaster.set(a, d); raycaster.far = l;
    var h = raycaster.intersectObjects(walls);
    raycaster.far = 1e9;
    return h.length === 0;
}

function updBot(b, dt, now) {
    if (!roundActive) return;
    
    if (!b.userData.alive && gameMode === 'dm') {
        b.userData.respawnTimer -= dt;
        if (b.userData.respawnTimer <= 0) respawnBot(b);
        return;
    }
    if (!b.userData.alive) return;
    
    var tgt = findTgt(b);
    b.userData.target = tgt;
    var tp = tgt ? (tgt === player ? player.pos : tgt.position) : null;
    var dist = tp ? b.position.distanceTo(tp) : 999;
    var eye = new THREE.Vector3(b.position.x, 1.7, b.position.z);
    var canSee = tp && hasLOS(eye, new THREE.Vector3(tp.x, 1.7, tp.z)) && dist < b.userData.viewDistance;
    
    if (canSee) { b.userData.state = 'combat'; b.userData.stateTimer = 0; }
    else { b.userData.stateTimer += dt; if (b.userData.stateTimer > 1.5) b.userData.state = 'patrol'; }
    
    // Гравитация
    b.userData.vel.y -= 18 * dt;
    b.position.y += b.userData.vel.y * dt;
    
    // Коллизии
    var col = collideW(b.position, b.userData.vel, 0.4);
    var groundY = col.standY > 0 ? col.standY : 0;
    if (b.position.y <= groundY + 0.01) {
        b.position.y = groundY;
        b.userData.vel.y = 0;
        b.userData.onGround = true;
    } else {
        b.userData.onGround = false;
    }
    
    // Защита от выхода за границы
    if (Math.abs(b.position.x) > 90 || Math.abs(b.position.z) > 90) {
        var spawn = b.userData.team === 'CT' ? mapSpawns.ct : mapSpawns.t;
        b.position.set(spawn.x, groundY, spawn.z);
        b.userData.wpIdx = 0;
    }
    
    if (b.userData.state === 'combat' && tp) {
        var toT = new THREE.Vector3().subVectors(tp, b.position); toT.y = 0; toT.normalize();
        b.rotation.y = Math.atan2(toT.x, toT.z);
        
        if (dist > 10) {
            b.position.x += toT.x * b.userData.speed * dt;
            b.position.z += toT.z * b.userData.speed * dt;
        }
        if (dist < 18) {
            var st = new THREE.Vector3(-toT.z, 0, toT.x);
            b.position.x += st.x * b.userData.strafeDir * b.userData.speed * 0.4 * dt;
            b.position.z += st.z * b.userData.strafeDir * b.userData.speed * 0.4 * dt;
            if (Math.random() < 0.02) b.userData.strafeDir *= -1;
        }
        
        var fr = weaponsData[b.userData.weapon].fireRate * 2.5;
        if (now - b.userData.lastShot > fr && dist < b.userData.viewDistance) {
            b.userData.lastShot = now;
            // СНИЖЕННАЯ ТОЧНОСТЬ
            var hc = b.userData.accuracy * Math.max(0.15, 1 - dist/100);
            if (Math.random() < hc) {
                var dm = weaponsData[b.userData.weapon].damage * 0.4;
                if (tgt === player) {
                    if (player.alive) {
                        if (player.armor > 0) dm *= (1 - player.armor/100);
                        player.hp -= dm;
                        snd('hit');
                        showDamageOverlay();
                        if (player.hp <= 0) {
                            player.hp = 0; player.alive = false;
                            player.deaths++;
                            killStreak = 0;
                            addKF(b.userData.name, 'ТЫ', false);
                            onPlayerDeath();
                        }
                        updHUD();
                    }
                } else if (tgt.userData.alive) {
                    if (tgt.userData.armor > 0) dm *= (1 - tgt.userData.armor/100);
                    tgt.userData.hp -= dm;
                    createBloodSplatter(tgt.position.clone().add(new THREE.Vector3(0,1,0)));
                    if (tgt.userData.hp <= 0) killEntity(tgt, b);
                }
            }
            snd('shot');
            // Визуал выстрела бота
            var flashPos = b.position.clone().add(new THREE.Vector3(0, 1.5, 0));
            createMuzzleFlash(flashPos);
        }
    } else {
        // ПАТРУЛЬ
        var rt = b.userData.route;
        if (rt && rt.length > 0) {
            var wp = rt[b.userData.wpIdx];
            var toWP = new THREE.Vector3(wp.x - b.position.x, 0, wp.z - b.position.z);
            var wpDist = toWP.length();
            if (wpDist < 3) {
                b.userData.wpIdx = (b.userData.wpIdx + 1) % rt.length;
                wp = rt[b.userData.wpIdx];
                toWP.set(wp.x - b.position.x, 0, wp.z - b.position.z);
            }
            toWP.normalize();
            b.rotation.y = Math.atan2(toWP.x, toWP.z);
            b.position.x += toWP.x * b.userData.speed * dt;
            b.position.z += toWP.z * b.userData.speed * dt;
            
            var moved = b.position.distanceTo(b.userData.lastPos);
            if (moved < 0.05 * dt) {
                b.userData.stuckT += dt;
                if (b.userData.stuckT > 0.8) {
                    b.position.set(wp.x, groundY, wp.z);
                    b.userData.stuckT = 0;
                    b.userData.wpIdx = (b.userData.wpIdx + 1) % rt.length;
                }
            } else {
                b.userData.stuckT = 0;
            }
            b.userData.lastPos.copy(b.position);
        }
    }
}

function respawnBot(b) {
    var spawn = b.userData.team === 'CT' ? mapSpawns.ct : mapSpawns.t;
    b.position.set(spawn.x + (Math.random()-0.5)*8, 0, spawn.z + (Math.random()-0.5)*8);
    b.rotation.set(0, 0, 0);
    b.userData.hp = 100;
    b.userData.alive = true;
    b.userData.vel.set(0, 0, 0);
}

function plantBomb() {
    if (gameMode !== 'bomb' || !player.alive || !player.hasBomb || bomb.planted) return;
    var onSite = false;
    if (player.team === 'T') {
        for (var k in bombSites) {
            var s = bombSites[k];
            if (Math.hypot(player.pos.x - s.x, player.pos.z - s.z) < s.r) { onSite = true; break; }
        }
    }
    if (!onSite) { showRM('НУЖНО БЫТЬ НА САЙТЕ!', 1500); return; }
    bomb.planted = true;
    bomb.position.copy(player.pos);
    bomb.position.y = 0.1;
    bomb.mesh.position.copy(bomb.position);
    bomb.mesh.visible = true;
    bomb.timer = 40;
    player.hasBomb = false;
    var pb = document.getElementById('plant-btn');
    if (pb) pb.style.display = 'none';
    document.getElementById('bomb-status').style.display = 'block';
    showRM('💣 БОМБА ЗАЛОЖЕНА!', 2000);
}

function defuseBomb() {
    if (gameMode !== 'bomb' || !player.alive || !bomb.planted || player.team !== 'CT') return;
    var dist = Math.hypot(player.pos.x - bomb.position.x, player.pos.z - bomb.position.z);
    if (dist > 3) { showRM('ПОДОЙДИ К БОМБЕ!', 1500); return; }
    bomb.defusing = true;
    showRM('ОБЕЗВРЕЖИВАНИЕ...', 1000);
}

function updateBomb(dt) {
    if (!bomb.planted) return;
    if (bomb.defusing) {
        bomb.defuseProgress += dt;
        if (bomb.defuseProgress >= 5) {
            bomb.planted = false; bomb.defusing = false; bomb.defuseProgress = 0;
            bomb.mesh.visible = false;
            document.getElementById('bomb-status').style.display = 'none';
            endRound('CT');
            return;
        }
    }
    bomb.timer -= dt;
    document.getElementById('bomb-timer').textContent = Math.ceil(bomb.timer);
    if (bomb.timer <= 0) {
        bomb.planted = false;
        bomb.mesh.visible = false;
        document.getElementById('bomb-status').style.display = 'none';
        snd('explode');
        // Взрыв
        for (var i = 0; i < 50; i++) {
            var geo = new THREE.SphereGeometry(0.2+Math.random()*0.3, 6, 6);
            var mat = new THREE.MeshBasicMaterial({color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00, transparent: true, opacity: 1});
            createParticle({
                geo: geo, mat: mat, pos: bomb.position.clone(),
                vel: new THREE.Vector3((Math.random()-0.5)*15, Math.random()*15, (Math.random()-0.5)*15),
                life: 1.5, gravity: 5
            });
        }
        allBots.forEach(function(b){
            if (b.userData.team === 'CT' && b.userData.alive) {
                var d = b.position.distanceTo(bomb.position);
                if (d < 30) killEntity(b, {userData:{name:'БОМБА',team:'T'}});
            }
        });
        if (player.alive && player.team === 'CT') {
            var d = player.pos.distanceTo(bomb.position);
            if (d < 30) {
                player.hp = 0; player.alive = false;
                addKF('БОМБА', 'ТЫ', false);
                onPlayerDeath();
            }
        }
        endRound('T');
    }
}

// СМЕРТЬ И НАБЛЮДЕНИЕ
// ============================================================
function onPlayerDeath() {
    if (gameMode === 'dm') {
        player.respawnTimer = 3;
        gameState = 'DEAD';
        var rt = document.getElementById('respawn-timer');
        if (rt) rt.style.display = 'block';
    } else {
        gameState = 'SPECTATING';
        spectateIdx = 0;
        var teammates = allBots.filter(function(b){ return b.userData.team === player.team && b.userData.alive; });
        if (teammates.length > 0) {
            spectateTarget = teammates[0];
            document.getElementById('spectate-info').style.display = 'block';
            document.getElementById('spectate-name').textContent = spectateTarget.userData.name;
        } else {
            spectateTarget = null;
        }
    }
    if (!isMobile && document.pointerLockElement) document.exitPointerLock();
}

function cycleSpectate() {
    var teammates = allBots.filter(function(b){ return b.userData.team === player.team && b.userData.alive; });
    if (teammates.length === 0) return;
    spectateIdx = (spectateIdx + 1) % teammates.length;
    spectateTarget = teammates[spectateIdx];
    document.getElementById('spectate-name').textContent = spectateTarget.userData.name;
}

function respawnPlayer() {
    var spawn = mapSpawns[player.team];
    player.pos.set(spawn.x + (Math.random()-0.5)*8, 1.7, spawn.z + (Math.random()-0.5)*8);
    player.hp = player.maxHp;
    player.alive = true;
    player.vel.set(0, 0, 0);
    player.onGround = true;
    player.respawnTimer = 0;
    gameState = 'PLAYING';
    var rt = document.getElementById('respawn-timer');
    if (rt) rt.style.display = 'none';
    for (var k in player.weapons) player.weapons[k].ammo = player.weapons[k].maxAmmo;
    if (!isMobile) renderer.domElement.requestPointerLock();
}

// МИНИ-КАРТА

function updateMinimap() {
    var canvas = document.getElementById('minimap');
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 160, 160);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 160, 160);
    
    var scale = 0.8;
    var cx = 80, cy = 80;
    
    // Стены
    ctx.fillStyle = 'rgba(150,150,150,0.5)';
    walls.forEach(function(w){
        var x = cx + (w.position.x - player.pos.x) * scale;
        var y = cy + (w.position.z - player.pos.z) * scale;
        var ww = w.userData.w * scale;
        var dd = w.userData.d * scale;
        if (x > -50 && x < 210 && y > -50 && y < 210) {
            ctx.fillRect(x - ww/2, y - dd/2, ww, dd);
        }
    });
    
    // Союзники
    allBots.forEach(function(b){
        if (b.userData.alive && b.userData.team === player.team) {
            var x = cx + (b.position.x - player.pos.x) * scale;
            var y = cy + (b.position.z - player.pos.z) * scale;
            if (x > 0 && x < 160 && y > 0 && y < 160) {
                ctx.fillStyle = '#5af';
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 6.28);
                ctx.fill();
            }
        }
    });
    
    // Враги (только если видимы)
    allBots.forEach(function(b){
        if (b.userData.alive && b.userData.team !== player.team) {
            var d = b.position.distanceTo(player.pos);
            if (d < 30) {
                var x = cx + (b.position.x - player.pos.x) * scale;
                var y = cy + (b.position.z - player.pos.z) * scale;
                if (x > 0 && x < 160 && y > 0 && y < 160) {
                    ctx.fillStyle = '#f55';
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, 6.28);
                    ctx.fill();
                }
            }
        }
    });
    
    // Игрок
    ctx.fillStyle = '#0f0';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, 6.28);
    ctx.fill();
    // Направление взгляда
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx - Math.sin(player.yaw) * 10, cy - Math.cos(player.yaw) * 10);
    ctx.stroke();
}

function endRound(winner) {
    roundActive = false;
    if (winner === 'CT') {
        ctScore++;
        if (gameMode === 'bomb') {
            player.money += 3000;
            totalWins++;
            localStorage.setItem('ms_wins', totalWins);
        } else {
            player.money += 500;
        }
        showRM('ПОБЕДА CT!', 2500);
    } else {
        tScore++;
        if (gameMode === 'bomb') {
            player.money += 1400;
        } else {
            player.money += 500;
        }
        showRM('ПОБЕДА T!', 2500);
    }
    player.money += 500;
    if (player.money > 16000 && gameMode === 'bomb') player.money = 16000;
    updHUD();
    
    setTimeout(function(){
        if (gameMode === 'dm') {
            showGameOver();
        } else if (roundNum >= MAX_ROUNDS || ctScore >= 6 || tScore >= 6) {
            showGameOver();
        } else {
            showRE(winner);
        }
    }, 2500);
}

function showRM(t, d) {
    var m = document.getElementById('round-msg');
    m.textContent = t; m.style.opacity = '1';
    m.style.color = t.indexOf('CT') > -1 ? '#5af' : (t.indexOf('T') > -1 ? '#f55' : '#ffcc00');
    setTimeout(function(){ m.style.opacity = '0'; }, d);
}

function showRE(w) {
    document.getElementById('round-end').classList.add('active');
    document.getElementById('round-end-title').textContent = w === 'CT' ? 'РАУНД ЗА CT' : 'РАУНД ЗА T';

}

function showGameOver() {
    gameOver = true;
    document.getElementById('end-menu').classList.add('active');
    var w;
    if (gameMode === 'dm') {
        w = player.kills > 10;
        if (w) {
            totalWins++;
            localStorage.setItem('ms_wins', totalWins);
        }
        document.getElementById('end-title').textContent = w ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
    } else {
        w = ctScore > tScore;
        document.getElementById('end-title').textContent = w ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
    }

    document.getElementById('end-stats').innerHTML = 
        '<div style="font-size:16px;margin:12px 0;line-height:1.8">'+
        (gameMode === 'dm' ? 'УБИЙСТВ: '+player.kills+'<br>СМЕРТЕЙ: '+player.deaths :
        'CT: '+ctScore+' - T: '+tScore+'<br>УБИЙСТВ: '+player.kills)+
        '<br>СЧЕТ: '+player.score+'<br>💰 '+player.money+
        '<br><br>Ранг: <span class="rank-badge">'+getRank().name+'</span>'+
        '<br>Всего побед: '+totalWins+'</div>';
}
