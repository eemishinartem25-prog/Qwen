<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Strike Pro 6.0</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#ffcc00}
canvas{display:block;width:100vw;height:100vh;filter:contrast(1.2) saturate(1.4) brightness(1.12)}
#bloom{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:0.25;background:radial-gradient(ellipse at center,rgba(255,200,100,0.5) 0%,transparent 70%)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,0.9) 100%)}
#damage-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0) 100%);transition:background 0.3s}
#blind-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;background:rgba(255,255,255,0);transition:background 0.3s}
#shock-overlay{position:absolute;inset:0;pointer-events:none;z-index:7;background:rgba(100,180,255,0);transition:background 0.15s}
#critical-overlay{position:absolute;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,0) 100%)}
#critical-overlay.active{animation:cp 1.5s infinite}
@keyframes cp{0%,100%{background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,0.3) 100%)}50%{background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0.5) 100%)}}
#chromatic{position:absolute;inset:0;pointer-events:none;z-index:9;mix-blend-mode:screen;opacity:0;transition:opacity 0.5s}
#chromatic.active{opacity:0.2;background:linear-gradient(90deg,rgba(255,0,0,0.4),transparent 30%,transparent 70%,rgba(0,100,255,0.4))}
#hud{position:absolute;top:10px;left:10px;right:10px;font-size:14px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hud-left,#hud-right{background:rgba(0,0,0,0.8);padding:8px;border-radius:5px;border:1px solid #ffcc00;backdrop-filter:blur(5px)}
#hp-bar{width:120px;height:10px;background:#300;border:1px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:linear-gradient(90deg,#0f0,#5f5);transition:width 0.2s}
#ability-bar{width:120px;height:8px;background:#303;border:1px solid #a0f;margin-top:3px}
#ability-fill{height:100%;background:linear-gradient(90deg,#a0f,#f0f);transition:width 0.2s}
#round-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:8px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:10;pointer-events:none}
#team-score{display:flex;gap:20px;margin-top:5px}
.ct-score{color:#5af;text-shadow:0 0 10px #5af}.t-score{color:#f55;text-shadow:0 0 10px #f55}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;transition:all 0.1s}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:var(--ch-color,rgba(0,255,0,0.95));box-shadow:0 0 5px var(--ch-color,#0f0)}
#crosshair::before{left:calc(50% - var(--ch-thick,2px)/2);top:calc(50% - var(--ch-size,12px));width:var(--ch-thick,2px);height:calc(var(--ch-size,12px)*2 - var(--ch-gap,4px)*2)}
#crosshair::after{top:calc(50% - var(--ch-thick,2px)/2);left:calc(50% - var(--ch-size,12px));height:var(--ch-thick,2px);width:calc(var(--ch-size,12px)*2 - var(--ch-gap,4px)*2)}
#crosshair.spread::before{height:calc(var(--ch-size,12px)*2.5 - var(--ch-gap,4px)*2)}
#crosshair.spread::after{width:calc(var(--ch-size,12px)*2.5 - var(--ch-gap,4px)*2)}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20;background:rgba(0,0,0,0.3)}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:radial-gradient(circle,rgba(255,204,0,0.9),rgba(255,204,0,0.4));border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.6);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,50,50,0.7),rgba(200,0,0,0.4));font-size:14px}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:radial-gradient(circle,rgba(50,150,255,0.7),rgba(0,100,200,0.4));font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,200,0,0.7),rgba(200,150,0,0.4));font-size:12px}
#jump-btn{bottom:30px;right:115px;width:60px;height:60px;background:radial-gradient(circle,rgba(0,200,100,0.7),rgba(0,150,50,0.4));font-size:11px}
#slide-btn{bottom:100px;right:115px;width:50px;height:50px;background:radial-gradient(circle,rgba(100,150,200,0.7),rgba(50,100,150,0.4));font-size:10px}
#weapon-switch-btn{bottom:170px;right:115px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,150,0,0.7),rgba(200,100,0,0.4));font-size:10px}
#ability-btn{bottom:240px;right:115px;width:50px;height:50px;background:radial-gradient(circle,rgba(200,100,255,0.8),rgba(150,50,200,0.5));font-size:18px;border-color:#a0f}
#ability-btn.cooldown{opacity:0.4}
#zeus-btn{bottom:240px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(100,180,255,0.8),rgba(50,100,200,0.5));font-size:18px;border-color:#5af}
#zeus-btn.cooldown{opacity:0.4}
#knife-btn{bottom:310px;right:115px;width:50px;height:50px;background:radial-gradient(circle,rgba(200,200,200,0.7),rgba(100,100,100,0.4));font-size:18px}
#grenade-btn{bottom:310px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(150,100,50,0.7),rgba(100,70,30,0.4));font-size:18px}
#settings-btn{position:absolute;top:60px;right:10px;width:40px;height:40px;background:rgba(100,100,100,0.5);border:2px solid #888;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;cursor:pointer}
#fullscreen-btn{position:absolute;top:10px;right:10px;width:40px;height:40px;background:rgba(0,200,0,0.5);border:2px solid #0f0;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;cursor:pointer}
#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#zeus-ammo{position:absolute;bottom:295px;right:50px;color:#5af;font-size:12px;pointer-events:none;z-index:10}
#ability-info{position:absolute;bottom:295px;right:125px;color:#a0f;font-size:11px;pointer-events:none;z-index:10}
#grenade-info{position:absolute;bottom:365px;right:50px;color:#c90;font-size:11px;pointer-events:none;z-index:10}
#respawn-timer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#f55;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;display:none}
#minimap{position:absolute;bottom:160px;left:10px;width:120px;height:120px;background:rgba(0,0,0,0.8);border:2px solid #ffcc00;border-radius:5px;pointer-events:none;z-index:15}
#pick-prompt{position:absolute;top:60%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:10px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:15;pointer-events:none;display:none;color:#fff}
#door-prompt{position:absolute;top:55%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:10px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:15;pointer-events:none;display:none;color:#fff}
.screen{position:absolute;inset:0;background:rgba(0,0,0,0.97);color:#ffcc00;display:none;flex-direction:column;align-items:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.active{display:flex}
.screen h1{font-size:36px;margin:10px 0;color:#ff3300;text-shadow:0 0 30px rgba(255,50,0,1),0 0 60px rgba(255,100,0,0.7);letter-spacing:3px}
.version-tag{font-size:16px;color:#0f0;background:rgba(0,255,0,0.2);padding:5px 15px;border-radius:15px;border:2px solid #0f0;margin-bottom:10px}
.screen h2{font-size:20px;margin:10px 0 8px;color:#ffcc00}
.btn-main{background:linear-gradient(180deg,#ffcc00,#cc9900);color:#000;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:200px}
.btn-mode{background:linear-gradient(180deg,#5af,#28a);color:#fff;border:none;padding:12px 30px;font-size:16px;font-weight:bold;margin:6px;border-radius:8px;cursor:pointer;min-width:250px}
.btn-map{background:rgba(255,204,0,0.25);border:2px solid #ffcc00;padding:10px;margin:5px;border-radius:8px;cursor:pointer;min-width:180px;color:#fff}
.btn-map.selected{background:rgba(0,255,0,0.4);border-color:#0f0}
.btn-agent{background:rgba(100,100,100,0.35);border:2px solid #888;padding:8px;margin:4px;border-radius:8px;cursor:pointer;min-width:220px;color:#fff;display:flex;align-items:center;gap:10px}
.btn-agent.selected{border-color:#0f0;background:rgba(0,255,0,0.25)}
.btn-agent.locked{opacity:0.5}
.btn-agent.god{border-color:#ffd700;background:linear-gradient(135deg,rgba(255,215,0,0.4),rgba(255,100,0,0.3))}
.agent-preview{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.agent-bonus{font-size:10px;color:#0f0;margin-top:2px}
.agent-ability{font-size:9px;color:#a0f;margin-top:2px}
#shop-menu{justify-content:flex-start;padding-top:20px;padding-bottom:80px}
#shop-menu h2{position:sticky;top:0;background:rgba(0,0,0,0.97);padding:10px;z-index:101;width:100%;text-align:center;font-size:24px;color:#ffcc00;border-bottom:2px solid #ffcc00}
#shop-items{width:100%;max-width:500px;overflow-y:auto;flex:1;padding:10px 15px 100px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-item{background:linear-gradient(135deg,rgba(255,204,0,0.2),rgba(255,204,0,0.08));border:2px solid #ffcc00;padding:12px;margin:8px 0;width:100%;display:flex;justify-content:space-between;align-items:center;border-radius:10px}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:16px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:4px}
.shop-item button{background:linear-gradient(180deg,#0f0,#0a0);color:#000;border:none;padding:10px 18px;font-size:14px;font-weight:bold;border-radius:6px;cursor:pointer;min-width:110px}
.shop-item button:disabled{background:#555;color:#888}
.shop-item button.owned{background:linear-gradient(180deg,#888,#555);color:#fff}
#close-shop{background:linear-gradient(180deg,#f00,#900);color:#fff;border:none;padding:14px 35px;font-size:17px;font-weight:bold;border-radius:10px;cursor:pointer;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:102;min-width:220px}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.7);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000,0 0 30px currentColor;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
#bomb-status{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,0.8);padding:8px 20px;border:2px solid #f00;border-radius:5px;font-size:18px;color:#fff;display:none;z-index:15;pointer-events:none;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.lock-info{font-size:11px;color:#f55;margin-top:3px}
</style>
</head>
<body>
<div id="bloom"></div><div id="vignette"></div><div id="damage-overlay"></div><div id="blind-overlay"></div><div id="shock-overlay"></div><div id="critical-overlay"></div><div id="chromatic"></div>
<div id="crosshair"></div><div id="hit-marker">✕</div><div id="round-msg"></div><div id="bomb-status">💣 <span id="bomb-timer">40</span>с</div>
<div id="round-info"><span id="round-title">РАУНД 1</span> | <span id="round-timer">1:45</span><div id="team-score"><span class="ct-score">CT: <span id="ct-score">0</span></span><span class="t-score">T: <span id="t-score">0</span></span></div></div>
<div id="hud"><div id="hud-left">HP: <span id="hp">100</span><div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div><div style="margin-top:3px">💰 <span id="money">800</span></div><div style="font-size:12px">🛡️ <span id="armor">0</span>%</div><div style="font-size:11px;color:#a0f">✨ <span id="ability-name">-</span></div><div id="ability-bar"><div id="ability-fill" style="width:100%"></div></div></div><div id="hud-right"><div id="weapon-name">GLOCK</div><span id="ammo">20</span>/<span id="reserve">60</span><br>СЧЕТ: <span id="score">0</span> | K: <span id="kills">0</span></div></div>
<div id="kill-feed"></div><canvas id="minimap" width="120" height="120"></canvas><div id="respawn-timer"></div>
<div id="zeus-ammo">⚡ <span id="zeus-charges">1</span>/1</div><div id="ability-info"></div><div id="grenade-info">💣 <span id="grenade-count">0</span></div>
<div id="pick-prompt">[E] Подобрать</div><div id="door-prompt">[E] Дверь</div>
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="fire-btn" class="action-btn">ОГОНЬ</button><button id="jump-btn" class="action-btn">ПРЫГ</button><button id="slide-btn" class="action-btn">⤵</button><button id="reload-btn" class="action-btn">R</button><button id="weapon-switch-btn" class="action-btn">🔄</button><button id="ability-btn" class="action-btn">✨</button><button id="zeus-btn" class="action-btn">⚡</button><button id="knife-btn" class="action-btn">🔪</button><button id="grenade-btn" class="action-btn">💣</button><button id="shop-btn" class="action-btn">🛒</button><button id="settings-btn">⚙</button><button id="fullscreen-btn">⛶</button>
<div id="lobby" class="screen active"><h1>MINI STRIKE PRO</h1><div class="version-tag">ВЕРСИЯ 6.0</div><h2>РЕЖИМ</h2><button class="btn-mode" data-mode="bomb">💣 ЗАКЛАДКА БОМБЫ</button><button class="btn-mode" data-mode="dm">⚔️ КОМАНДНЫЙ БОЙ</button><h2>КАРТА</h2><div id="map-list"></div><h2>АГЕНТ</h2><div id="agent-list"></div><div style="margin:15px 0;font-size:13px;color:#aaa">Побед: <span id="total-wins">0</span></div><button class="btn-main" id="play-btn">В БОЙ!</button></div>
<div id="shop-menu" class="screen"><h2>МАГАЗИН</h2><div id="shop-items"></div><button id="close-shop">ЗАКРЫТЬ</button></div>
<div id="round-end" class="screen"><h1 id="round-end-title">РАУНД ОКОНЧЕН</h1><div id="round-end-stats"></div><button class="btn-main" id="next-round-btn">ДАЛЕЕ</button></div>
<div id="end-menu" class="screen"><h1 id="end-title">ИГРА ОКОНЧЕНА</h1><div id="end-stats"></div><button class="btn-main" id="restartBtn">В ЛОББИ</button></div>
