<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Strike Pro</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#ffcc00}
canvas{display:block;position:absolute;top:0;left:0;width:100vw;height:100vh;filter:contrast(1.1) saturate(1.2) brightness(1.05)}
#bloom{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:0.2;background:radial-gradient(ellipse at center,rgba(255,200,100,0.3) 0%,transparent 70%)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.75) 100%)}
#damage-overlay{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,0) 100%);transition:background 0.3s}
#blind-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;background:rgba(255,255,255,0);transition:background 0.3s}
#hud{position:absolute;top:10px;left:10px;right:10px;font-size:14px;text-shadow:1px 1px 0 #000;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#hud-left,#hud-right{background:rgba(0,0,0,0.75);padding:8px;border-radius:5px;border:1px solid #ffcc00;backdrop-filter:blur(3px)}
#hp-bar{width:120px;height:10px;background:#300;border:1px solid #ffcc00;margin-top:3px}
#hp-fill{height:100%;background:linear-gradient(90deg,#0f0,#5f5);transition:width 0.2s}
#round-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:8px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:10;pointer-events:none}
#team-score{display:flex;gap:20px;margin-top:5px}
.ct-score{color:#5af;text-shadow:0 0 8px #5af}.t-score{color:#f55;text-shadow:0 0 8px #f55}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:5}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,0,0.95);box-shadow:0 0 4px #0f0}
#crosshair::before{left:11px;top:0;width:2px;height:24px}
#crosshair::after{top:11px;left:0;height:2px;width:24px}
#joystick-zone{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;pointer-events:auto;z-index:20;background:rgba(0,0,0,0.2)}
#joystick-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;background:radial-gradient(circle,rgba(255,204,0,0.8),rgba(255,204,0,0.3));border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.action-btn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,0.5);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;font-family:inherit}
#fire-btn{bottom:30px;right:20px;width:80px;height:80px;background:radial-gradient(circle,rgba(255,50,50,0.6),rgba(200,0,0,0.3));font-size:14px}
#reload-btn{bottom:130px;right:30px;width:55px;height:55px;background:radial-gradient(circle,rgba(50,150,255,0.6),rgba(0,100,200,0.3));font-size:12px}
#shop-btn{bottom:200px;right:40px;width:50px;height:50px;background:radial-gradient(circle,rgba(255,200,0,0.6),rgba(200,150,0,0.3));font-size:12px}
#jump-btn{bottom:30px;right:115px;width:60px;height:60px;background:radial-gradient(circle,rgba(0,200,100,0.6),rgba(0,150,50,0.3));font-size:11px}
#grenade-btn{bottom:200px;right:115px;width:55px;height:55px;background:radial-gradient(circle,rgba(150,100,255,0.6),rgba(100,50,200,0.3));font-size:10px}
#plant-btn,#defuse-btn{bottom:280px;right:40px;width:60px;height:60px;font-size:10px;display:none}
#plant-btn{background:radial-gradient(circle,rgba(255,150,0,0.8),rgba(200,100,0,0.4))}
#defuse-btn{background:radial-gradient(circle,rgba(0,150,255,0.8),rgba(0,100,200,0.4))}
#fullscreen-btn{position:absolute;top:10px;right:10px;width:40px;height:40px;background:rgba(0,200,0,0.4);border:2px solid #0f0;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:20;cursor:pointer}
#weapon-name{position:absolute;bottom:120px;right:110px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000;pointer-events:none;z-index:10}
#spectate-info{position:absolute;top:50%;left:50%;transform:translate(-50%,-100px);background:rgba(0,0,0,0.8);padding:10px 20px;border:2px solid #ffcc00;border-radius:5px;font-size:16px;text-align:center;z-index:15;pointer-events:none;display:none}
#respawn-timer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#f55;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;display:none}
#minimap{position:absolute;bottom:10px;right:10px;width:120px;height:120px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:5px;pointer-events:none;z-index:15}
#kill-streak{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#ff0;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:15;opacity:0;transition:opacity 0.3s}
.screen{position:absolute;inset:0;background:rgba(0,0,0,0.95);color:#ffcc00;display:none;flex-direction:column;align-items:center;z-index:100;font-size:14px;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.active{display:flex}
.screen h1{font-size:28px;margin:10px 0;color:#ff3300;text-shadow:0 0 20px rgba(255,50,0,0.8)}
.screen h2{font-size:18px;margin:10px 0 8px;color:#ffcc00}
.btn-main{background:linear-gradient(180deg,#ffcc00,#cc9900);color:#000;border:none;padding:14px 36px;font-size:18px;font-weight:bold;margin:8px;border-radius:8px;cursor:pointer;min-width:200px}
.btn-mode{background:linear-gradient(180deg,#5af,#28a);color:#fff;border:none;padding:12px 30px;font-size:16px;font-weight:bold;margin:6px;border-radius:8px;cursor:pointer;min-width:250px}
.btn-map{background:rgba(255,204,0,0.2);border:2px solid #ffcc00;padding:10px;margin:5px;border-radius:8px;cursor:pointer;min-width:180px;color:#fff}
.btn-map.selected{background:rgba(0,255,0,0.3);border-color:#0f0}
.btn-agent{background:rgba(100,100,100,0.3);border:2px solid #888;padding:8px;margin:4px;border-radius:8px;cursor:pointer;min-width:220px;color:#fff;display:flex;align-items:center;gap:10px}
.btn-agent.selected{border-color:#0f0;background:rgba(0,255,0,0.2)}
.btn-agent.locked{opacity:0.5}
.agent-preview{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.agent-bonus{font-size:10px;color:#0f0;margin-top:2px}
#shop-menu{justify-content:flex-start;padding-top:20px;padding-bottom:80px}
#shop-menu h2{position:sticky;top:0;background:rgba(0,0,0,0.95);padding:10px;z-index:101;width:100%}
#shop-items{width:100%;max-width:500px;overflow-y:auto;flex:1;padding-bottom:20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.shop-item{background:rgba(255,204,0,0.1);border:2px solid #ffcc00;padding:10px;margin:6px 0;width:100%;display:flex;justify-content:space-between;align-items:center;border-radius:8px}
.shop-item-info{text-align:left;flex:1}
.shop-item-name{font-size:15px;font-weight:bold;color:#fff}
.shop-item-desc{font-size:11px;color:#aaa;margin-top:3px}
.shop-item button{background:linear-gradient(180deg,#0f0,#0a0);color:#000;border:none;padding:8px 15px;font-size:13px;font-weight:bold;border-radius:5px;cursor:pointer;min-width:100px}
.shop-item button:disabled{background:#555;color:#888}
#close-shop{background:linear-gradient(180deg,#f00,#900);color:#fff;border:none;padding:12px 30px;font-size:16px;border-radius:8px;cursor:pointer;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:102;min-width:200px}
#hit-marker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f00;font-size:50px;font-weight:bold;opacity:0;pointer-events:none;z-index:15}
#kill-feed{position:absolute;top:60px;right:10px;color:#fff;font-size:13px;pointer-events:none;z-index:10;text-align:right}
.kill-msg{background:rgba(0,0,0,0.7);padding:3px 8px;margin:2px 0;border-radius:3px;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#round-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;text-shadow:3px 3px 0 #000;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.3s}
#bomb-status{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(200,0,0,0.8);padding:8px 20px;border:2px solid #f00;border-radius:5px;font-size:18px;color:#fff;display:none;z-index:15;pointer-events:none;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.lock-info{font-size:11px;color:#f55;margin-top:3px}
.rank-badge{display:inline-block;padding:3px 8px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#000;border-radius:3px;font-weight:bold;margin-left:5px}
</style>
</head>
<body>

<span id="ammo">20</span>/<span id="reserve">60</span><br>СЧЕТ: <span id="score">0</span> | K: <span id="kills">0</span></div></div>

<div id="joystick-zone"><div id="joystick-knob"></div></div>

<button id="grenade-btn" class="action-btn">💣</button>
<button id="shop-btn" class="action-btn">🛒</button>
<button id="plant-btn" class="action-btn">💣</button>
<button id="defuse-btn" class="action-btn">🔧</button>
<button id="fullscreen-btn">⛶</button>
<div id="lobby" class="screen active">
<h1>MINI STRIKE PRO</h1>
<h2>РЕЖИМ</h2>
<button class="btn-mode" data-mode="bomb">💣 ЗАКЛАДКА БОМБЫ</button>

</div>
<div id="shop-menu" class="screen"><h2>МАГАЗИН</h2><div id="shop-items"></div><button id="close-shop">ЗАКРЫТЬ</button></div>
<div id="round-end" class="screen"><h1 id="round-end-title">РАУНД ОКОНЧЕН</h1><div id="round-end-stats"></div><button class="btn-main" id="next-round-btn">ДАЛЕЕ</button></div>
<div id="end-menu" class="screen"><h1 id="end-title">ИГРА ОКОНЧЕНА</h1><div id="end-stats"></div><button class="btn-main" id="restartBtn">В ЛОББИ</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window);
var gameState='LOBBY',gameMode='bomb',selectedMap='inferno',selectedAgent=0;
var totalWins=parseInt(localStorage.getItem('ms_wins')||'0');
var killStreak=0;
var agents=[
{name:'РЕКРУТ',color:0x4488cc,wins:0,speedBonus:0,hpBonus:0,accuracyBonus:0,desc:'Базовый агент'},
{name:'SAS',color:0x2244aa,wins:3,speedBonus:0.08,hpBonus:0,accuracyBonus:0.03,desc:'+8% скорость, +3% точность'},
{name:'GIGN',color:0x555577,wins:7,speedBonus:0,hpBonus:15,accuracyBonus:0.05,desc:'+15 HP, +5% точность'},
{name:'IDF',color:0x886644,wins:15,speedBonus:0.12,hpBonus:10,accuracyBonus:0,desc:'+12% скорость, +10 HP'},
{name:'SEAL',color:0x224422,wins:25,speedBonus:0.05,hpBonus:20,accuracyBonus:0.08,desc:'+20 HP, +8% точность'},
{name:'ЭЛИТА',color:0xddaa00,wins:50,speedBonus:0.15,hpBonus:25,accuracyBonus:0.1,desc:'+25 HP, +15% скорость, +10% точность'}
];
var ranks=[{name:'СЕРЕБРО I',wins:0},{name:'СЕРЕБРО II',wins:3},{name:'СЕРЕБРО ЭЛИТА',wins:7},{name:'Золотая Нова',wins:12},{name:'МАГИСТР',wins:20},{name:'ЛЕГЕНДА ОРЛА',wins:30},{name:'ЛЕГ. ВЫСШ.',wins:50},{name:'ГЛОБАЛ ЭЛИТА',wins:100}];
var mapsByMode={bomb:['inferno','dust2','mirage','cache'],dm:['nuke','vertigo','train','overpass']};
var scene=new THREE.Scene();scene.background=new THREE.Color(0xd4a574);scene.fog=new THREE.FogExp2(0xd4a574,0.008);
var camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffeecc,0x886644,0.9));
scene.add(new THREE.AmbientLight(0xffddaa,0.4));
var sun=new THREE.DirectionalLight(0xffeecc,1.2);sun.position.set(60,120,50);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;sun.shadow.bias=-0.0003;scene.add(sun);
var fillLight=new THREE.DirectionalLight(0x88aacc,0.4);fillLight.position.set(-40,60,-30);scene.add(fillLight);
var particles=[],bulletHoles=[];
function createParticle(opts){var geo=opts.geo||new THREE.SphereGeometry(0.05,4,4);var mat=opts.mat||new THREE.MeshBasicMaterial({color:opts.color||0xffff00});var mesh=new THREE.Mesh(geo,mat);mesh.position.copy(opts.pos);scene.add(mesh);particles.push({mesh:mesh,vel:opts.vel||new THREE.Vector3(),life:opts.life||2,maxLife:opts.life||2,gravity:opts.gravity!==undefined?opts.gravity:9.8,onDeath:opts.onDeath});return mesh;}
function ejectShell(pos){var geo=new THREE.CylinderGeometry(0.02,0.02,0.08,6);var mat=new THREE.MeshStandardMaterial({color:0xddaa44,metalness:0.9,roughness:0.2});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*2,3+Math.random()*2,(Math.random()-0.5)*2),life:3});}
function createBlood(pos){for(var i=0;i<8;i++){var geo=new THREE.SphereGeometry(0.05+Math.random()*0.05,4,4);var mat=new THREE.MeshBasicMaterial({color:0xaa0000,transparent:true,opacity:0.8});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*3,Math.random()*3,(Math.random()-0.5)*3),life:1.5});}}
function createBulletHole(pos,normal){var geo=new THREE.CircleGeometry(0.08,8);var mat=new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:0.8,side:THREE.DoubleSide});var hole=new THREE.Mesh(geo,mat);hole.position.copy(pos);if(normal)hole.lookAt(pos.clone().add(normal));hole.position.add(normal.clone().multiplyScalar(0.01));scene.add(hole);bulletHoles.push({mesh:hole,life:15});if(bulletHoles.length>50){var old=bulletHoles.shift();scene.remove(old.mesh);}}
function createMuzzleFlash(pos){var geo=new THREE.SphereGeometry(0.15,6,6);var mat=new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:1});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3(0,0,0),life:0.08,gravity:0});var light=new THREE.PointLight(0xffaa00,3,8);light.position.copy(pos);scene.add(light);setTimeout(function(){scene.remove(light);},50);}
function createSmoke(pos){var geo=new THREE.SphereGeometry(0.5,8,8);var mat=new THREE.MeshBasicMaterial({color:0xcccccc,transparent:true,opacity:0.6});createParticle({geo:geo,mat:mat,pos:pos.clone(),vel:new THREE.Vector3((Math.random()-0.5)*0.5,0.5+Math.random()*0.5,(Math.random()-0.5)*0.5),life:8,gravity:-0.3});}
function updateParticles(dt){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;if(p.life<=0){scene.remove(p.mesh);if(p.onDeath){try{p.onDeath();}catch(e){console.error(e);}}particles.splice(i,1);continue;}p.vel.y-=p.gravity*dt;p.mesh.position.add(p.vel.clone().multiplyScalar(dt));if(p.mesh.position.y<0.05){p.mesh.position.y=0.05;p.vel.y*=-0.3;p.vel.x*=0.7;p.vel.z*=0.7;}if(p.mesh.material.transparent)p.mesh.material.opacity=p.life/p.maxLife;p.mesh.rotation.x+=dt*5;p.mesh.rotation.y+=dt*3;}for(var i=bulletHoles.length-1;i>=0;i--){bulletHoles[i].life-=dt;if(bulletHoles[i].life<=0){scene.remove(bulletHoles[i].mesh);bulletHoles.splice(i,1);}else if(bulletHoles[i].life<3)bulletHoles[i].mesh.material.opacity=bulletHoles[i].life/3*0.8;}}
function makeTex(base,line,size,type){if(!size)size=256;var c=document.createElement('canvas');c.width=c.height=size;var ctx=c.getContext('2d');var grad=ctx.createLinearGradient(0,0,size,size);grad.addColorStop(0,base);grad.addColorStop(1,line);ctx.fillStyle=grad;ctx.fillRect(0,0,size,size);for(var i=0;i<800;i++){ctx.fillStyle='rgba(0,0,0,'+(Math.random()*0.25)+')';ctx.beginPath();ctx.arc(Math.random()*size,Math.random()*size,Math.random()*2,0,6.28);ctx.fill();}if(type==='brick'){ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=2;for(var y=0;y<size;y+=32){var off=(y/32)%2===0?0:32;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(size,y);ctx.stroke();for(var x=off;x<size;x+=64){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+32);ctx.stroke();}}}else if(type==='wood'){ctx.strokeStyle='rgba(40,20,0,0.4)';ctx.lineWidth=1;for(var i=0;i<30;i++){var y=Math.random()*size;ctx.beginPath();ctx.moveTo(0,y);for(var x=0;x<size;x+=20)ctx.lineTo(x,y+(Math.random()-0.5)*5);ctx.stroke();}}else if(type==='metal'){ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;for(var i=0;i<20;i++){ctx.beginPath();var x=Math.random()*size,y=Math.random()*size;ctx.moveTo(x,y);ctx.lineTo(x+(Math.random()-0.5)*100,y+(Math.random()-0.5)*100);ctx.stroke();}}else if(type==='concrete'){ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=2;for(var i=0;i<8;i++){ctx.beginPath();var x=Math.random()*size,y=Math.random()*size;ctx.moveTo(x,y);for(var j=0;j<5;j++){x+=(Math.random()-0.5)*50;y+=(Math.random()-0.5)*50;ctx.lineTo(x,y);}ctx.stroke();}}var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
var sandTex=makeTex('#c9a57a','#8b6f47',256,'brick');
var woodTex=makeTex('#6b4423','#3d2410',256,'wood');

function respawnPlayer(){var spawn=mapSpawns[player.team];player.pos.set(spawn.x+(Math.random()-0.5)*6,1.7,spawn.z+(Math.random()-0.5)*6);player.hp=player.maxHp;player.alive=true;player.vel.set(0,0,0);player.onGround=true;player.respawnTimer=0;player.blindTimer=0;gameState='PLAYING';var rt=document.getElementById('respawn-timer');if(rt)rt.style.display='none';for(var k in player.weapons)player.weapons[k].ammo=player.weapons[k].maxAmmo;if(!isMobile)renderer.domElement.requestPointerLock();}
function updateMinimap(){var canvas=document.getElementById('minimap'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,120,120);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,120,120);var scale=0.85,cx=60,cy=60;ctx.fillStyle='rgba(150,150,150,0.5)';walls.forEach(function(w){var x=cx+(w.position.x-player.pos.x)*scale;var y=cy+(w.position.z-player.pos.z)*scale;var ww=w.userData.w*scale;var dd=w.userData.d*scale;if(x>-30&&x<150&&y>-30&&y<150)ctx.fillRect(x-ww/2,y-dd/2,ww,dd);});allBots.forEach(function(b){if(b.userData.alive&&b.userData.team===player.team){var x=cx+(b.position.x-player.pos.x)*scale;var y=cy+(b.position.z-player.pos.z)*scale;if(x>0&&x<120&&y>0&&y<120){ctx.fillStyle='#5af';ctx.beginPath();ctx.arc(x,y,2.5,0,6.28);ctx.fill();}}});allBots.forEach(function(b){if(b.userData.alive&&b.userData.team!==player.team){var d=b.position.distanceTo(player.pos);if(d<25){var x=cx+(b.position.x-player.pos.x)*scale;var y=cy+(b.position.z-player.pos.z)*scale;if(x>0&&x<120&&y>0&&y<120){ctx.fillStyle='#f55';ctx.beginPath();ctx.arc(x,y,2.5,0,6.28);ctx.fill();}}}});ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(cx,cy,3,0,6.28);ctx.fill();ctx.strokeStyle='#0f0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-Math.sin(player.yaw)*8,cy-Math.cos(player.yaw)*8);ctx.stroke();}
var roundNum=1,ctScore=0,tScore=0,roundTime=105,roundTimer=roundTime,gameOver=false,MAX_ROUNDS=10;
function startMatch(){initAudio();document.getElementById('lobby').classList.remove('active');loadMap(selectedMap);roundNum=1;ctScore=0;tScore=0;player.score=0;player.kills=0;player.deaths=0;killStreak=0;if(gameMode==='dm')player.money=999999;else player.money=800;player.maxHp=100+agents[selectedAgent].hpBonus;player.armor=0;player.currentWeapon='glock';player.weapons={glock:{name:'GLOCK-18',damage:22,fireRate:150,ammo:20,maxAmmo:20,reserve:60,reloadTime:1800,spread:0.02,type:'pistol'}};player.grenades={he:0,flash:0,smoke:0,molotov:0};swW();startRound();}
function startRound(){var spawn=mapSpawns.ct;player.pos.set(spawn.x,1.7,spawn.z);player.yaw=0;player.pitch=0;player.maxHp=100+agents[selectedAgent].hpBonus;player.hp=player.maxHp;player.alive=true;player.reloading=false;player.vel.set(0,0,0);player.onGround=true;player.team='CT';player.blindTimer=0;gameState='PLAYING';for(var k in player.weapons)player.weapons[k].ammo=player.weapons[k].maxAmmo;allBots.forEach(function(b){scene.remove(b);});allBots=[];var routes=routesByMap[selectedMap];createBot('CT','АЛЕКС',routes.ctToA);createBot('CT','ВИКТОР',routes.ctToB);createBot('CT','МАКС',routes.ctToMid);createBot('T','ИВАН',routes.tToA,gameMode==='bomb');createBot('T','ДМИТРИЙ',routes.tToB);createBot('T','СЕРГЕЙ',routes.tToMid);createBot('T','АНДРЕЙ',routes.tToA);createBot('T','НИКОЛАЙ',routes.tToB);bomb.planted=false;bomb.defusing=false;bomb.defuseProgress=0;bomb.mesh.visible=false;document.getElementById('bomb-status').style.display='none';if(gameMode==='bomb'){var tBots=allBots.filter(function(b){return b.userData.team==='T';});tBots.forEach(function(b){b.userData.hasBomb=false;});tBots[Math.floor(Math.random()*tBots.length)].userData.hasBomb=true;}roundActive=true;roundTimer=gameMode==='dm'?300:roundTime;document.getElementById('round-title').textContent=gameMode==='dm'?'DM: '+selectedMap.toUpperCase():'РАУНД '+roundNum;prevTime=performance.now();showRM(gameMode==='bomb'?'РАУНД '+roundNum:'DEATHMATCH',2000);if(!isMobile)renderer.domElement.requestPointerLock();}
function endRound(winner){roundActive=false;if(winner==='CT'){ctScore++;if(gameMode==='bomb'){player.money+=3000;totalWins++;localStorage.setItem('ms_wins',totalWins);}else player.money+=500;showRM('ПОБЕДА CT!',2500);}else{tScore++;if(gameMode==='bomb')player.money+=1400;else player.money+=500;showRM('ПОБЕДА T!',2500);}player.money+=500;if(player.money>16000&&gameMode==='bomb')player.money=16000;updHUD();setTimeout(function(){if(gameMode==='dm')showGameOver();else if(roundNum>=MAX_ROUNDS||ctScore>=6||tScore>=6)showGameOver();else showRE(winner);},2500);}
function showRM(t,d){var m=document.getElementById('round-msg');m.textContent=t;m.style.opacity='1';m.style.color=t.indexOf('CT')>-1?'#5af':(t.indexOf('T')>-1?'#f55':'#ffcc00');setTimeout(function(){m.style.opacity='0';},d);}
function showRE(w){document.getElementById('round-end').classList.add('active');document.getElementById('round-end-title').textContent=w==='CT'?'РАУНД ЗА CT':'РАУНД ЗА T';document.getElementById('round-end-title').style.color=w==='CT'?'#5af':'#f55';document.getElementById('round-end-stats').innerHTML='<div style="font-size:16px;margin:12px 0;line-height:1.8">CT '+ctScore+' - '+tScore+' T<br>УБИЙСТВ: '+player.kills+'<br>💰 '+player.money+'</div>';}
function showGameOver(){gameOver=true;document.getElementById('end-menu').classList.add('active');var w;if(gameMode==='dm'){w=player.kills>10;if(w){totalWins++;localStorage.setItem('ms_wins',totalWins);}document.getElementById('end-title').textContent=w?'ПОБЕДА!':'ПОРАЖЕНИЕ';}else{w=ctScore>tScore;document.getElementById('end-title').textContent=w?'ПОБЕДА!':'ПОРАЖЕНИЕ';}document.getElementById('end-title').style.color=w?'#0f0':'#f00';document.getElementById('end-stats').innerHTML='<div style="font-size:16px;margin:12px 0;line-height:1.8">'+(gameMode==='dm'?'УБИЙСТВ: '+player.kills+'<br>СМЕРТЕЙ: '+player.deaths:'CT: '+ctScore+' - T: '+tScore+'<br>УБИЙСТВ: '+player.kills)+'<br>СЧЕТ: '+player.score+'<br>💰 '+player.money+'<br><br>Ранг: <span class="rank-badge">'+getRank().name+'</span><br>Всего побед: '+totalWins+'</div>';}
var prevTime=performance.now(),stepTimer=0;
function update(){requestAnimationFrame(update);if(gameState==='LOBBY'||gameState==='SHOP'){renderer.render(scene,camera);return;}var now=performance.now(),dt=Math.min((now-prevTime)/1000,0.1);prevTime=now;if(gameState==='DEAD'&&gameMode==='dm'){player.respawnTimer-=dt;var rt=document.getElementById('respawn-timer');if(rt){var t=Math.ceil(Math.max(0,player.respawnTimer));rt.textContent=t>0?t:'ВОЗРОЖДЕНИЕ...';}if(player.respawnTimer<=0)respawnPlayer();}if(roundActive){roundTimer-=dt;var mn=Math.floor(roundTimer/60),sc=Math.floor(roundTimer%60);document.getElementById('round-timer').textContent=mn+':'+(sc<10?'0':'')+sc;if(roundTimer<=0){if(gameMode==='bomb')endRound(tScore<ctScore?'CT':'T');else endRound(player.kills>10?'CT':'T');return;}}if(gameMode==='bomb')updateBomb(dt);if(player.blindTimer>0){player.blindTimer-=dt;var overlay=document.getElementById('blind-overlay');var intensity=Math.min(1,player.blindTimer/2);overlay.style.background='rgba(255,255,255,'+intensity+')';if(player.blindTimer<=0)overlay.style.background='rgba(255,255,255,0)';}updateParticles(dt);if(player.alive&&roundActive&&!shopOpen&&gameState==='PLAYING'){var mx=0,mz=0;var agentSpeedBonus=1+agents[selectedAgent].speedBonus;if(isMobile){if(joystick.active){var fw=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));var rt=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));mx=(-joystick.dy)*fw.x+joystick.dx*rt.x;mz=(-joystick.dy)*fw.z+joystick.dx*rt.z;var l=Math.hypot(mx,mz);if(l>0){mx/=l;mz/=l;}mx*=5*dt*agentSpeedBonus;mz*=5*dt*agentSpeedBonus;}}else{var k=window.getKeys();if(k){var fw=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));var rt=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));if(k['KeyW']){mx+=fw.x;mz+=fw.z;}if(k['KeyS']){mx-=fw.x;mz-=fw.z;}if(k['KeyD']){mx+=rt.x;mz+=rt.z;}if(k['KeyA']){mx-=rt.x;mz-=rt.z;}var l=Math.hypot(mx,mz);if(l>0){mx/=l;mz/=l;}mx*=6*dt*agentSpeedBonus;mz*=6*dt*agentSpeedBonus;}}player.pos.x+=mx;player.pos.z+=mz;if(Math.hypot(mx,mz)>0.01&&player.onGround){stepTimer+=dt;if(stepTimer>0.4){snd('step');stepTimer=0;}}player.vel.y-=18*dt;player.pos.y+=player.vel.y*dt;var col=collideW(player.pos,player.vel,0.4);var groundY=col.standY>0?col.standY+1.7:1.7;if(player.pos.y<=groundY){player.pos.y=groundY;player.vel.y=0;player.onGround=true;}else player.onGround=false;player.pos.x=Math.max(-63,Math.min(63,player.pos.x));player.pos.z=Math.max(-63,Math.min(63,player.pos.z));if(gameMode==='bomb'){var plantBtn=document.getElementById('plant-btn'),defuseBtn=document.getElementById('defuse-btn');if(player.team==='T'&&player.hasBomb&&!bomb.planted){var onSite=false;for(var k in bombSites){var s=bombSites[k];if(Math.hypot(player.pos.x-s.x,player.pos.z-s.z)<s.r){onSite=true;break;}}if(plantBtn)plantBtn.style.display=onSite?'flex':'none';}else{if(plantBtn)plantBtn.style.display='none';}if(player.team==='CT'&&bomb.planted){var dist=Math.hypot(player.pos.x-bomb.position.x,player.pos.z-bomb.position.z);if(defuseBtn)defuseBtn.style.display=dist<3?'flex':'none';}else{if(defuseBtn)defuseBtn.style.display='none';bomb.defusing=false;}}}if(gameState==='PLAYING'||gameState==='DEAD'||gameState==='SHOP'){camera.position.copy(player.pos);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;}else if(gameState==='SPECTATING'&&spectateTarget&&spectateTarget.userData.alive){var offset=new THREE.Vector3(0,3,5);offset.applyAxisAngle(new THREE.Vector3(0,1,0),spectateTarget.rotation.y);camera.position.copy(spectateTarget.position).add(offset);camera.lookAt(spectateTarget.position.x,spectateTarget.position.y+1.5,spectateTarget.position.z);}if(firing&&player.alive&&gameState==='PLAYING')shoot();allBots.forEach(function(b){updBot(b,dt,now);});if(roundActive&&gameMode==='bomb'){var ctAlive=player.alive&&player.team==='CT',tAlive=false;allBots.forEach(function(b){if(b.userData.alive){if(b.userData.team==='CT')ctAlive=true;else tAlive=true;}});if(!bomb.planted){if(!ctAlive)endRound('T');else if(!tAlive)endRound('CT');}}if(now%100<20)updateMinimap();updHUD();renderer.render(scene,camera);}
function updHUD(){document.getElementById('hp').textContent=Math.max(0,Math.floor(player.hp));document.getElementById('hp-fill').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('hp-fill').style.background=player.hp>player.maxHp*0.5?'#0f0':player.hp>player.maxHp*0.25?'#ff0':'#f00';document.getElementById('armor').textContent=player.armor;document.getElementById('money').textContent=gameMode==='dm'?'∞':player.money;var wp=player.weapons[player.currentWeapon];document.getElementById('ammo').textContent=wp.ammo;document.getElementById('reserve').textContent=wp.reserve;document.getElementById('score').textContent=player.score;document.getElementById('kills').textContent=player.kills;document.getElementById('ct-score').textContent=ctScore;document.getElementById('t-score').textContent=tScore;document.getElementById('rank-display').innerHTML='<span class="rank-badge">'+getRank().name+'</span>';}
function toggleFS(){var e=document.documentElement;if(!document.fullscreenElement){if(e.requestFullscreen)e.requestFullscreen();else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();else if(e.mozRequestFullScreen)e.mozRequestFullScreen();else if(e.msRequestFullscreen)e.msRequestFullscreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(e.mozCancelFullScreen)e.mozCancelFullScreen();else if(e.msExitFullscreen)e.msExitFullscreen();}}
function handleResize(){var w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));}
window.addEventListener('resize',handleResize);
window.addEventListener('orientationchange',function(){setTimeout(handleResize,100);});
document.addEventListener('visibilitychange',function(){if(document.hidden)firing=false;});
bind('next-round-btn',function(){document.getElementById('round-end').classList.remove('active');roundNum++;startRound();});
bind('restartBtn',function(){document.getElementById('end-menu').classList.remove('active');document.getElementById('lobby').classList.add('active');gameState='LOBBY';gameOver=false;updateLobby();});
bind('close-shop',closeShop);
bind('fullscreen-btn',toggleFS);
updateLobby();loadMap('inferno');handleResize();renderer.render(scene,camera);update();
</script>
